<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voxel Pagoda — 五重の塔</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe8ff; }
  canvas { display: block; }
  #title {
    position: fixed; left: 20px; top: 16px; z-index: 2;
    font: 600 15px/1.5 "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    letter-spacing: .14em; color: rgba(74, 48, 56, .82);
    text-shadow: 0 1px 0 rgba(255,255,255,.55);
    pointer-events: none; user-select: none;
  }
  #title small { display: block; font-weight: 500; font-size: 11px; letter-spacing: .22em; opacity: .66; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"
  }
}
</script>
</head>
<body>
<div id="title">五重の塔<small>VOXEL PAGODA GARDEN</small></div>
<script type="module">
import * as THREE from 'three';

// ---------- renderer / scene / camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe8ff);
scene.fog = new THREE.Fog(0xcfe8ff, 95, 175);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- lights ----------
const sun = new THREE.DirectionalLight(0xfff1dc, 2.7);
sun.position.set(45, 70, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 10;
sun.shadow.camera.far = 220;
sun.shadow.camera.left = -58;
sun.shadow.camera.right = 58;
sun.shadow.camera.top = 58;
sun.shadow.camera.bottom = -58;
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.35;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xd9ecff, 0x8fae7a, 0.9));

// ---------- cube collection ----------
const groups = {};
function addCube(x, y, z, sx, sy, sz, group, color) {
  (groups[group] ||= []).push({ x, y, z, sx, sy, sz, color: color ?? null });
}

// ---------- ground ----------
addCube(0, -0.5, 0, 94, 1, 94, 'grass');

// ---------- stone platform ----------
addCube(0, 1, 0, 26, 2, 26, 'stone');
addCube(0, 2.75, 0, 20, 1.5, 20, 'stone2');

// ---------- stone path to the torii ----------
for (let z = 14.5; z <= 29.5; z += 3) addCube(0, 0.25, z, 2.4, 0.5, 2.4, 'stone2');

// ---------- scattered rocks ----------
for (const [rx, rz, rs] of [[-14, -6, 1.6], [12, 9, 1.2], [-9, 18, 1.0], [16, -12, 1.5], [-20, 5, 0.9], [8, 21, 0.8]])
  addCube(rx, rs / 2 - 0.08, rz, rs, rs * 0.8, rs, 'stone');

// ---------- pagoda ----------
const storyW = [14, 11, 8, 6, 4];
const storyH = [8, 7, 6, 5, 4];
const roofW  = [20, 16, 13, 10, 8];
let y = 3.5; // top of platform
for (let i = 0; i < 5; i++) {
  const w = storyW[i], h = storyH[i];
  addCube(0, y + h / 2, 0, w, h, w, 'wood');                       // body
  addCube(0, y + 0.55, 0, w + 0.7, 1.1, w + 0.7, 'lacquer');       // bracket band
  const wy = y + h * 0.55;
  if (i === 0) addCube(0, y + 2.3, w / 2 + 0.25, 2.6, 4.6, 0.5, 'door'); // main door, faces the torii
  for (const sx of [-1, 1]) addCube(sx * (w / 2 + 0.2), wy, 0, 0.4, 1.9, 1.6, 'window');
  addCube(0, wy, -(w / 2 + 0.2), 1.6, 1.9, 0.4, 'window');
  if (i > 0) addCube(0, wy, w / 2 + 0.2, 1.6, 1.9, 0.4, 'window');
  y += h;
  const rw = roofW[i];
  addCube(0, y + 0.5, 0, rw, 1, rw, 'roof');                        // eave slab
  addCube(0, y + 1.5, 0, rw - 4, 1, rw - 4, 'roof');                // ridge slab
  const c = rw / 2 - 0.75;                                          // upturned corner tips
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    addCube(sx * c, y + 1.5, sz * c, 1.5, 1, 1.5, 'roofTip');
    addCube(sx * c, y + 2.5, sz * c, 0.9, 1, 0.9, 'roofTip');
  }
  y += 2;
}
// ---------- spire (sorin) ----------
addCube(0, y + 0.5, 0, 2.6, 1, 2.6, 'gold');
addCube(0, y + 1.35, 0, 2.0, 0.7, 2.0, 'gold');
addCube(0, y + 2.0, 0, 1.5, 0.6, 1.5, 'gold');
addCube(0, y + 2.55, 0, 1.05, 0.5, 1.05, 'gold');
addCube(0, y + 2.95, 0, 0.7, 0.4, 0.7, 'gold');
addCube(0, y + 3.25, 0, 0.4, 0.3, 0.4, 'gold');

// ---------- torii gate ----------
const tz = 32;
for (const sx of [-5.5, 5.5]) {
  addCube(sx, 0.75, tz, 3, 1.5, 3, 'stone');      // pillar base
  addCube(sx, 6.25, tz, 2, 10.5, 2, 'toriiRed');  // pillar
}
addCube(0, 9.2, tz, 14.5, 1.1, 1.1, 'toriiRed');  // nuki tie beam
addCube(0, 10.7, tz, 1.7, 1.7, 0.6, 'plaque');    // plaque
addCube(0, 11.9, tz, 16.5, 1.0, 1.8, 'toriiRed'); // lower kasagi
addCube(0, 12.75, tz, 17.5, 1.1, 2.3, 'toriiDark'); // upper kasagi
for (const sx of [-8.25, 8.25]) addCube(sx, 13.45, tz, 2.3, 0.9, 2.3, 'toriiDark'); // upturned ends

// ---------- cherry blossom trees ----------
function blossomColor() {
  const c = new THREE.Color();
  c.setHSL(0.915 + (Math.random() - 0.5) * 0.05, 0.42 + Math.random() * 0.16, 0.70 + Math.random() * 0.15);
  return c;
}
function tree(tx, tz2) {
  addCube(tx, 1.2, tz2, 2.2, 2.4, 2.2, 'trunk');
  addCube(tx + 0.35, 3.4, tz2 + 0.2, 1.6, 2.6, 1.6, 'trunk');
  addCube(tx - 0.2, 5.6, tz2 - 0.2, 1.3, 2.4, 1.3, 'trunk');
  addCube(tx + 1.5, 6.3, tz2 + 0.7, 1.0, 1.5, 1.0, 'trunk');
  addCube(tx - 1.6, 6.9, tz2 - 0.6, 1.0, 1.3, 1.0, 'trunk');
  for (let i = 0; i < 95; i++) {
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    const dx = Math.sin(ph) * Math.cos(th), dy = Math.cos(ph) * 0.72, dz = Math.sin(ph) * Math.sin(th);
    const r = 2.2 + Math.pow(Math.random(), 0.65) * 4.2;
    const cx = Math.round(tx + dx * r * 1.15);
    const cy = Math.round(10.2 + dy * r);
    const cz = Math.round(tz2 + dz * r * 1.15);
    if (cy < 6) continue;
    const s = 1.1 + Math.random() * 1.1;
    addCube(cx, cy, cz, s, s * 0.9, s, 'blossom', blossomColor());
  }
}
tree(-30, -14);
tree(33, -4);
tree(-26, 26);

// ---------- pond ----------
const px = 24, pz = -22;
for (let gx = -9; gx <= 9; gx++) for (let gz = -9; gz <= 9; gz++) {
  const d = Math.hypot(gx, gz);
  if (d < 6.8) addCube(px + gx, 0.05, pz + gz, 1, 0.3, 1, 'water');
  else if (d < 8.2) addCube(px + gx, -0.02, pz + gz, 1, 0.26, 1, 'sand');
}
for (const [lx, lz] of [[22, -23.5], [26, -20.5], [24.5, -24.5]]) addCube(lx, 0.24, lz, 1.7, 0.12, 1.7, 'lily');
addCube(px + 8.6, 0.35, pz - 3.5, 1.3, 0.7, 1.3, 'stone');
addCube(px - 8.2, 0.3, pz + 5, 1.0, 0.6, 1.0, 'stone');

// ---------- fallen petals on the ground ----------
for (let i = 0; i < 46; i++) {
  const nearTree = Math.random() < 0.6;
  const t = [[-30, -14], [33, -4], [-26, 26]][i % 3];
  const fx = nearTree ? t[0] + (Math.random() - 0.5) * 15 : (Math.random() - 0.5) * 70;
  const fz = nearTree ? t[1] + (Math.random() - 0.5) * 15 : (Math.random() - 0.5) * 70;
  addCube(fx, 0.07, fz, 0.55, 0.08, 0.4, 'fallen', blossomColor());
}

// ---------- build instanced meshes ----------
const unitBox = new THREE.BoxGeometry(1, 1, 1);
const MATS = {
  grass:   { color: 0x84c46f },
  stone:   { color: 0xa3a9b0 },
  stone2:  { color: 0xbfc4ca },
  wood:    { color: 0x9a5b2d },
  lacquer: { color: 0x7c2d1e },
  door:    { color: 0x54331c },
  window:  { color: 0x3a2a1a, emissive: 0xffb054, emissiveIntensity: 0.85 },
  roof:    { color: 0x46536a },
  roofTip: { color: 0x5b6a86 },
  gold:    { color: 0xd7a13f },
  toriiRed:{ color: 0xb03427 },
  toriiDark: { color: 0x8c241b },
  plaque:  { color: 0x402418 },
  trunk:   { color: 0x6f4a2c },
  blossom: { color: 0xffffff },
  water:   { color: 0x57aed6 },
  sand:    { color: 0xcdd3cd },
  lily:    { color: 0x4f9147 },
  fallen:  { color: 0xffffff },
};
for (const [name, list] of Object.entries(groups)) {
  const spec = MATS[name];
  const tinted = list.some(c => c.color);
  const mat = new THREE.MeshLambertMaterial({ color: tinted ? 0xffffff : spec.color, emissive: spec.emissive ?? 0x000000, emissiveIntensity: spec.emissiveIntensity ?? 1 });
  const im = new THREE.InstancedMesh(unitBox, mat, list.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  list.forEach((c, i) => {
    p.set(c.x, c.y, c.z); s.set(c.sx, c.sy, c.sz);
    m.compose(p, q, s); im.setMatrixAt(i, m);
    if (c.color) im.setColorAt(i, c.color);
  });
  if (im.instanceColor) im.instanceColor.needsUpdate = true;
  im.castShadow = true;
  im.receiveShadow = true;
  scene.add(im);
}

// ---------- drifting petals ----------
const PETALS = 70;
const petalGeo = new THREE.BoxGeometry(1, 1, 1);
const petalMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
const petals = new THREE.InstancedMesh(petalGeo, petalMat, PETALS);
petals.castShadow = true;
scene.add(petals);
const petalData = [];
for (let i = 0; i < PETALS; i++) {
  petalData.push({
    x: (Math.random() * 2 - 1) * 46, y: 2 + Math.random() * 18, z: (Math.random() * 2 - 1) * 46,
    vy: 0.7 + Math.random() * 0.8,
    amp: 0.6 + Math.random() * 1.1, freq: 0.5 + Math.random() * 0.9,
    phase: Math.random() * Math.PI * 2,
    rx: Math.random() * Math.PI, ry: Math.random() * Math.PI, rz: Math.random() * Math.PI,
    vrx: (Math.random() - 0.5) * 3, vry: (Math.random() - 0.5) * 3, vrz: (Math.random() - 0.5) * 3,
  });
  petals.setColorAt(i, blossomColor());
}
petals.instanceColor.needsUpdate = true;
const pm = new THREE.Matrix4(), pq = new THREE.Quaternion(), pe = new THREE.Euler(), ps = new THREE.Vector3(), pp = new THREE.Vector3();
function updatePetals(t, dt) {
  for (let i = 0; i < PETALS; i++) {
    const p = petalData[i];
    p.y -= p.vy * dt;
    p.x += Math.sin(t * p.freq + p.phase) * p.amp * dt + 0.22 * dt;
    p.z += Math.cos(t * p.freq * 0.8 + p.phase) * p.amp * 0.7 * dt;
    p.rx += p.vrx * dt; p.ry += p.vry * dt; p.rz += p.vrz * dt;
    if (p.y < 0.12) { p.y = 13 + Math.random() * 11; p.x = (Math.random() * 2 - 1) * 46; p.z = (Math.random() * 2 - 1) * 46; }
    if (p.x > 47) p.x -= 94;
    pe.set(p.rx, p.ry, p.rz); pq.setFromEuler(pe);
    pp.set(p.x, p.y, p.z); ps.set(0.55, 0.09, 0.42);
    pm.compose(pp, pq, ps);
    petals.setMatrixAt(i, pm);
  }
  petals.instanceMatrix.needsUpdate = true;
}

// ---------- animate ----------
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  const a = t * 0.1; // slow orbit: one turn in ~63s
  camera.position.set(Math.sin(a) * 66, 32, Math.cos(a) * 66);
  camera.lookAt(0, 21, 0);
  updatePetals(t, dt);
  renderer.render(scene, camera);
}
frame();
</script>
</body>
</html>
