<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Voxel Pagoda Garden</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#a8ccec}
canvas{display:block}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

// ---------- deterministic PRNG ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(20260417);
const pick=a=>a[(rnd()*a.length)|0];

// ---------- cube collection ----------
const cubes=[];
function C(x,y,z,sx,sy,sz,c){cubes.push({x,y,z,sx,sy,sz,c});}

// ---------- palette ----------
const GRASS=['#6fae54','#7fbc63','#639f4b','#8cc973'];
const PINKS=['#f6b8cc','#f2a0bd','#fbcfde','#ef8fb4','#f7c3d4'];
const ROOF='#4e4038';
const WHITE='#f2ede3';
const RED='#c8362e';
const GOLD='#d9a520';
const TRUNK='#6e4b33';

// ---------- ground ----------
const G=64;
const pond={x:-12,z:11,r2:20};
const trees=[[-16,-8],[15,-9],[17,11],[-16,16],[12,17],[23,-19],[-24,7]];
for(let x=-G;x<=G;x++)for(let z=-G;z<=G;z++){
  if(Math.abs(x)<=10&&Math.abs(z)<=10)continue; // platform
  const pd=(x-pond.x)*(x-pond.x)+(z-pond.z)*(z-pond.z);
  if(pd<pond.r2)continue; // pond
  C(x,0,z,1,1,1,pick(GRASS));
}

// ---------- pond ----------
for(let x=-G;x<=G;x++)for(let z=-G;z<=G;z++){
  const d2=(x-pond.x)*(x-pond.x)+(z-pond.z)*(z-pond.z);
  if(d2<pond.r2)C(x,-0.15,z,1,0.5,1,d2<11?'#3f6ea3':'#4f86c2');
}
C(-13,0.26,10,1.2,0.15,1.2,'#79c46f');
C(-10,0.26,12,1.2,0.15,1.2,'#6fb862');
C(-12,0.26,8,1.1,0.15,1.1,'#79c46f');

// ---------- flowers and stones on grass ----------
for(let i=0;i<160;i++){
  const x=Math.round((rnd()*2-1)*58), z=Math.round((rnd()*2-1)*58);
  if(x*x+z*z>2900)continue;
  if(Math.abs(x)<=12&&Math.abs(z)<=12)continue;
  const pd=(x-pond.x)*(x-pond.x)+(z-pond.z)*(z-pond.z);
  if(pd<pond.r2+4)continue;
  if(z>12&&z<23&&Math.abs(x)<2)continue;
  C(x,0.55,z,0.35,0.35,0.35,rnd()<0.5?'#ffffff':'#f6b8cc');
}
for(let i=0;i<26;i++){
  const x=Math.round((rnd()*2-1)*58), z=Math.round((rnd()*2-1)*58);
  if(x*x+z*z>3200)continue;
  if(Math.abs(x)<=12&&Math.abs(z)<=12)continue;
  const pd=(x-pond.x)*(x-pond.x)+(z-pond.z)*(z-pond.z);
  if(pd<pond.r2+4)continue;
  C(x,0.6,z,0.7,0.5,0.7,'#9a958c');
}

// ---------- path to torii ----------
for(let z=13;z<=20;z++)C(0,0,z,1,1,1,'#cfc8ba');
C(-1,0,14,1,1,1,'#c6bfae');
C(1,0,17,1,1,1,'#c6bfae');

// ---------- stone platform ----------
for(let x=-10;x<=10;x++)for(let z=-10;z<=10;z++)C(x,0,z,1,1,1,rnd()<0.5?'#b9b4ab':'#aea89e');
for(let x=-8;x<=8;x++)for(let z=-8;z<=8;z++)C(x,1,z,1,1,1,rnd()<0.5?'#c2bdb4':'#b9b4ab');

// ---------- pagoda bodies ----------
function story(y0,h,half){
  for(let x=-half;x<=half;x++)for(let z=-half;z<=half;z++)for(let y=y0;y<y0+h;y++)
    C(x,y,z,1,1,1,WHITE);
}
story(2,4,4);
story(9,3,3);
story(15,3,2);
story(20,4,2);
story(26,4,1);

// red door on bottom story
C(0,3,4.7,1.4,2.6,0.4,RED);

// ---------- roofs with upturned eaves ----------
function roof(y,hw){
  for(let x=-hw;x<=hw;x++)for(let z=-hw;z<=hw;z++)C(x,y,z,1,1,1,ROOF);
  if(hw>=3){const h1=hw-1;for(let x=-h1;x<=h1;x++)for(let z=-h1;z<=h1;z++)C(x,y+1,z,1,1,1,ROOF);}
  if(hw>=5){const h2=hw-3;for(let x=-h2;x<=h2;x++)for(let z=-h2;z<=h2;z++)C(x,y+2,z,1,1,1,ROOF);}
  // upturned corners and eave midpoints
  C(-hw,y+1,-hw,1,1,1,ROOF);C(-hw,y+1,hw,1,1,1,ROOF);
  C(hw,y+1,-hw,1,1,1,ROOF);C(hw,y+1,hw,1,1,1,ROOF);
  C(-hw,y+1,0,1,1,1,ROOF);C(hw,y+1,0,1,1,1,ROOF);
  C(0,y+1,-hw,1,1,1,ROOF);C(0,y+1,hw,1,1,1,ROOF);
}
roof(6,6);
roof(12,5);
roof(18,4);
roof(24,4);
roof(30,3);

// ---------- spire (sorin) ----------
C(-1,32,-1,1,1,1,RED);C(0,32,-1,1,1,1,RED);C(1,32,-1,1,1,1,RED);
C(-1,32,0,1,1,1,RED);C(0,32,0,1,1,1,RED);C(1,32,0,1,1,1,RED);
C(-1,32,1,1,1,1,RED);C(0,32,1,1,1,1,RED);C(1,32,1,1,1,1,RED);
C(0,33,0,1,1,1,RED);
C(0,35,0,1,1,1,RED);
C(0,37,0,1,1,1,RED);
// gold rings
for(let x=-1;x<=1;x++)for(let z=-1;z<=1;z++)C(x,34,z,1,1,1,GOLD);
for(let x=-1;x<=1;x++)for(let z=-1;z<=1;z++)C(x,36,z,1,1,1,GOLD);
C(0,38,0,1,1,1,GOLD);
C(0,39,0,1,1,1,GOLD);

// ---------- cherry trees ----------
function tree(tx,tz){
  C(tx,1,tz,1.4,1,1.4,TRUNK);
  C(tx,2,tz,1.1,1,1.1,TRUNK);
  C(tx,3,tz,1,1,1,TRUNK);
  const cy=4.5;
  for(let dx=-3;dx<=3;dx++)for(let dz=-3;dz<=3;dz++)for(let dy=-1;dy<=2;dy++){
    const r=Math.sqrt(dx*dx+dz*dz);
    const dens=(dy===-1?0.7:dy===0?0.95:dy===1?0.8:0.5)*Math.max(0,1-r/3.7);
    if(rnd()<dens)C(tx+dx,cy+dy,tz+dz,1,1,1,pick(PINKS));
  }
}
for(const t of trees)tree(t[0],t[1]);

// ---------- torii gate ----------
const TX=0,TZ=21;
C(TX-2,0.7,TZ,2.2,0.7,2.2,'#b0aaa0');
C(TX+2,0.7,TZ,2.2,0.7,2.2,'#b0aaa0');
for(let y=1;y<=5;y++){C(TX-2,y,TZ,1,1,1,RED);C(TX+2,y,TZ,1,1,1,RED);}
for(let x=-4;x<=4;x++)C(TX+x,6,TZ,1,1,1,RED); // kasagi
C(TX-4.5,7,TZ,1,1,1,RED);C(TX+4.5,7,TZ,1,1,1,RED); // upturned ends
C(TX,6,TZ+0.65,0.9,0.9,0.3,'#f2ede3'); // emblem
for(let x=-3;x<=3;x++)C(TX+x,4.5,TZ,1,1,1,RED); // shimagi
C(TX,5,TZ,1,1,1,RED); // gakuzuka
for(let x=-2;x<=2;x++)C(TX+x,3,TZ,1,1,1,RED); // nuki

// ---------- build instanced meshes ----------
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color('#a8ccec');
scene.fog=new THREE.Fog('#a8ccec',95,190);

const camera=new THREE.PerspectiveCamera(64,window.innerWidth/window.innerHeight,0.5,400);
const ORBIT_R=52,ORBIT_Y=28,TARGET=new THREE.Vector3(0,17,0);
camera.position.set(0,ORBIT_Y,ORBIT_R);
camera.lookAt(TARGET);

const hemi=new THREE.HemisphereLight('#d8ecff','#6b9a55',1.0);
const sun=new THREE.DirectionalLight('#fff2d8',2.0);
sun.position.set(38,55,26);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-56,right:56,top:56,bottom:-56,near:5,far:200});
sun.shadow.bias=-0.0006;
sun.shadow.normalBias=0.5;
sun.target.position.set(0,8,0);
scene.add(hemi,sun,sun.target);

const boxGeo=new THREE.BoxGeometry(1,1,1);
const nonShadow=new Set(['#3f6ea3','#4f86c2','#79c46f','#6fb862','#ffc7da']);
const groups={};
for(const c of cubes)(groups[c.c]||(groups[c.c]=[])).push(c);
const M4=new THREE.Matrix4();
for(const col in groups){
  const arr=groups[col];
  const mat=new THREE.MeshStandardMaterial({color:col,roughness:0.95,metalness:0});
  const mesh=new THREE.InstancedMesh(boxGeo,mat,arr.length);
  arr.forEach((c,i)=>{M4.makeScale(c.sx,c.sy,c.sz);M4.setPosition(c.x,c.y,c.z);mesh.setMatrixAt(i,M4);});
  mesh.instanceMatrix.needsUpdate=true;
  mesh.castShadow=!nonShadow.has(col);
  mesh.receiveShadow=true;
  mesh.frustumCulled=false;
  scene.add(mesh);
}

// ---------- drifting petals ----------
const NP=140;
const petals=[];
for(let i=0;i<NP;i++)petals.push({
  x:(rnd()*2-1)*26,y:2+rnd()*16,z:(rnd()*2-1)*26,
  vy:0.7+rnd()*0.9,ph:rnd()*6.28,fr:0.6+rnd()*0.8,
  amp:0.5+rnd()*1.2,rot:rnd()*6.28,rv:0.5+rnd()*1.5,
  sx:0.3+rnd()*0.2,sz:0.2+rnd()*0.15
});
const petalMat=new THREE.MeshStandardMaterial({color:'#ffc7da',roughness:0.9});
const petalMesh=new THREE.InstancedMesh(boxGeo,petalMat,NP);
petalMesh.castShadow=false;petalMesh.receiveShadow=false;
petalMesh.frustumCulled=false;
scene.add(petalMesh);
const dummy=new THREE.Object3D();

// ---------- resize handling ----------
function fit(){
  const w=window.innerWidth,h=window.innerHeight;
  if(renderer.domElement.width!==w||renderer.domElement.height!==h){
    renderer.setSize(w,h);
    camera.aspect=w/h;camera.updateProjectionMatrix();
  }
}
window.addEventListener('resize',fit);

// ---------- animation loop ----------
const timer=new THREE.Timer();
let t=0;
function animate(){
  requestAnimationFrame(animate);
  timer.update();
  const dt=Math.min(timer.getDelta(),0.1);
  t=timer.getElapsed();
  fit();
  const a=0.12*t;
  camera.position.set(ORBIT_R*Math.sin(a),ORBIT_Y,ORBIT_R*Math.cos(a));
  camera.lookAt(TARGET);
  for(let i=0;i<NP;i++){
    const p=petals[i];
    p.y-=p.vy*dt;
    p.rot+=p.rv*dt;
    if(p.y<0.4){p.y=16+rnd()*6;p.x=(rnd()*2-1)*26;p.z=(rnd()*2-1)*26;}
    const x=p.x+Math.sin(t*p.fr+p.ph)*p.amp;
    const z=p.z+Math.cos(t*p.fr*0.9+p.ph)*p.amp*0.6;
    dummy.position.set(x,p.y,z);
    dummy.rotation.set(0.5+0.35*Math.sin(t*0.8+p.ph),p.rot,0.4+0.3*Math.cos(t*0.7+p.ph));
    dummy.scale.set(p.sx,0.12,p.sz);
    dummy.updateMatrix();
    petalMesh.setMatrixAt(i,dummy.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate=true;
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
