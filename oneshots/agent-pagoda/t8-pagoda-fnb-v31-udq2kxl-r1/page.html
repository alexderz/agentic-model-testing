<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voxel Pagoda - Five Stories</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#c3d7e4}
  canvas{display:block;position:fixed;top:0;left:0}
  #cap{position:fixed;left:14px;bottom:12px;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
       color:#2b3a45;letter-spacing:.08em;opacity:.5;pointer-events:none;user-select:none}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"}}
</script>
</head>
<body>
<div id="cap">VOXEL PAGODA &middot; FIVE STORIES &middot; SPRING</div>
<script type="module">
import * as THREE from 'three';

/* ---------- deterministic rng ---------- */
let _s = 987654321;
const rnd = () => { _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; };
const rr  = (a, b) => a + (b - a) * rnd();
const chance = p => rnd() < p;

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc6dae6, 74, 210);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 1, 600);

/* ---------- sky / environment ---------- */
function makeSky() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0.00, '#4d86c8');
  grad.addColorStop(0.28, '#7eaed8');
  grad.addColorStop(0.46, '#b8d4e8');
  grad.addColorStop(0.50, '#d6e6ef');
  grad.addColorStop(0.54, '#cfd8c8');
  grad.addColorStop(0.75, '#94ac7e');
  grad.addColorStop(1.00, '#6f8a5e');
  g.fillStyle = grad; g.fillRect(0, 0, 1024, 512);
  const sun = g.createRadialGradient(720, 120, 4, 720, 120, 190);
  sun.addColorStop(0, 'rgba(255,252,232,0.95)');
  sun.addColorStop(0.35, 'rgba(255,240,205,0.35)');
  sun.addColorStop(1, 'rgba(255,240,205,0)');
  g.fillStyle = sun; g.fillRect(400, 0, 624, 400);
  for (let i = 0; i < 26; i++) {
    const x = rr(0, 1024), y = rr(250, 300), w = rr(40, 120), h = rr(3, 7);
    g.fillStyle = 'rgba(255,255,255,0.05)';
    g.fillRect(x, y, w, h);
  }
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const skyTex = makeSky();
scene.background = skyTex;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromEquirectangular(skyTex).texture;
pmrem.dispose();

/* ---------- lights ---------- */
const sun = new THREE.DirectionalLight(0xfff1d8, 2.35);
sun.position.set(42, 70, 34);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -36; sun.shadow.camera.right = 36;
sun.shadow.camera.top = 36;  sun.shadow.camera.bottom = -36;
sun.shadow.camera.near = 20; sun.shadow.camera.far = 170;
sun.shadow.bias = -0.0007;
sun.shadow.normalBias = 0.45;
sun.shadow.radius = 1.6;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbdd6ea, 0x6d7a55, 0.42));
scene.add(new THREE.AmbientLight(0xffffff, 0.12));

/* ---------- voxel store ---------- */
const PAL = {
  grass:    [0x71a050, 0x7fae58, 0x659548, 0x86b25e],
  grassDry: [0x93a860, 0x8a9f57],
  dirt:     0x6f523a,
  stone:    [0xb9bcc1, 0xa9adb4, 0xc6cad0],
  stoneDim: [0x8e949c, 0x9aa0a8],
  path:     [0xc4c8cb, 0xb2b7bb, 0xd0d4d6],
  plaster:  [0xf5eddc, 0xefe4d0, 0xf8f2e5],
  timber:   0xc1442e,
  timberDk: 0x9d3324,
  slate:    0x4d5b78,
  slateLt:  0x5b6c8c,
  slateDk:  0x38425a,
  gold:     0xd9a63f,
  goldDk:   0xb0842e,
  dark:     0x39291f,
  verm:     0xd6452f,
  vermDk:   0xb13525,
  black:    0x2a2a2e,
  water:    0x4f9fd6,
  pink:     [0xf6c7d6, 0xf0adca, 0xfadce6, 0xe795b5, 0xfbd4e0],
  trunk:    [0x6d4b36, 0x5b3e2c, 0x7a5740]
};
const _c = new THREE.Color();
function tint(col, j) {
  const c = new THREE.Color(col), h = {};
  c.getHSL(h);
  c.setHSL((h.h + (rnd() - 0.5) * 0.012 + 1) % 1,
           Math.min(1, h.s * (0.9 + rnd() * 0.2)),
           Math.max(0.04, Math.min(0.96, h.l + (rnd() - 0.5) * j)));
  return c;
}
const cellIdx = new Map();
const cubes = [];
function V(x, y, z, col, j) {
  if (j === undefined) j = 0.06;
  x = Math.round(x); y = Math.round(y); z = Math.round(z);
  const k = x + ',' + y + ',' + z;
  const c = tint(col, j);
  if (cellIdx.has(k)) { cubes[cellIdx.get(k)].c = c; return; }
  cellIdx.set(k, cubes.length);
  cubes.push({ x: x, y: y, z: z, c: c });
}
const pick = a => a[(rnd() * a.length) | 0];
function ring(e) {
  const out = [];
  for (let dx = -e; dx <= e; dx++) for (let dz = -e; dz <= e; dz++)
    if (Math.max(Math.abs(dx), Math.abs(dz)) === e) out.push([dx, dz]);
  return out;
}
function fill(e) {
  const out = [];
  for (let dx = -e; dx <= e; dx++) for (let dz = -e; dz <= e; dz++) out.push([dx, dz]);
  return out;
}

/* ---------- layout helpers ---------- */
const G = 27;                                  // ground half-extent (disc radius)
const POND = { x: -15, z: 12, r: 6.6 };        // pond
const inPond = (x, z) => Math.hypot(x - POND.x, z - POND.z) < POND.r;
const onPath = (x, z) => z >= 11 && z <= 22 && Math.abs(x) <= 3;
const nearPondBank = (x, z) => { const d = Math.hypot(x - POND.x, z - POND.z); return d >= POND.r && d < POND.r + 1.4; };

/* ---------- ground ---------- */
for (let x = -G; x <= G; x++) for (let z = -G; z <= G; z++) {
  const r = Math.hypot(x, z);
  if (r > G) continue;
  const dx = x - POND.x, dz = z - POND.z, pd = Math.hypot(dx, dz);
  if (pd < POND.r + 0.5) continue;                    // pond hole (rim is inside 1.4)
  let col;
  if (nearPondBank(x, z)) col = pick(PAL.stoneDim);
  else if (onPath(x, z)) col = pick(PAL.path);
  else if (r > G - 1.5) col = pick(PAL.dirt);
  else if (chance(0.14)) col = pick(PAL.grassDry);
  else col = pick(PAL.grass);
  V(x, 0, z, col, 0.10);
}
/* a few flowers / pebbles */
for (let i = 0; i < 90; i++) {
  const a = rr(0, Math.PI * 2), r = rr(12, G - 2);
  const x = Math.round(Math.cos(a) * r), z = Math.round(Math.sin(a) * r);
  if (inPond(x, z) || onPath(x, z) || Math.hypot(x, z) > G - 1) continue;
  if (chance(0.5)) V(x, 1, z, pick([0xf2e6f7, 0xf7f0a0, 0xffffff]), 0.03);
}

/* subsoil block (keeps the ground solid below the voxel crust) */
const sub = new THREE.Mesh(new THREE.BoxGeometry((G + 3) * 2, 6, (G + 3) * 2),
  new THREE.MeshStandardMaterial({ color: 0x6b5240, roughness: 1 }));
sub.position.set(0, -3.5, 0);
sub.receiveShadow = true;
scene.add(sub);

/* ---------- stone platform ---------- */
for (let x = -10; x <= 10; x++) for (let z = -10; z <= 10; z++) {
  const edge = Math.max(Math.abs(x), Math.abs(z)) > 9;
  V(x, 1, z, edge ? pick(PAL.stoneDim) : pick(PAL.stone), 0.07);
}
for (let x = -9; x <= 9; x++) for (let z = -9; z <= 9; z++) {
  const edge = Math.max(Math.abs(x), Math.abs(z)) > 8;
  V(x, 2, z, edge ? pick(PAL.stoneDim) : pick(PAL.stone), 0.05);
}
/* front steps onto the platform */
for (let z = 11; z <= 12; z++) for (let x = -4; x <= 4; x++) V(x, 1, z, pick(PAL.stone), 0.06);
for (let x = -4; x <= 4; x++) V(x, 1, 13, pick(PAL.stoneDim), 0.06);

/* ---------- five story pagoda ---------- */
function story(i) {
  const hw = 7 - i;                 // 7,6,5,4,3
  const B  = 3 + 8 * i;             // body bottom level
  const y0 = B + 4;                 // eave slab level
  /* walls */
  for (let y = B; y <= B + 3; y++) {
    for (const [dx, dz] of ring(hw)) {
      const corner = Math.abs(dx) === hw && Math.abs(dz) === hw;
      const post   = (Math.abs(dx) % 3 === 0 && Math.abs(dz) === hw) ||
                     (Math.abs(dz) % 3 === 0 && Math.abs(dx) === hw);
      let col = PAL.plaster;
      if (y === B || y === B + 3) col = pick([PAL.timber, PAL.timberDk]);
      else if (corner) col = PAL.timber;
      else if (post)   col = pick([PAL.timber, PAL.timberDk]);
      else if (y === B + 1 && ((dx + 100) % 4 === 0 || (dz + 100) % 4 === 0) && chance(0.5)) col = PAL.dark;
      V(dx, y, dz, col, 0.05);
    }
  }
  /* doorway on the ground floor, front (+z) */
  if (i === 0) for (let y = B + 1; y <= B + 2; y++) for (let x = -1; x <= 1; x++) V(x, y, hw, PAL.dark, 0.02);
  /* 2 thick eave slab with upturned tips */
  const E = hw + 4, tips = i < 2 ? 3 : 2;
  for (const e of [E, E - 1]) {
    const outer = e === E;
    for (const [dx, dz] of ring(e)) {
      const cn = (Math.abs(dx) + Math.abs(dz)) / (2 * e);
      let lift = Math.round((cn - 0.60) * (outer ? 5.4 : 3.4));
      lift = Math.max(0, Math.min(tips - (outer ? 0 : 1), lift));
      for (let l = 0; l <= lift; l++) {
        V(dx, y0 + l, dz, l === lift ? (outer ? PAL.slateLt : PAL.slate) : PAL.slate, 0.05);
        if (l === 0) V(dx, y0 - 1, dz, PAL.slateDk, 0.04);
      }
    }
  }
  /* pyramid of tiles up to a solid roof deck */
  for (let e = E - 2; e >= hw; e--) {
    const y = y0 + (E - 1 - e);
    const cells = e === hw ? fill(e) : ring(e);
    for (const [dx, dz] of cells) V(dx, y, dz, e === hw ? PAL.slateDk : PAL.slate, 0.05);
  }
  /* stone pedestal + balustrade for the story above */
  const top = y0 + 4;
  if (i < 4) {
    for (const [dx, dz] of fill(hw - 1)) V(dx, top, dz, pick(PAL.stone), 0.05);
    for (const [dx, dz] of ring(hw)) {
      const corner = Math.abs(dx) === hw && Math.abs(dz) === hw;
      V(dx, top, dz, corner ? PAL.goldDk : (Math.abs(dx) % 2 === 0 || Math.abs(dz) % 2 === 0 ? PAL.timber : PAL.timberDk), 0.05);
    }
  } else {
    for (const [dx, dz] of fill(2)) V(dx, top, dz, PAL.goldDk, 0.04);
  }
  return top;
}
let topY = 0;
for (let i = 0; i < 5; i++) topY = story(i);

/* spire (sorin): shaft, water-dew rings, finial */
for (let y = topY + 1; y <= topY + 2; y++) for (const [dx, dz] of fill(1)) V(dx, y, dz, PAL.goldDk, 0.04);
for (let y = topY + 3; y <= topY + 9; y++) V(0, y, 0, PAL.gold, 0.05);
for (const ry of [topY + 4, topY + 6]) for (const [dx, dz] of ring(1)) V(dx, ry, dz, PAL.gold, 0.05);
V(0, topY + 10, 0, PAL.gold, 0.03);
V(0, topY + 11, 0, 0xf4e6b0, 0.02);

/* ---------- red torii gate ---------- */
(function torii() {
  const cz = 23, px = 5;
  for (const sx of [-1, 1]) {
    for (let y = 3; y <= 15; y++) for (const dx of [0, 1]) for (const dz of [0, 1]) {
      V(sx * px + dx, y, cz + dz, y === 15 ? PAL.timberDk : (chance(0.25) ? PAL.vermDk : PAL.verm), 0.05);
    }
    for (let a = -1; a <= 2; a++) for (let b = -1; b <= 2; b++) V((sx * px + a) | 0, 1, (cz + b) | 0, pick(PAL.stoneDim), 0.05);
    for (let a = 0; a <= 1; a++) for (let b = 0; b <= 1; b++) V((sx * px + a) | 0, 2, (cz + b) | 0, PAL.black, 0.03);
  }
  /* shimakura + kasagi (top lintels, tips lifted, black lacquer cap) */
  for (const dz of [0, 1]) for (let x = -8; x <= 8; x++) {
    const t = Math.abs(x);
    const up = t >= 7 ? 2 : t >= 5 ? 1 : 0;
    V(x, 16, cz + dz, t >= 8 ? PAL.vermDk : PAL.verm, 0.05);
    for (let u = 0; u <= up; u++) {
      V(x, 17 + u, cz + dz, PAL.verm, 0.05);
      V(x, 18 + u, cz + dz, chance(0.5) ? PAL.black : 0x3a3038, 0.03);
    }
  }
  /* gakuzuka + nuki */
  V(0, 14, cz, PAL.verm, 0.03); V(0, 15, cz, PAL.verm, 0.03);
  for (let x = -7; x <= 7; x++) for (const dz of [0, 1]) V(x, 13, cz + dz, chance(0.25) ? PAL.vermDk : PAL.verm, 0.05);
})();

/* ---------- stone lanterns ---------- */
function lantern(lx, lz) {
  for (const [dx, dz] of fill(1)) V(lx + dx, 1, lz + dz, pick(PAL.stoneDim), 0.05);
  V(lx, 2, lz, pick(PAL.stone), 0.04);
  V(lx, 3, lz, pick(PAL.stone), 0.04);
  for (const [dx, dz] of fill(1)) V(lx + dx, 4, lz + dz, 0xbfc3c8, 0.05);
  for (const [dx, dz] of ring(1)) V(lx + dx, 5, lz + dz, 0x8a8f95, 0.04);
  for (const [dx, dz] of fill(1)) V(lx + dx, 6, lz + dz, pick(PAL.stoneDim), 0.05);
  V(lx, 7, lz, pick(PAL.stone), 0.04);
}
lantern(7, 19); lantern(-7, 19);
const flames = [[7, 5, 19], [-7, 5, 19]];

/* ---------- pond: water, rim rocks, lily pads ---------- */
const waterPts = [];
for (let x = -G; x <= G; x++) for (let z = -G; z <= G; z++) {
  const d = Math.hypot(x - POND.x, z - POND.z);
  if (d < POND.r - 0.4) waterPts.push([x, z]);
}
for (let i = 0; i < 46; i++) {
  const a = rr(0, Math.PI * 2), d = POND.r + rr(-0.2, 0.9);
  const x = Math.round(POND.x + Math.cos(a) * d), z = Math.round(POND.z + Math.sin(a) * d);
  if (Math.hypot(x, z) < G) V(x, 1, z, pick(PAL.stoneDim), 0.09);
}
/* stepping stones across the near side of the pond */
[[POND.x + 3, POND.z - 5], [POND.x + 5, POND.z - 3], [POND.x + 6, POND.z - 1]].forEach(p => V(p[0], 1, p[1], pick(PAL.stone), 0.05));

/* ---------- cherry blossom trees ---------- */
const trees = [[-19, -6, 1.0], [-10, -19, 0.9], [18, -7, 1.05], [15, 17, 0.95], [22, 7, 0.85], [-22, 3, 0.9]];
function tree(tx, tz, s) {
  const h = Math.round(9 * s);
  let x = tx, z = tz;
  for (let y = 1; y <= h; y++) {
    V(x, y, z, pick(PAL.trunk), 0.09);
    if (y > 2 && chance(0.5)) V(x + (chance(0.5) ? 1 : -1), y, z, pick(PAL.trunk), 0.09);
    if (y > h - 4 && chance(0.8)) {
      const bx = x + (chance(0.5) ? 1 : -1), bz = z + (chance(0.5) ? 1 : -1);
      for (let k = 0; k < 3; k++) V(bx + Math.round(rr(-0.5, 0.5)), y + k, bz + Math.round(rr(-0.5, 0.5)), pick(PAL.trunk), 0.09);
    }
    if (chance(0.35)) x += chance(0.5) ? 1 : -1;
    if (chance(0.2)) z += chance(0.5) ? 1 : -1;
    x = Math.max(tx - 2, Math.min(tx + 2, x));
    z = Math.max(tz - 2, Math.min(tz + 2, z));
  }
  const blobs = 4 + ((rnd() * 3) | 0);
  for (let b = 0; b < blobs; b++) {
    const bx = x + rr(-4.2, 4.2), by = h + rr(-1.2, 3.4), bz = z + rr(-4.2, 4.2);
    const r = rr(2.4, 4.0);
    for (let dx = -Math.ceil(r); dx <= Math.ceil(r); dx++)
      for (let dy = -Math.ceil(r); dy <= Math.ceil(r); dy++)
        for (let dz = -Math.ceil(r); dz <= Math.ceil(r); dz++) {
          const d = Math.sqrt(dx * dx + dy * dy * 1.5 + dz * dz);
          if (d > r) continue;
          if (d > r - 1.4 && chance(0.45)) continue;
          if (d < r - 1.8 && chance(0.25)) continue;
          const px = Math.round(bx + dx), py = Math.round(by + dy), pz = Math.round(bz + dz);
          if (py < 2 || py > 30) continue;
          if (Math.hypot(px, pz) > G - 1) continue;
          V(px, py, pz, pick(PAL.pink), 0.07);
        }
  }
}
trees.forEach(t => tree(t[0], t[1], t[2]));

/* ---------- voxel clouds ---------- */
for (let c = 0; c < 5; c++) {
  const a = rr(0, Math.PI * 2), d = rr(52, 92);
  const cx = Math.cos(a) * d, cz = Math.sin(a) * d, cy = rr(44, 62);
  const n = 12 + ((rnd() * 14) | 0);
  for (let i = 0; i < n; i++) {
    const ox = Math.round(rr(-6, 6)), oy = Math.round(rr(-1.2, 1.2)), oz = Math.round(rr(-3, 3));
    V(Math.round(cx) + ox, cy + oy, Math.round(cz) + oz, 0xfdfdfd, 0.02);
  }
}

/* ---------- build one instanced mesh for every static cube ---------- */
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const staticMat = new THREE.MeshStandardMaterial({ roughness: 0.92, metalness: 0.0 });
const staticMesh = new THREE.InstancedMesh(boxGeo, staticMat, cubes.length);
staticMesh.castShadow = true;
staticMesh.receiveShadow = true;
{
  const m = new THREE.Matrix4();
  cubes.forEach((cu, i) => {
    m.makeTranslation(cu.x, cu.y, cu.z);
    staticMesh.setMatrixAt(i, m);
    staticMesh.setColorAt(i, cu.c);
  });
  staticMesh.instanceMatrix.needsUpdate = true;
  staticMesh.instanceColor.needsUpdate = true;
}
scene.add(staticMesh);

/* warm glow for the lantern windows */
{
  const g = new THREE.InstancedMesh(new THREE.BoxGeometry(0.7, 0.8, 0.7),
    new THREE.MeshBasicMaterial({ color: 0xffd9a0 }), flames.length);
  const m = new THREE.Matrix4();
  flames.forEach((f, i) => { m.makeTranslation(f[0], f[1], f[2]); g.setMatrixAt(i, m); });
  scene.add(g);
}

/* ---------- water (own mesh, glossy, gently rippling) ---------- */
const waterGeo = new THREE.BoxGeometry(0.98, 0.5, 0.98);
const waterMat = new THREE.MeshStandardMaterial({
  color: 0x54a3d8, roughness: 0.08, metalness: 0.05,
  transparent: true, opacity: 0.92, envMapIntensity: 1.4
});
const water = new THREE.InstancedMesh(waterGeo, waterMat, waterPts.length);
water.receiveShadow = true;
{
  const m = new THREE.Matrix4();
  waterPts.forEach((p, i) => { m.makeTranslation(p[0], -0.22, p[1]); water.setMatrixAt(i, m); });
}
scene.add(water);
/* lily pads */
{
  const pads = [[POND.x - 2, POND.z + 1], [POND.x + 2, POND.z - 2], [POND.x + 1, POND.z + 3]];
  const g = new THREE.InstancedMesh(new THREE.BoxGeometry(0.85, 0.14, 0.85),
    new THREE.MeshStandardMaterial({ color: 0x4f8b3e, roughness: 0.8 }), pads.length);
  const m = new THREE.Matrix4();
  pads.forEach((p, i) => { m.makeTranslation(p[0], 0.05, p[1]); g.setMatrixAt(i, m); });
  scene.add(g);
}

/* ---------- drifting blossom petals ---------- */
const NP = 120;
const petalGeo = new THREE.BoxGeometry(0.55, 0.12, 0.4);
const petalMat = new THREE.MeshStandardMaterial({ roughness: 0.7, side: THREE.DoubleSide });
const petals = new THREE.InstancedMesh(petalGeo, petalMat, NP);
const P = [];
for (let i = 0; i < NP; i++) {
  const a = rr(0, Math.PI * 2), d = rr(3, 26);
  P.push({
    x: Math.cos(a) * d, z: Math.sin(a) * d, y: rr(2, 48),
    ph: rr(0, 6.28), sp: rr(0.9, 1.9), amp: rr(0.6, 2.2),
    rx: rr(0, 6.28), ry: rr(0, 6.28), rz: rr(0, 6.28),
    sx: rr(0.6, 2.0), sy: rr(0.8, 2.4), col: pick(PAL.pink)
  });
  petals.setColorAt(i, P[i].col);
}
petals.instanceColor.needsUpdate = true;
scene.add(petals);
const dummy = new THREE.Object3D();

/* ---------- camera orbit ---------- */
const RAD = 64, TGT = new THREE.Vector3(0, 26, 0);
function placeCam(t) {
  const a = 0.085 * t - 0.5;
  camera.position.set(Math.sin(a) * RAD, 25.5 + Math.sin(t * 0.17) * 2.4, Math.cos(a) * RAD);
  camera.lookAt(TGT);
}

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.render(scene, camera);      // draw right away so a shot taken just after resize is correct
}
addEventListener('resize', resize);

const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();
  placeCam(t);

  for (let i = 0; i < NP; i++) {
    const p = P[i];
    p.y -= p.sp * 0.0165;
    if (p.y < 0.2) { p.y = rr(34, 52); const a = rr(0, 6.28), d = rr(3, 26); p.x = Math.cos(a) * d; p.z = Math.sin(a) * d; }
    dummy.position.set(p.x + Math.sin(t * 0.9 + p.ph) * p.amp, p.y, p.z + Math.cos(t * 0.7 + p.ph) * p.amp * 0.7);
    dummy.rotation.set(p.rx + t * p.sx, p.ry + t * p.sy, p.rz + t * 0.6);
    dummy.updateMatrix();
    petals.setMatrixAt(i, dummy.matrix);
  }
  petals.instanceMatrix.needsUpdate = true;

  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(1, 1, 1), v = new THREE.Vector3();
  for (let i = 0; i < waterPts.length; i++) {
    const w = waterPts[i];
    v.set(w[0], -0.22 + Math.sin(t * 1.4 + w[0] * 0.7 + w[1] * 0.5) * 0.07, w[1]);
    m.compose(v, q, s);
    water.setMatrixAt(i, m);
  }
  water.instanceMatrix.needsUpdate = true;

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
placeCam(0);
resize();
animate();

/* ---------- diagnostics (used only for checking this build) ---------- */
window.__dbg = {
  scene: scene, camera: camera, renderer: renderer,
  cubes: cubes.length,
  project(x, y, z) {
    const v = new THREE.Vector3(x, y, z).project(camera);
    return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight, z: +v.z.toFixed(2) };
  },
  frame() { return renderer.info.render; }
};
</script>
