<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxel Pagoda — Five-Story</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f14;overflow:hidden;
    font-family:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  .ui{position:fixed;z-index:10;color:#f4efe6;pointer-events:none;
    text-shadow:0 1px 12px rgba(0,0,0,.55);}
  .tl{top:26px;left:30px;}
  .jp{font-size:44px;font-weight:700;letter-spacing:14px;line-height:1;
    color:#f7f2e8;}
  .en{margin-top:12px;font-size:12px;letter-spacing:5px;text-transform:uppercase;
    color:#e7b7c6;}
  .rule{width:52px;height:2px;background:#d94f3d;margin-top:16px;}
  .br{bottom:24px;right:30px;text-align:right;font-size:11px;letter-spacing:2px;
    color:rgba(244,239,230,.62);line-height:1.9;}
  .br b{color:#f4efe6;font-weight:600;}
  .bl{bottom:24px;left:30px;font-size:11px;letter-spacing:2px;
    color:rgba(244,239,230,.42);}
  .fade{animation:fade 1.4s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="ui tl fade">
  <div class="jp">五重塔</div>
  <div class="en">Voxel Pagoda · Five-Story</div>
  <div class="rule"></div>
</div>
<div class="ui br fade">
  <div><b>drag</b> — orbit</div>
  <div><b>scroll</b> — zoom</div>
  <div><b>space</b> — pause</div>
</div>
<div class="ui bl fade">all geometry built from cubes · three.js</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- renderer / scene / camera ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd7c3c6, 42, 135);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 500);
camera.position.set(24, 15, 26);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.target.set(0, 7, 0);
controls.minDistance = 12;
controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI * 0.49;

/* ---------- sky dome (vertex-coloured gradient) ---------- */
const skyGeo = new THREE.SphereGeometry(220, 32, 16);
{
  const pos = skyGeo.attributes.position, col = [];
  const top = new THREE.Color(0x8fb4d6), mid = new THREE.Color(0xd7c3c6), bot = new THREE.Color(0xf3d9c6);
  const c = new THREE.Color();
  for (let i=0;i<pos.count;i++){
    const t = Math.max(0, pos.getY(i)/220);
    if (t < 0.35) c.copy(bot).lerp(mid, t/0.35); else c.copy(mid).lerp(top, (t-0.35)/0.65);
    col.push(c.r,c.g,c.b);
  }
  skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
}
scene.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.BackSide, fog:false })));

/* ---------- lighting ---------- */
scene.add(new THREE.HemisphereLight(0xcfe0f2, 0x6b5a4a, 0.55));
scene.add(new THREE.AmbientLight(0xffffff, 0.12));

const sun = new THREE.DirectionalLight(0xfff2df, 2.4);
sun.position.set(26, 40, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 130;
sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xbcd0ff, 0.35);
fill.position.set(-22, 16, -18);
scene.add(fill);

/* ---------- shared materials ---------- */
const M = {
  stone:   new THREE.MeshStandardMaterial({ color:0x9a9a92, roughness:0.95, metalness:0.0 }),
  stoneDk: new THREE.MeshStandardMaterial({ color:0x7f7f78, roughness:0.95 }),
  stoneLt: new THREE.MeshStandardMaterial({ color:0xb2b2aa, roughness:0.9 }),
  wood:    new THREE.MeshStandardMaterial({ color:0x8a3a2c, roughness:0.7 }),
  woodDk:  new THREE.MeshStandardMaterial({ color:0x6f2f24, roughness:0.75 }),
  gold:    new THREE.MeshStandardMaterial({ color:0xd9a441, roughness:0.35, metalness:0.6 }),
  goldDk:  new THREE.MeshStandardMaterial({ color:0xb9862f, roughness:0.4, metalness:0.55 }),
  white:   new THREE.MeshStandardMaterial({ color:0xf2ece0, roughness:0.85 }),
  dark:    new THREE.MeshStandardMaterial({ color:0x2a2320, roughness:0.6 }),
  lantern: new THREE.MeshStandardMaterial({ color:0xffd98a, emissive:0xffb347, emissiveIntensity:0.9, roughness:0.5 }),
  water:   new THREE.MeshStandardMaterial({ color:0x2f6f86, roughness:0.12, metalness:0.0, transparent:true, opacity:0.82 }),
  grass:   new THREE.MeshStandardMaterial({ color:0x6f8f52, roughness:1.0 }),
  trunk:   new THREE.MeshStandardMaterial({ color:0x5a4636, roughness:0.9 }),
  blossom: new THREE.MeshStandardMaterial({ color:0xf3c2d2, roughness:0.85 }),
  blossom2:new THREE.MeshStandardMaterial({ color:0xf7d3de, roughness:0.85 }),
  blossom3:new THREE.MeshStandardMaterial({ color:0xe9aec2, roughness:0.85 }),
  petal:   new THREE.MeshStandardMaterial({ color:0xf6cdd9, roughness:0.6, side:THREE.DoubleSide }),
};

/* ---------- voxel helpers (everything is a cube) ---------- */
const boxGeo = new THREE.BoxGeometry(1,1,1);
function cube(mat, x, y, z, s=1, cast=true, rec=true){
  const m = new THREE.Mesh(boxGeo, mat);
  m.scale.set(s,s,s); m.position.set(x,y,z);
  m.castShadow = cast; m.receiveShadow = rec;
  scene.add(m); return m;
}
function box(mat, x, y, z, sx, sy, sz, cast=true, rec=true){
  const m = new THREE.Mesh(boxGeo, mat);
  m.scale.set(sx,sy,sz); m.position.set(x,y,z);
  m.castShadow = cast; m.receiveShadow = rec;
  scene.add(m); return m;
}

/* ---------- ground ---------- */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(240,240), M.grass);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

/* ---------- stone platform (stepped) ---------- */
box(M.stone, 0, 0.3, 0, 16, 0.6, 16);
box(M.stone, 0, 0.9, 0, 13, 0.6, 13);
box(M.stoneLt, 0, 1.5, 0, 10.5, 0.6, 10.5);
box(M.stoneDk, 0, 1.82, 0, 10.5, 0.04, 10.5, false, true); // subtle top seam
// front steps
for (let i=0;i<3;i++) box(M.stone, 0, 0.3+i*0.3, 8.2-i*0.7, 4.2, 0.6, 1.4);
// corner lanterns
function lantern(x,z){
  box(M.stoneDk, x, 2.0, z, 0.5, 0.4, 0.5);
  box(M.stone,   x, 2.5, z, 0.35, 0.6, 0.35);
  box(M.stoneDk, x, 2.95, z, 0.5, 0.12, 0.5);
  box(M.lantern, x, 3.35, z, 0.55, 0.55, 0.55);
  box(M.stoneDk, x, 3.75, z, 0.62, 0.12, 0.62);
  box(M.stoneDk, x, 3.95, z, 0.2, 0.2, 0.2);
}
lantern(4.6,4.6); lantern(-4.6,4.6); lantern(4.6,-4.6); lantern(-4.6,-4.6);

/* ---------- pagoda ---------- */
function eave(cx, cy, cz, half, t){
  const step = 0.5;
  for (let x=-half; x<=half; x+=step)
    for (let z=-half; z<=half; z+=step){
      const edge = Math.max(Math.abs(x), Math.abs(z));
      const up = Math.max(0, edge - (half - 1.25)) * 0.22;
      cube(M.wood, cx+x, cy+up, cz+z, t);
    }
}
function story(cx, cy, cz, half, h){
  const body = 2*h - 1;
  for (let x=-half; x<=half; x+=step)
    for (let z=-half; z<=half; z+=step){
      const edge = Math.max(Math.abs(x), Math.abs(z));
      if (edge >= half - 0.25) cube(M.woodDk, cx+x, cy+h, cz+z, 0.5); // corner posts
      else if (edge >= half - 0.75) cube(M.white, cx+x, cy+h, cz+z, 0.5); // wall
    }
  for (let x=-half; x<=half; x+=step)
    for (let z=-half; z<=half; z+=step)
      cube(M.wood, cx+x, cy+body, cz+z, 0.5); // floor slab
  eave(cx, cy+body+0.25, cz, half+1.25, 0.5);
}
function spire(){
  cube(M.gold, 0, 16.0, 0, 1.2);
  cube(M.goldDk, 0, 16.7, 0, 0.9);
  cube(M.gold, 0, 17.3, 0, 0.7);
  cube(M.goldDk, 0, 17.9, 0, 0.55);
  cube(M.gold, 0, 18.4, 0, 0.4);
  cube(M.goldDk, 0, 18.85, 0, 0.3);
  cube(M.gold, 0, 19.25, 0, 0.22);
  cube(M.gold, 0, 19.6, 0, 0.16);
}
story(0, 1.8, 0, 3.5, 2);
story(0, 5.8, 0, 3.0, 2);
story(0, 9.8, 0, 2.5, 2);
story(0, 13.8, 0, 2.0, 2);
story(0, 17.8, 0, 1.5, 2);
spire();

/* ---------- torii gate ---------- */
function torii(x, z, ry){
  const g = new THREE.Group();
  const post = (px,pz)=>{
    const p = new THREE.Mesh(boxGeo, M.wood); p.scale.set(0.5,5.2,0.5);
    p.position.set(px,2.6,pz); p.castShadow=p.receiveShadow=true; g.add(p);
    const b = new THREE.Mesh(boxGeo, M.dark); b.scale.set(0.7,0.3,0.7);
    b.position.set(px,0.15,pz); b.castShadow=b.receiveShadow=true; g.add(b);
  };
  post(-2.2,0); post(2.2,0);
  const kasagi = new THREE.Mesh(boxGeo, M.wood); kasagi.scale.set(6.4,0.5,0.5);
  kasagi.position.set(0,5.2,0); kasagi.castShadow=true; g.add(kasagi);
  const shimaki = new THREE.Mesh(boxGeo, M.dark); shimaki.scale.set(6.8,0.35,0.6);
  shimaki.position.set(0,5.6,0); shimaki.castShadow=true; g.add(shimaki);
  const nuki = new THREE.Mesh(boxGeo, M.wood); nuki.scale.set(5.2,0.4,0.4);
  nuki.position.set(0,4.2,0); nuki.castShadow=true; g.add(nuki);
  const gakuzuka = new THREE.Mesh(boxGeo, M.wood); gakuzuka.scale.set(0.4,0.9,0.4);
  gakuzuka.position.set(0,4.75,0); gakuzuka.castShadow=true; g.add(gakuzuka);
  g.position.set(x,0,z); g.rotation.y = ry; scene.add(g);
}
torii(0, 12, 0);

/* ---------- cherry trees ---------- */
function blob(cx, cy, cz, r, mat){
  for (let x=-r; x<=r; x++)
    for (let y=-r; y<=r; y++)
      for (let z=-r; z<=r; z++){
        const d = Math.sqrt(x*x+y*y+z*z);
        if (d <= r + (Math.random()*0.6-0.3))
          cube(mat, cx+x, cy+y, cz+z, 1);
      }
}
function tree(x, z, trunkH, r, mat){
  for (let i=0;i<trunkH;i++) cube(M.trunk, x, i+0.5, z, 1);
  blob(x, trunkH+r, z, r, mat);
  blob(x+r-1, trunkH+r-1, z, r-1, mat);
  blob(x-r+1, trunkH+r-1, z, r-1, mat);
  blob(x, trunkH+r-1, z+r-1, r-1, mat);
  blob(x, trunkH+r-1, z-r+1, r-1, mat);
}
tree(-11, 3, 4, 3, M.blossom);
tree(11, -2, 5, 3, M.blossom2);
tree(-9, -11, 4, 3, M.blossom3);
tree(12, 9, 4, 3, M.blossom);

/* ---------- pond ---------- */
const pond = new THREE.Mesh(new THREE.PlaneGeometry(11,9), M.water);
pond.rotation.x = -Math.PI/2; pond.position.set(13, 0.06, 12);
pond.receiveShadow = true; scene.add(pond);
// stone edging
for (let x=-5.5; x<=5.5; x+=1) for (let z=-4.5; z<=4.5; z+=1){
  const edge = Math.max(Math.abs(x), Math.abs(z));
  if (edge >= 4.5) cube(M.stoneDk, 13+x, 0.12, 12+z, 1, false, true);
}
// stepping stones
cube(M.stoneLt, 13, 0.14, 12, 1.2);
cube(M.stoneLt, 13, 0.14, 10.2, 1.2);
cube(M.stoneLt, 13, 0.14, 8.4, 1.2);

/* ---------- drifting petals ---------- */
const petals = [];
const petalGeo = new THREE.BoxGeometry(0.22, 0.03, 0.16);
for (let i=0;i<48;i++){
  const m = new THREE.Mesh(petalGeo, M.petal);
  m.castShadow = true;
  m.position.set((Math.random()-0.5)*44, Math.random()*22, (Math.random()-0.5)*44);
  m.userData = {
    vy: 0.5 + Math.random()*0.7,
    rx: (Math.random()-0.5)*2.2, ry: (Math.random()-0.5)*2.2, rz: (Math.random()-0.5)*2.2,
    ph: Math.random()*Math.PI*2, amp: 0.4 + Math.random()*0.9,
    baseX: m.position.x, baseZ: m.position.z
  };
  scene.add(m); petals.push(m);
}

/* ---------- interaction ---------- */
let paused = false;
addEventListener('keydown', e => { if (e.code === 'Space'){ paused = !paused; controls.autoRotate = !paused; } });
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- loop ---------- */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (!paused){
    for (const p of petals){
      const u = p.userData;
      p.position.y -= u.vy * dt;
      p.position.x = u.baseX + Math.sin(t*0.6 + u.ph) * u.amp;
      p.position.z = u.baseZ + Math.cos(t*0.5 + u.ph) * u.amp;
      p.rotation.x += u.rx*dt; p.rotation.y += u.ry*dt; p.rotation.z += u.rz*dt;
      if (p.position.y < 0.15){
        p.position.y = 20 + Math.random()*6;
        u.baseX = (Math.random()-0.5)*44; u.baseZ = (Math.random()-0.5)*44;
      }
    }
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
