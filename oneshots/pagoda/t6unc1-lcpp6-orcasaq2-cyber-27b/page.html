<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五重塔 · Voxel Pagoda</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(1200px 700px at 72% 10%, rgba(255,238,214,.55), transparent 60%),
      linear-gradient(180deg, #9cc2e6 0%, #c3d9ee 44%, #e9e2d4 68%, #ded4c2 100%);
  }
  canvas { position:fixed; inset:0; display:block; }
  #vig {
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(120% 92% at 50% 42%, transparent 55%, rgba(48,60,86,.22) 100%);
  }
  .card {
    position:fixed; left:22px; top:22px; z-index:3; pointer-events:none;
    background:rgba(252,249,243,.93); border:1px solid rgba(160,50,40,.28);
    border-left:4px solid #c8372a; padding:14px 22px 13px 16px;
    box-shadow:0 10px 28px rgba(60,50,80,.18);
    opacity:0; transform:translateY(10px);
    animation:rise .9s .25s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes rise { to { opacity:1; transform:none; } }
  .card h1 {
    margin:0; font:400 32px/1.15 "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,serif;
    letter-spacing:.05em; color:#30281f;
  }
  .card h1 span { font:400 12px/1 ui-sans-serif,system-ui,sans-serif; letter-spacing:.3em; color:#c8372a; vertical-align:middle; margin-left:8px; }
  .card p { margin:6px 0 0; font:400 12px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif; color:#7a6a5a; letter-spacing:.06em; }
  .hint {
    position:fixed; right:22px; bottom:18px; z-index:3; pointer-events:none;
    font:500 11px/1 ui-sans-serif,system-ui,"Segoe UI",sans-serif; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(84,92,116,.78);
    opacity:0; animation:fadein .8s 1.2s forwards;
  }
  @keyframes fadein { to { opacity:1; } }
  .hint b { color:rgba(180,60,48,.9); font-weight:700; }
  @media (max-width:640px){ .card h1{font-size:24px} .card p{max-width:200px} .hint{display:none} }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="vig"></div>
<div class="card">
  <h1>五重塔 <span>GOJŪ NO TŌ</span></h1>
  <p>a five-storied voxel pagoda · spring at the garden temple</p>
</div>
<div class="hint">drag to <b>orbit</b> &nbsp;·&nbsp; scroll to <b>zoom</b></div>

<script type="module">
import * as THREE from 'three';

/* ---------------------------------------------------------------- setup */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdfe8f0, 55, 135);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 300);
const TARGET = new THREE.Vector3(0, 7.2, 0);

/* -------------------------------------------------------------- helpers */
const R = (a, b) => a + Math.random() * (b - a);
const WHITE = new THREE.Color(1,1,1), BLACK = new THREE.Color(0,0,0);
const C = (h, amt=0.07) => {
  const col = new THREE.Color(h);
  const d = (Math.random()*2-1) * amt;
  return col.lerp(d > 0 ? WHITE : BLACK, Math.abs(d));
};

const list = [], waterList = [];
const box = (x,y,z,sx,sy,sz,hex,amt) => list.push({x,y,z,sx,sy,sz,c:C(hex,amt)});
const WBOX = (x,y,z,sx,sy,sz,hex,amt) => waterList.push({x,y,z,sx,sy,sz,c:C(hex,amt)});

/* ------------------------------------------------------- ground & pond */
const PC = { x:-13, z:9 };                 // pond centre
const onPath = (x,z) => (x>=-1 && x<=1 && z>=10 && z<=19) || (z===20 && x>=-2 && x<=2);

for (let x=-24; x<=23; x++) for (let z=-24; z<=23; z++) {
  const dx = x+0.5-PC.x, dz = z+0.5-PC.z, r = Math.hypot(dx,dz);
  if (r < 4.2) {
    WBOX(x+0.5, 0.175, z+0.5, 1, 0.35, 1,
         Math.random()<0.28 ? 0x4e93bd : 0x6db3d8, 0.09);
  } else if (r < 5.1) {
    box(x+0.5, 0.35, z+0.5, 1, 0.7, 1, 0x8f959c, 0.08);      // stone rim
  } else if (onPath(x,z)) {
    box(x+0.5, 0.25, z+0.5, 1, 0.5, 1, 0xb7bdc4, 0.07);      // stepping path
  } else {
    box(x+0.5, 0.25, z+0.5, 1, 0.5, 1,
        Math.random()<0.045 ? 0x7c9b55 : 0x8aae63, 0.08);    // lawn
  }
}
box(0, -0.27, 0, 48.4, 0.52, 48.4, 0x4a4038, 0.03);          // soil

/* little wildflowers */
for (let i=0;i<34;i++){
  const x = R(-23,22.4), z = R(-23,22.4);
  if (Math.hypot(x-PC.x, z-PC.z) < 5.6) continue;
  if (Math.abs(x) < 8.2 && Math.abs(z) < 8.2) continue;
  box(x, 0.54, z, 0.24, 0.18, 0.24,
      Math.random()<0.5 ? 0xfdf3f6 : 0xf6b7cf, 0.05);
}

/* --------------------------------------------------- stone platform */
for (let x=-7; x<=7; x++) for (let z=-7; z<=7; z++) {        // lowest tier
  if (Math.abs(x)===7 && Math.abs(z)===7) continue;
  box(x+0.5, 0.75, z+0.5, 1, 0.5, 1, 0x999fa7, 0.07);
}
for (let x=-5; x<=5; x++) for (let z=-5; z<=5; z++) {        // middle tier
  if (Math.abs(x)===5 && Math.abs(z)===5) continue;
  box(x+0.5, 1.25, z+0.5, 1, 0.5, 1, 0x8e949c, 0.07);
}
for (let x=-3; x<=3; x++) for (let z=-3; z<=3; z++) {        // pagoda pedestal
  if (Math.abs(x)===3 && Math.abs(z)===3) continue;
  box(x+0.5, 1.75, z+0.5, 1, 0.5, 1, 0xa2a8b0, 0.07);
}
for (const x of [-2,-1,0,1,2]) {                             // stair path
  box(x+0.5, 1.25, 6.5, 1, 0.5, 1, 0xaeb4bc, 0.06);
  box(x+0.5, 1.25, 7.5, 1, 0.5, 1, 0xaeb4bc, 0.06);
  box(x+0.5, 0.75, 8.5, 1, 0.5, 1, 0x9aa0a8, 0.06);
  box(x+0.5, 0.75, 9.5, 1, 0.5, 1, 0x9aa0a8, 0.06);
}

/* ----------------------------------------------------- five-story tower */
const W = [9,8,7,6,5], H = [3,3,3,2,2];
const OV = [2.5,2.5,2,2,2], LIFT = [1.35,1.3,1.2,1.1,1.0];

function eave(base, hw, ov, lift, tone) {
  const E = hw + ov, I = hw - 0.5, N = Math.ceil(E);
  for (let x=-N; x<N; x++) for (let z=-N; z<N; z++) {
    const px = x+0.5, pz = z+0.5;
    const r = Math.max(Math.abs(px), Math.abs(pz));
    if (r < I || r > E) continue;
    const h = lift * Math.pow((Math.abs(px)/E) * (Math.abs(pz)/E), 0.6);
    box(px, base + 0.3 + h, pz, 1, 0.6, 1, tone, 0.08);
  }
}

let baseY = 2.0;
for (let i=0; i<5; i++) {
  const hw = W[i]/2, hh = H[i], mid = baseY + hh/2;
  box(0, mid, 0, W[i], hh, W[i], 0xc89a68, 0.05);            // timber body
  const px = hw - 0.5, pcol = () => C(0xb0392a, 0.06);
  for (const a of [-1,1]) for (const b of [-1,1])           // corner pillars
    box(a*px, mid, b*px, 0.9, hh, 0.9, pcol().getHex(), 0);
  if (hw >= 2.5)
    for (const a of [-1,1]) { box(a*px, mid, 0, 0.9, hh, 0.9, pcol().getHex(), 0);
                               box(0, mid, a*px, 0.9, hh, 0.9, pcol().getHex(), 0); }
  if (i === 0) {
    box(0, baseY + 1.1,  hw - 0.15, 2.1, 2.3, 0.5, 0x33241c, 0.05); // main gate
    box(0, baseY + 1.1, -hw + 0.15, 2.1, 2.3, 0.5, 0x33241c, 0.05);
  } else {
    for (const a of [-1,1]) for (const b of [-1,1])
      box(a*1.6, baseY + hh*0.55, b*(hw-0.1), 1, 1, 0.45, 0x33241c, 0.05);
  }
  eave(baseY + hh - 0.55, hw, OV[i], LIFT[i], 0x34363e);
  baseY += hh - 0.55;
}
const spireBase = baseY;
box(0, spireBase + 0.55, 0, 2, 0.55, 2, 0x8e949c, 0.06);     // finial plinth
box(0, spireBase + 2.95, 0, 0.55, 4.8, 0.55, 0x4a4448, 0.05); // sōrin shaft
for (let i=0;i<5;i++)                                        // golden kasa
  box(0, spireBase + 1.3 + i*0.85, 0, 1.9 - i*0.27, 0.32, 1.9 - i*0.27, 0xd7a94e, 0.09);
box(0, spireBase + 5.45, 0, 0.7, 0.7, 0.7, 0xd7a94e, 0.09);  // jewel
box(0, spireBase + 5.95, 0, 0.28, 0.5, 0.28, 0xe6c26a, 0.07); // flame tip

/* ----------------------------------------------------------- torii gate */
const RED = () => C(0xd63f2f, 0.07);
box(-2.5, 0, 17.5, 1, 1, 1, 0x8e949c, 0.07);
box( 2.5, 0, 17.5, 1, 1, 1, 0x8e949c, 0.07);
box(-2.5, 2.75, 17.5, 1.1, 4.5, 1.1, RED().getHex(), 0);
box( 2.5, 2.75, 17.5, 1.1, 4.5, 1.1, RED().getHex(), 0);
box(0, 5.32, 17.5, 7.9, 0.4, 1.3, RED().getHex(), 0);                 // nuki
box(0, 4.95, 17.5, 0.9, 1.0, 0.9, RED().getHex(), 0);                 // gakuzuka
box(0, 6.35, 17.5, 8.3, 0.5, 1.5, RED().getHex(), 0);                 // shimaki
box(0, 6.78, 17.5, 9.5, 0.42, 1.8, 0x2b262a, 0.05);                   // kasagi
box(-4.35, 7.14, 17.5, 1.0, 0.35, 1.8, 0x2b262a, 0.05);               // upturned tips
box( 4.35, 7.14, 17.5, 1.0, 0.35, 1.8, 0x2b262a, 0.05);

/* ------------------------------------------------------- stone lanterns */
function lantern(x, z) {
  box(x, 0.65, z, 1.2, 0.7, 1.2, 0x9aa0a6, 0.07);
  box(x, 1.45, z, 0.55, 1.0, 0.55, 0x93999f, 0.07);
  box(x, 2.2,  z, 1.0, 0.85, 1.0, 0x9aa0a6, 0.07);
  box(x, 2.37, z, 0.4, 0.5, 0.4, 0xffcf7a, 0.04);       // warm glow
  box(x, 2.9,  z, 1.6, 0.22, 1.6, 0x6f757c, 0.07);
  box(x, 3.1,  z, 0.5, 0.2, 0.5, 0x6f757c, 0.07);
}
lantern(-3.2, 13.5); lantern(3.2, 15.5);

/* ---------------------------------------------------------- pond rocks */
for (let i=0;i<6;i++){
  const a = R(0, Math.PI*2), rr = R(5.3, 5.9);
  const x = PC.x + Math.cos(a)*rr, z = PC.z + Math.sin(a)*rr;
  if (Math.abs(x) < 8.5 && Math.abs(z) < 8.5) continue;
  box(x, 0.35, z, R(0.7,1.2), R(0.5,0.9), R(0.7,1.2), 0x7f868d, 0.08);
}

/* --------------------------------------------------------- static mesh */
const staticMesh = new THREE.InstancedMesh(
  new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial(), list.length);
{
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(),
        p = new THREE.Vector3(), s = new THREE.Vector3(), col = new THREE.Color();
  list.forEach((d, i) => {
    p.set(d.x,d.y,d.z); s.set(d.sx,d.sy,d.sz);
    m.compose(p,q,s);
    staticMesh.setMatrixAt(i, m);
    staticMesh.setColorAt(i, d.c);
  });
  staticMesh.instanceMatrix.needsUpdate = true;
  if (staticMesh.instanceColor) staticMesh.instanceColor.needsUpdate = true;
}
staticMesh.castShadow = true;
staticMesh.receiveShadow = true;
scene.add(staticMesh);

/* ------------------------------------------------------------ water mesh */
const waterMesh = new THREE.InstancedMesh(
  new THREE.BoxGeometry(1,1,1),
  new THREE.MeshLambertMaterial({ transparent:true, opacity:0.9 }),
  waterList.length);
waterList.forEach((d, i) => {
  const m = new THREE.Matrix4();
  m.compose(new THREE.Vector3(d.x,d.y,d.z), new THREE.Quaternion(),
            new THREE.Vector3(d.sx,d.sy,d.sz));
  waterMesh.setMatrixAt(i, m);
  waterMesh.setColorAt(i, d.c);
});
waterMesh.instanceMatrix.needsUpdate = true;
if (waterMesh.instanceColor) waterMesh.instanceColor.needsUpdate = true;
waterMesh.receiveShadow = true;
scene.add(waterMesh);

/* --------------------------------------------------------- sakura trees */
const trunks = new THREE.InstancedMesh(
  new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial(), 96);
{
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(),
        e = new THREE.Euler(), col = new THREE.Color();
  const trees = [[-10,-9,1],[8.5,-12,1.15],[-16.5,14.5,0.85],[16,-3.5,1.05]];
  let ti = 0;
  const trunk = (x,y,z,sy) => {
    m.compose(new THREE.Vector3(x,y,z), e.set(0,0,0), new THREE.Vector3(1,sy,1));
    trunks.setMatrixAt(ti, m);
    trunks.setColorAt(ti, col.set(0x6d4c41).offsetHSL(0,0,R(-0.04,0.04)));
    ti++;
  };
  trees.forEach(([tx,tz,s]) => {
    trunk(tx, 0.8*tz*0 + 0.9*s, tz, 1.8*s);
    trunk(tx+0.9*s, 2.1*s, tz-0.6*s, 1.0*s);
    trunk(tx-0.8*s, 2.35*s, tz+0.7*s, 0.9*s);
  });
  trunks.instanceMatrix.needsUpdate = true;
  if (trunks.instanceColor) trunks.instanceColor.needsUpdate = true;
}
trunks.castShadow = true;
scene.add(trunks);

const canopies = [];
const trees = [[-10,-9,1,1],[8.5,-12,1.15,2],[-16.5,14.5,0.85,4],[16,-3.5,1.05,5]];
const pinks = [0xf8c6d9, 0xf4b3cc, 0xfbd9e5, 0xf1a5c1];
trees.forEach(([tx,tz,s,ph]) => {
  const n = Math.floor(110 * s * s);
  const mesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial(), n);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(),
        e = new THREE.Euler(), col = new THREE.Color();
  for (let i=0;i<n;i++){
    const v = new THREE.Vector3(R(-1,1), R(-0.85,1), R(-1,1));
    if (v.length() > 1.18) v.setLength(R(0.85,1.18));
    const sz = R(0.85,1.5) * s;
    const y = 3.3*s + v.y*2.35*s;
    if (y < 1.9) continue;
    m.compose(new THREE.Vector3(tx+v.x*2.6*s, y, tz+v.z*2.6*s),
              e.set(R(-0.3,0.3), R(0,Math.PI), R(-0.3,0.3)),
              new THREE.Vector3(sz, sz*0.85, sz));
    mesh.setMatrixAt(i, m);
    mesh.setColorAt(i, col.set(pinks[(Math.random()*pinks.length)|0]).offsetHSL(0,0,R(-0.05,0.06)));
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = true;
  canopies.push({ mesh, tx, tz, ph });
  scene.add(mesh);
});

/* ---------------------------------------------------------- drifting petals */
const NP = 150;
const petals = new THREE.InstancedMesh(
  new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial(), NP);
const PD = [], PCOL = [0xfbd9e5, 0xf6b6cf, 0xfdeef5];
for (let i=0;i<NP;i++) PD.push({
  x:R(-23,23), y:R(0.8,13), z:R(-23,23),
  vy:R(0.5,1.1), ph:R(0,6.28), spin:R(-3,3), sz:R(0.16,0.3),
  col:new THREE.Color(PCOL[(Math.random()*3)|0]).offsetHSL(0,0,R(-0.04,0.05))
});
const pm = new THREE.Matrix4(), pq = new THREE.Quaternion(), pe = new THREE.Euler(),
      pv = new THREE.Vector3(), ps = new THREE.Vector3();
scene.add(petals);

/* --------------------------------------------------------------- lighting */
scene.add(new THREE.HemisphereLight(0xbfd6ff, 0x8fa06a, 0.55));
const sun = new THREE.DirectionalLight(0xffe6bd, 2.4);
sun.position.set(28, 42, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -34; sun.shadow.camera.right = 34;
sun.shadow.camera.top = 34;   sun.shadow.camera.bottom = -34;
sun.shadow.camera.near = 4;   sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0006;    sun.shadow.normalBias = 0.6;
scene.add(sun, sun.target);
sun.target.position.set(0, 4, 0);
const fill = new THREE.DirectionalLight(0xa8c4e8, 0.4);
fill.position.set(-24, 14, -18);
scene.add(fill);

/* ----------------------------------------------------- camera & controls */
const orbit = { az: 0.9, el: 0.34, r: 46, tAz: 0.9, tEl: 0.34, tR: 30 };
const AUTO_SPEED = 0.06;   // rad / s  (~105 s per lap)
let last = performance.now();

const el = renderer.domElement;
el.addEventListener('pointerdown', e => {
  orbit.auto = false;
  orbit._px = e.clientX; orbit._py = e.clientY;
  orbit._t = performance.now();
  el.setPointerCapture(e.pointerId);
});
el.addEventListener('pointermove', e => {
  if (!orbit.auto && el.hasPointerCapture?.(e.pointerId)) {
    orbit.tAz -= (e.clientX - orbit._px) * 0.0052;
    orbit.tEl += (e.clientY - orbit._py) * 0.004;
    orbit.tEl = Math.max(0.1, Math.min(0.72, orbit.tEl));
    orbit._px = e.clientX; orbit._py = e.clientY;
    orbit._t = performance.now();
  }
});
const resume = () => { orbit.auto = true; orbit._t = performance.now(); };
el.addEventListener('pointerup', resume);
el.addEventListener('pointercancel', resume);
el.addEventListener('wheel', e => {
  e.preventDefault();
  orbit.tR = Math.max(17, Math.min(50, orbit.tR + e.deltaY * 0.02));
}, { passive:false });
el.addEventListener('dblclick', resume);

/* ------------------------------------------------------------------ loop */
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  const t = now / 1000;

  /* camera orbit (auto + damped manual) */
  if (orbit.auto && performance.now() - orbit._t > 3000) orbit.tAz += AUTO_SPEED * dt;
  orbit.az += (orbit.tAz - orbit.az) * Math.min(1, dt * 5);
  orbit.el += (orbit.tEl - orbit.el) * Math.min(1, dt * 5);
  orbit.r  += (orbit.tR  - orbit.r ) * Math.min(1, dt * 3);
  const ce = Math.cos(orbit.el);
  camera.position.set(
    TARGET.x + orbit.r * ce * Math.sin(orbit.az),
    TARGET.y + orbit.r * Math.sin(orbit.el),
    TARGET.z + orbit.r * ce * Math.cos(orbit.az));
  camera.lookAt(TARGET);

  /* petals drift */
  for (let i=0;i<NP;i++) {
    const p = PD[i];
    p.y -= p.vy * dt;
    p.x += (Math.sin(t*0.9 + p.ph) * 0.7 + Math.sin(t*0.23 + p.ph*2.1) * 0.5) * dt;
    p.z += Math.cos(t*0.8 + p.ph*1.7) * 0.6 * dt;
    if (p.y < 0.55) { p.y = R(9,13.5); p.x = R(-23,23); p.z = R(-23,23); }
    pe.set(t*p.spin*0.5 + p.ph, t*p.spin*0.9 + p.ph*2, 0);
    pq.setFromEuler(pe);
    pv.set(p.x, p.y, p.z); ps.setScalar(p.sz);
    pm.compose(pv, pq, ps);
    petals.setMatrixAt(i, pm);
    petals.setColorAt(i, p.col);
  }
  petals.instanceMatrix.needsUpdate = true;
  if (petals.instanceColor) petals.instanceColor.needsUpdate = true;

  /* water ripple */
  for (let i=0;i<waterList.length;i++) {
    const d = waterList[i];
    const m = pm.clone();
    m.compose(new THREE.Vector3(d.x, d.y + Math.sin(t*1.7 + d.x*1.3 + d.z*0.9)*0.05, d.z),
              new THREE.Quaternion(), new THREE.Vector3(d.sx, d.sy, d.sz));
    waterMesh.setMatrixAt(i, m);
  }
  waterMesh.instanceMatrix.needsUpdate = true;

  /* canopies sway */
  for (const c of canopies) {
    c.mesh.rotation.z = Math.sin(t*0.6 + c.ph) * 0.018;
    c.mesh.rotation.x = Math.cos(t*0.47 + c.ph*1.3) * 0.014;
  }

  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
