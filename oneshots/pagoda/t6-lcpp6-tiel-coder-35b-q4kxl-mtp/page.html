<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxel Japanese Pagoda</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe0ef; }
  canvas { display: block; }
  #info {
    position: absolute; top: 10px; left: 12px; color: #3a4a55;
    font: 13px/1.4 system-ui, sans-serif; text-shadow: 0 1px 0 rgba(255,255,255,.5);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="info">Voxel Japanese Pagoda — drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe0ef);
scene.fog = new THREE.Fog(0xbfe0ef, 45, 95);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(20, 15, 22);

const controls = new OrbitControls(camera, renderer.domElement);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.target.set(0, 6, 0);
controls.enableDamping = true;
controls.minDistance = 8;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI / 2 - 0.03;

/* ---------- voxel helpers ---------- */
const matCache = {};
function mat(color, opts = {}) {
  const key = color + '|' + JSON.stringify(opts);
  if (!matCache[key]) {
    matCache[key] = new THREE.MeshStandardMaterial(
      Object.assign({ color, flatShading: true, roughness: 0.85, metalness: 0.0 }, opts)
    );
  }
  return matCache[key];
}
function box(parent, x, y, z, sx, sy, sz, material, cast = true, recv = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), material);
  m.position.set(x, y, z);
  m.castShadow = cast;
  m.receiveShadow = recv;
  parent.add(m);
  return m;
}

/* ---------- ground ---------- */
const groundMat = mat(0x6a9a52);
const ground = new THREE.Mesh(new THREE.BoxGeometry(120, 0.5, 120), groundMat);
ground.position.y = -0.25;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- stone platform ---------- */
const stoneMat = mat(0x8a8578, { roughness: 0.95 });
const stepMat = mat(0x7a756a, { roughness: 0.95 });
const platform = new THREE.Group();
for (let i = 0; i < 2; i++) {
  const s = 16 - i * 1.5;
  box(platform, 0, 0.3 + i * 0.3, 0, s, 0.3, s, i === 0 ? stepMat : stoneMat, true, true);
}
scene.add(platform);

/* ---------- five-story pagoda ---------- */
function buildPagoda() {
  const g = new THREE.Group();
  const woodMat = mat(0x5a3a28);      // walls
  const floorMat = mat(0x8a5a3a);     // floor slabs
  const roofMat = mat(0x2f2f36);      // eaves / roofs
  const doorMat = mat(0x2a1a12);
  const goldMat = mat(0xc9a24b, { metalness: 0.5, roughness: 0.35 });

  const slab = 0.3, wallH = 2.0;
  let y = 0.6 + 0.6; // top of platform steps
  const stories = 5;

  for (let i = 0; i < stories; i++) {
    const wallHalf = 3.2 - i * 0.5;
    const eaveHalf = wallHalf + 1.3;

    // floor slab
    box(g, 0, y + slab / 2, 0, wallHalf * 2, slab, wallHalf * 2, floorMat);
    y += slab;

    // walls (solid room block)
    box(g, 0, y + wallH / 2, 0, wallHalf * 2, wallH, wallHalf * 2, woodMat);

    // doorway on the front face of the ground floor
    if (i === 0) {
      box(g, 0, y + 0.9, wallHalf + 0.02, 1.0, 1.4, 0.1, doorMat);
    }

    // eave / roof slab (overhangs the walls)
    const roofY = y + wallH;
    box(g, 0, roofY + slab / 2, 0, eaveHalf * 2, slab, eaveHalf * 2, roofMat);

    // upturned corners — raised cubes at each eave tip
    for (const sx of [-1, 1]) {
      for (const sz of [-1, 1]) {
        box(g, sx * eaveHalf, roofY + slab + 0.45, sz * eaveHalf, 0.55, 0.5, 0.55, roofMat);
        box(g, sx * (eaveHalf - 0.35), roofY + slab + 0.85, sz * (eaveHalf - 0.35), 0.3, 0.35, 0.3, roofMat);
      }
    }

    y = roofY + slab;
  }

  // spire (sorin): pole + rings + jewel
  box(g, 0, y + 1.6, 0, 0.35, 3.2, 0.35, goldMat);
  const rings = [[0.95, 0.55], [0.7, 1.15], [0.45, 1.7]];
  for (const [size, off] of rings) {
    box(g, 0, y + off, 0, size, 0.16, size, goldMat);
  }
  box(g, 0, y + 2.5, 0, 0.45, 0.45, 0.45, goldMat);
  box(g, 0, y + 2.95, 0, 0.28, 0.28, 0.28, goldMat);

  return g;
}
scene.add(buildPagoda());

/* ---------- cherry blossom tree ---------- */
function buildTree(x, z, scale = 1) {
  const g = new THREE.Group();
  const trunkMat = mat(0x5b3d25);
  const pinkA = mat(0xffa9bd);
  const pinkB = mat(0xffc4cf);
  const pinkC = mat(0xf48ca0);

  const h = Math.round(3 * scale);
  let y = 0.5;
  for (let i = 0; i < h; i++) {
    box(g, x + (i % 2 ? 0.15 : -0.15), y, z, 0.5, 1, 0.5, trunkMat);
    y += 1;
  }
  // branches
  box(g, x + 0.7, y - 0.2, z, 1.0, 0.4, 0.4, trunkMat);
  box(g, x - 0.6, y - 0.6, z + 0.4, 0.4, 0.4, 1.0, trunkMat);

  const cy = y + 0.3;
  const mats = [pinkA, pinkB, pinkC];
  for (let i = 0; i < 30; i++) {
    const px = x + (Math.random() - 0.5) * 3.4 * scale;
    const py = cy + (Math.random() - 0.5) * 2.4 * scale;
    const pz = z + (Math.random() - 0.5) * 3.4 * scale;
    const d = Math.hypot(px - x, py - cy, pz - z);
    if (d > 2.1 * scale) continue;
    box(g, px, py, pz, 0.75 * scale, 0.75 * scale, 0.75 * scale, mats[i % 3]);
  }
  return g;
}
scene.add(buildTree(-8, 5, 1.2));
scene.add(buildTree(-7, -6, 1.0));
scene.add(buildTree(8, -5, 1.1));

/* ---------- pond ---------- */
function buildPond(x, z) {
  const g = new THREE.Group();
  const water = mat(0x3f97a8, { roughness: 0.25, metalness: 0.1 });
  const stone = mat(0x6f6a5e, { roughness: 0.95 });
  const W = 5, D = 3.5;
  box(g, x, 0.08, z, W, 0.16, D, water, false, true);
  const step = 0.9;
  for (let i = -Math.floor(W / 2); i <= Math.floor(W / 2); i++) {
    box(g, x + i * step, 0.3, z + D / 2, 0.6, 0.5, 0.6, stone);
    box(g, x + i * step, 0.3, z - D / 2, 0.6, 0.5, 0.6, stone);
  }
  for (let j = -Math.floor(D / 2) + 1; j < Math.floor(D / 2); j++) {
    box(g, x + W / 2, 0.3, z + j * step, 0.6, 0.5, 0.6, stone);
    box(g, x - W / 2, 0.3, z + j * step, 0.6, 0.5, 0.6, stone);
  }
  return g;
}
scene.add(buildPond(8, 4));

/* ---------- red torii gate ---------- */
function buildTorii(x, z) {
  const g = new THREE.Group();
  const red = mat(0xc0392b, { roughness: 0.6 });
  const dark = mat(0x2a2a2a, { roughness: 0.8 });
  const pw = 0.55, ph = 6.2, gap = 3.4;

  for (const s of [-1, 1]) box(g, s * (gap / 2), ph / 2, z, pw, ph, pw, red);
  // nuki (lower crossbeam)
  box(g, 0, 3.6, z, gap + pw, 0.45, 0.55, red);
  // top beam (kasagi), slightly wider
  box(g, 0, ph + 0.2, z, gap + pw + 1.2, 0.55, 0.75, red);
  // small cap beam (shimaki)
  box(g, 0, ph + 0.6, z, gap + pw + 0.5, 0.3, 0.55, red);
  // top ornament block
  box(g, 0, ph + 0.95, z, 0.35, 0.5, 0.35, dark);
  return g;
}
scene.add(buildTorii(0, 10));

/* ---------- lighting with shadows ---------- */
const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x4a5a3a, 0.75);
scene.add(hemi);
const ambient = new THREE.AmbientLight(0xffffff, 0.25);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff2d0, 1.5);
sun.position.set(18, 30, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = 26;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 90;
sun.shadow.camera.left = -sc;
sun.shadow.camera.right = sc;
sun.shadow.camera.top = sc;
sun.shadow.camera.bottom = -sc;
sun.shadow.bias = -0.0004;
scene.add(sun);
scene.add(sun.target);

/* ---------- drifting blossom petals (thin cubes) ---------- */
const petalMat = mat(0xffb7c5, { roughness: 0.8, side: THREE.DoubleSide });
const petals = [];
for (let i = 0; i < 80; i++) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.05, 0.2), petalMat);
  p.position.set((Math.random() - 0.5) * 34, 3 + Math.random() * 16, (Math.random() - 0.5) * 34);
  p.userData = {
    vy: 0.02 + Math.random() * 0.03,
    phase: Math.random() * Math.PI * 2,
    sway: 0.01 + Math.random() * 0.03
  };
  scene.add(p);
  petals.push(p);
}
function updatePetals() {
  for (const p of petals) {
    p.position.y -= p.userData.vy;
    p.userData.phase += 0.04;
    p.position.x += Math.sin(p.userData.phase) * p.userData.sway;
    p.position.z += Math.cos(p.userData.phase * 0.7) * p.userData.sway * 0.6;
    p.rotation.x += 0.03;
    p.rotation.z += 0.02;
    if (p.position.y < 0) {
      p.position.y = 16 + Math.random() * 4;
      p.position.x = (Math.random() - 0.5) * 34;
      p.position.z = (Math.random() - 0.5) * 34;
    }
  }
}

/* ---------- loop ---------- */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  updatePetals();
  renderer.render(scene, camera);
}
animate();

/* ---------- resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
