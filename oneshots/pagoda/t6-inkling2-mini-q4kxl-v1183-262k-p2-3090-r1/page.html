<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxel Japanese Pagoda</title>
<style>
  body { margin: 0; overflow: hidden; background: #fceef3; font-family: sans-serif; }
  #info { position: absolute; top: 10px; left: 10px; color: #5a3a45; background: rgba(255,255,255,0.7); padding: 8px 12px; border-radius: 10px; font-size: 14px; pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">🌸 Voxel Pagoda Scene — drag to orbit</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfdeef4);
scene.fog = new THREE.Fog(0xfdeef4, 40, 90);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(22, 16, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 10;
controls.maxDistance = 50;

// Lights
const hemi = new THREE.HemisphereLight(0xfff0f5, 0x8a9a6a, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.position.set(18, 28, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 80;
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
sun.shadow.bias = -0.0005;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xcfe0ff, 0.4);
fill.position.set(-15, 12, -10);
scene.add(fill);

// Helper: make a voxel cube mesh
function box(w, h, d, color, x, y, z, cast = true) {
  const mat = new THREE.MeshLambertMaterial({ color });
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = cast; m.receiveShadow = true;
  scene.add(m);
  return m;
}

// Ground
const ground = new THREE.Mesh(new THREE.BoxGeometry(70, 1, 70), new THREE.MeshLambertMaterial({ color: 0x7ec850 }));
ground.position.y = -0.5;
ground.receiveShadow = true;
scene.add(ground);

// Grass tufts
for (let i = 0; i < 60; i++) {
  const x = (Math.random() - 0.5) * 55;
  const z = (Math.random() - 0.5) * 55;
  if (Math.abs(x) < 6 && Math.abs(z) < 6) continue;
  if (Math.hypot(x - (-10), z - 8) < 5) continue; // pond area
  box(0.35, 0.5 + Math.random() * 0.4, 0.35, 0x5aa838, x, 0.25, z, false);
}

// Stone platform under pagoda
const platY = 0.3;
box(11, 0.6, 11, 0x9aa0a8, 0, platY, 0);
box(9.5, 0.6, 9.5, 0xb8bcc2, 0, platY + 0.6, 0);
// corner lanterns rocks
for (const [cx, cz] of [[-5,-5],[5,-5],[-5,5],[5,5]]) box(0.9, 0.9, 0.9, 0x8a8f96, cx, 0.45, cz);

// Pagoda
const wood = 0x6b3a26;
const woodDark = 0x4a2716;
const roof = 0x2e3440;
const roofEdge = 0x3d4657;

let baseY = 0.9; // top of platform
const stories = 5;
const sizes = [7, 5.8, 4.7, 3.7, 2.8]; // story body width
const heights = [2.6, 2.3, 2.0, 1.8, 1.6];

function makeRoof(y, w) {
  // stacked roof layers with upturned eaves
  const layers = 3;
  for (let i = 0; i < layers; i++) {
    const lw = w + 2.4 - i * 0.8;
    const lh = 0.45;
    box(lw, lh, lw, i === layers - 1 ? roofEdge : roof, 0, y + i * 0.4, 0);
  }
  // upturned corner tips
  const tipW = 0.55;
  const tipOff = (w + 2.4) / 2 - 0.1;
  for (const [sx, sz] of [[1,1],[1,-1],[-1,1],[-1,-1]]) {
    box(tipW, 0.55, tipW, roofEdge, sx * tipOff, y + 0.85, sz * tipOff);
  }
  return y + 1.1;
}

for (let i = 0; i < stories; i++) {
  const w = sizes[i];
  const h = heights[i];
  // body
  box(w, h, w, wood, 0, baseY + h / 2, 0);
  // door
  box(1.1, 1.5, 0.15, 0x1d120b, 0, baseY + 0.85, w / 2 + 0.05, false);
  // window accents
  box(1.0, 0.8, 0.12, 0xffe6a3, -w / 2 + 1.0, baseY + h * 0.6, w / 2 + 0.04, false);
  box(1.0, 0.8, 0.12, 0xffe6a3, w / 2 - 1.0, baseY + h * 0.6, w / 2 + 0.04, false);
  // roof
  baseY = makeRoof(baseY + h, w);
}

// Spire
box(0.5, 2.2, 0.5, 0xd4af37, 0, baseY + 1.0, 0);
box(1.1, 0.25, 1.1, 0xd4af37, 0, baseY + 2.1, 0);
const orb = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.55), new THREE.MeshLambertMaterial({ color: 0xffe27a }));
orb.position.set(0, baseY + 2.55, 0);
orb.castShadow = true;
scene.add(orb);

// Cherry blossom trees
function cherryTree(x, z, scale = 1) {
  const g = new THREE.Group();
  // trunk
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5a3a28 });
  const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.9*scale, 2.4*scale, 0.9*scale), trunkMat);
  trunk.position.y = 1.2*scale; trunk.castShadow = true;
  g.add(trunk);
  // branch
  const branch = new THREE.Mesh(new THREE.BoxGeometry(0.5*scale, 1.6*scale, 0.5*scale), trunkMat);
  branch.position.set(0.55*scale, 2.3*scale, 0); branch.rotation.z = -0.5; branch.castShadow = true;
  g.add(branch);
  // blossom canopy
  const pinks = [0xffb7ce, 0xffc9dc, 0xff9fbe];
  const blobs = [
    [0, 3.6, 0, 2.0], [1.3, 3.1, 0.4, 1.3], [-1.2, 3.2, -0.3, 1.3],
    [0.3, 4.3, -0.4, 1.2], [-0.5, 3.0, 1.1, 1.1], [0.9, 4.0, -0.8, 1.0]
  ];
  for (const [bx, by, bz, s] of blobs) {
    const c = pinks[Math.floor(Math.random()*pinks.length)];
    const m = new THREE.Mesh(new THREE.BoxGeometry(s*scale, s*scale*0.8, s*scale), new THREE.MeshLambertMaterial({ color: c }));
    m.position.set(bx*scale, by*scale, bz*scale);
    m.castShadow = true;
    g.add(m);
  }
  g.position.set(x, 0, z);
  scene.add(g);
  return g;
}
cherryTree(-8, 6, 1.2);
cherryTree(8, 7, 1.0);
cherryTree(-9, -6, 0.9);

// Small pond
const pond = new THREE.Mesh(new THREE.CylinderGeometry(4, 4.4, 0.5, 24), new THREE.MeshLambertMaterial({ color: 0x3f7fb8 }));
pond.position.set(-11, 0.1, 8);
pond.receiveShadow = true;
scene.add(pond);
const pondRim = new THREE.Mesh(new THREE.CylinderGeometry(4.5, 4.7, 0.35, 24), new THREE.MeshLambertMaterial({ color: 0x9aa0a8 }));
pondRim.position.set(-11, 0.0, 8);
pondRim.receiveShadow = true;
scene.add(pondRim);
// lily pads
for (let i = 0; i < 4; i++) {
  const a = Math.random() * Math.PI * 2, r = 1 + Math.random() * 2;
  const pad = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.12, 0.9), new THREE.MeshLambertMaterial({ color: 0x3f8f4f }));
  pad.position.set(-11 + Math.cos(a)*r, 0.38, 8 + Math.sin(a)*r);
  scene.add(pad);
}

// Torii gate
function torii(x, z, rotY = 0) {
  const g = new THREE.Group();
  const red = new THREE.MeshLambertMaterial({ color: 0xd62f2f });
  const dark = new THREE.MeshLambertMaterial({ color: 0x2b2b2b });
  const pillarL = new THREE.Mesh(new THREE.BoxGeometry(0.55, 3.6, 0.55), red);
  pillarL.position.set(-1.6, 1.8, 0);
  const pillarR = pillarL.clone(); pillarR.position.x = 1.6;
  const top = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.5, 0.7), red);
  top.position.y = 3.7;
  const topCap = new THREE.Mesh(new THREE.BoxGeometry(5.0, 0.3, 0.85), dark);
  topCap.position.y = 4.0;
  const lintel = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.35, 0.5), red);
  lintel.position.y = 2.9;
  [pillarL, pillarR, top, topCap, lintel].forEach(m => { m.castShadow = true; g.add(m); });
  g.position.set(x, 0, z);
  g.rotation.y = rotY;
  scene.add(g);
}
torii(6, -9, 0.4);

// Stepping stones path
for (let i = 0; i < 6; i++) {
  const t = i / 5;
  box(1.1, 0.25, 1.1, 0xb0b4ba, 2 + t * 3.4, 0.12, -2 - t * 6.2, false);
}

// Drifting petals
const petals = [];
const petalGeo = new THREE.BoxGeometry(0.28, 0.05, 0.2);
const petalMat = new THREE.MeshLambertMaterial({ color: 0xffc0d8 });
for (let i = 0; i < 50; i++) {
  const p = new THREE.Mesh(petalGeo, petalMat);
  p.position.set((Math.random()-0.5)*30, Math.random()*12 + 3, (Math.random()-0.5)*30);
  p.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
  p.castShadow = true;
  scene.add(p);
  petals.push({ m: p, speed: 0.6 + Math.random()*0.9, sway: Math.random()*Math.PI*2, rot: (Math.random()-0.5)*2 });
}

// Animate
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  controls.update();

  for (const p of petals) {
    p.m.position.y -= p.speed * dt;
    p.sway += dt * 1.5;
    p.m.position.x += Math.sin(p.sway) * dt * 0.8;
    p.m.position.z += Math.cos(p.sway * 0.7) * dt * 0.5;
    p.m.rotation.x += p.rot * dt;
    p.m.rotation.z += p.rot * 0.6 * dt;
    if (p.m.position.y < 0.05) {
      p.m.position.set((Math.random()-0.5)*30, 10 + Math.random()*4, (Math.random()-0.5)*30);
    }
  }

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
