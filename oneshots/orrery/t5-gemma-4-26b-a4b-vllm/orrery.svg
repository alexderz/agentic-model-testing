<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brass Gradient -->
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8860B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </linearGradient>
    
    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFF700;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:0" />
    </radialGradient>

    <!-- Shadow Effect -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:black;stop-opacity:0" />
      <stop offset="50%" style="stop-color:black;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:black;stop-opacity:0.8" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#1a1a1a" />

  <!-- Central Gear Mechanism (Visual) -->
  <g transform="translate(400,400)">
    <circle r="380" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="5,5" />
    
    <!-- Main Brass Gear -->
    <circle r="120" fill="url(#brass)" stroke="#5d4037" stroke-width="4" />
    <circle r="110" fill="none" stroke="#5d4037" stroke-width="2" stroke-dasharray="10,5" />
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />

    <!-- The Sun -->
    <circle r="50" fill="#FFD700" />
    <circle r="60" fill="url(#sunGlow)">
      <animate attributeName="r" values="50;65;50" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Orbit Paths and Planets -->
  <!-- 
    Speed Scaling Logic: 
    Relative speeds (Mercury: 0.24, Venus: 0.61, Earth: 1, Mars: 1.88, Jupiter: 11.86, Saturn: 29.45)
    We will use these ratios to set durations.
  -->

  <!-- Mercury -->
  <g>
    <circle cx="400" cy="400" r="130" fill="none" stroke="#555" stroke-width="1" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
      <g transform="translate(400, 270)">
        <circle r="6" fill="#A5A5A5" />
        <!-- Day/Night Shadow -->
        <circle r="6" fill="url(#shadow)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite" />
        </circle>
      </g>
    </g>
  </g>

  <!-- Venus -->
  <g>
    <circle cx="400" cy="400" r="170" fill="none" stroke="#555" stroke-width="1" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite" />
      <g transform="translate(400, 230)">
        <circle r="10" fill="#E3BB76" />
        <circle r="10" fill="url(#shadow)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite" />
        </circle>
      </g>
    </g>
  </g>

  <!-- Earth -->
  <g>
    <circle cx="400" cy="400" r="210" fill="none" stroke="#555" stroke-width="1" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite" />
      <g transform="translate(400, 190)">
        <circle r="12" fill="#2271B3" />
        <!-- Atmosphere glow -->
        <circle r="13" fill="none" stroke="#87CEEB" stroke-width="1" opacity="0.5" />
        <circle r="12" fill="url(#shadow)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.5s" repeatCount="indefinite" />
        </circle>
      </g>
    </g>
  </g>

  <!-- Mars -->
  <g>
    <circle cx="400" cy="400" r="260" fill="none" stroke="#555" stroke-width="1" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite" />
      <g transform="translate(400, 140)">
        <circle r="8" fill="#E27B58" />
        <circle r="8" fill="url(#shadow)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite" />
        </circle>
      </g>
    </g>
  </g>

  <!-- Jupiter -->
  <g>
    <circle cx="400" cy="400" r="320" fill="none" stroke="#555" stroke-width="1" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="50s" repeatCount="indefinite" />
      <g transform="translate(400, 80)">
        <circle r="22" fill="#D39C7E" />
        <circle r="22" fill="url(#shadow)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite" />
        </circle>
      </g>
    </g>
  </g>

  <!-- Saturn -->
  <g>
    <circle cx="400" cy="400" r="370" fill="none" stroke="#555" stroke-width="1" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="80s" repeatCount="indefinite" />
      <g transform="translate(400, 30)">
        <!-- Saturn's Ring -->
        <ellipse cx="0" cy="0" rx="35" ry="10" fill="none" stroke="#C5AB6E" stroke-width="3" transform="rotate(15)" />
        <circle r="18" fill="#EAD6B8" />
        <circle r="18" fill="url(#shadow)">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite" />
        </circle>
      </g>
    </g>
  </g>

  <!-- Decorative Outer Gear Ring -->
  <g transform="translate(400,400)">
    <circle r="385" fill="none" stroke="url(#brass)" stroke-width="8" stroke-dasharray="2,15" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="100s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>