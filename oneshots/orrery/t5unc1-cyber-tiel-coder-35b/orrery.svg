<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" font-family="Georgia,serif">
<defs>
  <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
    <stop offset="0" stop-color="#1b2735"/><stop offset="0.6" stop-color="#0d141d"/><stop offset="1" stop-color="#05080c"/>
  </radialGradient>
  <linearGradient id="brassV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7e59b"/><stop offset="0.45" stop-color="#c9a24b"/>
    <stop offset="0.8" stop-color="#8a6b2f"/><stop offset="1" stop-color="#5a4620"/>
  </linearGradient>
  <radialGradient id="brassD" cx="0.35" cy="0.3" r="0.85">
    <stop offset="0" stop-color="#f7e59b"/><stop offset="0.55" stop-color="#c49a41"/>
    <stop offset="1" stop-color="#6b521e"/>
  </radialGradient>
  <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fffbe6"/><stop offset="0.4" stop-color="#ffd23f"/>
    <stop offset="0.75" stop-color="#ff9b10"/><stop offset="1" stop-color="#d9690a"/>
  </radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffd766" stop-opacity="0.75"/><stop offset="0.4" stop-color="#ff9d1e" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#ff8c00" stop-opacity="0"/>
  </radialGradient>
  <!-- day-lit on left (toward sun), night on right -->
  <radialGradient id="pMerc" cx="0.3" cy="0.45" r="0.9">
    <stop offset="0" stop-color="#e7e2d6"/><stop offset="0.45" stop-color="#a89f90"/><stop offset="0.8" stop-color="#5c554b"/><stop offset="1" stop-color="#1c1913"/>
  </radialGradient>
  <radialGradient id="pVenus" cx="0.3" cy="0.45" r="0.9">
    <stop offset="0" stop-color="#fdf0c8"/><stop offset="0.4" stop-color="#e6c47a"/><stop offset="0.8" stop-color="#7a5a22"/><stop offset="1" stop-color="#2b1f0a"/>
  </radialGradient>
  <radialGradient id="pEarth" cx="0.3" cy="0.45" r="0.9">
    <stop offset="0" stop-color="#cfeaff"/><stop offset="0.35" stop-color="#2f7bd6"/><stop offset="0.75" stop-color="#103a7a"/><stop offset="1" stop-color="#04122e"/>
  </radialGradient>
  <radialGradient id="pMars" cx="0.3" cy="0.45" r="0.9">
    <stop offset="0" stop-color="#f6c79b"/><stop offset="0.4" stop-color="#d1602f"/><stop offset="0.8" stop-color="#6b2812"/><stop offset="1" stop-color="#240c05"/>
  </radialGradient>
  <radialGradient id="pJup" cx="0.3" cy="0.45" r="0.9">
    <stop offset="0" stop-color="#f5e3c0"/><stop offset="0.4" stop-color="#d6ab74"/><stop offset="0.8" stop-color="#7a5530"/><stop offset="1" stop-color="#2a1c0d"/>
  </radialGradient>
  <radialGradient id="pSat" cx="0.3" cy="0.45" r="0.9">
    <stop offset="0" stop-color="#f7ecc6"/><stop offset="0.4" stop-color="#dcc183"/><stop offset="0.8" stop-color="#80662f"/><stop offset="1" stop-color="#2a210c"/>
  </radialGradient>
  <radialGradient id="pUra" cx="0.3" cy="0.45" r="0.9">
    <stop offset="0" stop-color="#cff5f5"/><stop offset="0.45" stop-color="#7fd6d6"/><stop offset="0.8" stop-color="#357a7e"/><stop offset="1" stop-color="#0b2b2e"/>
  </radialGradient>
  <radialGradient id="pNep" cx="0.3" cy="0.45" r="0.9">
    <stop offset="0" stop-color="#a9c8ff"/><stop offset="0.4" stop-color="#3a64c8"/><stop offset="0.8" stop-color="#152a6b"/><stop offset="1" stop-color="#050b24"/>
  </radialGradient>
  <radialGradient id="ringGrad" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0.55" stop-color="#e9d6a3" stop-opacity="0.15"/>
    <stop offset="0.65" stop-color="#d8bd82" stop-opacity="0.55"/>
    <stop offset="0.75" stop-color="#b8974f" stop-opacity="0.28"/>
    <stop offset="0.85" stop-color="#e9d6a3" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#c9a24b" stop-opacity="0.05"/>
  </radialGradient>
  <!-- module-matched teeth (same module => same tangential speed => they mesh) -->
  <path id="t1" d="M96,-6.4 L112,-5.3 L112,5.3 L96,6.4 Z"/>
  <path id="t2" d="M54.25,-6.6 L70,-5.5 L70,5.5 L54.25,6.6 Z"/>
  <path id="t3" d="M75.25,-6.6 L91,-5.5 L91,5.5 L75.25,6.6 Z"/>
  <clipPath id="cMerc"><circle cx="0" cy="0" r="6"/></clipPath>
  <clipPath id="cVenus"><circle cx="0" cy="0" r="10"/></clipPath>
  <clipPath id="cEarth"><circle cx="0" cy="0" r="10.5"/></clipPath>
  <clipPath id="cMars"><circle cx="0" cy="0" r="8"/></clipPath>
  <clipPath id="cJup"><circle cx="0" cy="0" r="24"/></clipPath>
  <clipPath id="cSat"><circle cx="0" cy="0" r="19"/></clipPath>
  <clipPath id="cUra"><circle cx="0" cy="0" r="13"/></clipPath>
  <clipPath id="cNep"><circle cx="0" cy="0" r="13"/></clipPath>
</defs>

<rect width="1000" height="1000" fill="url(#bg)"/>

<!-- outer brass bezel -->
<circle cx="500" cy="500" r="495" fill="none" stroke="url(#brassV)" stroke-width="10"/>
<circle cx="500" cy="500" r="486" fill="none" stroke="#3c2f14" stroke-width="2"/>
<g fill="#7a5f2a" opacity="0.8">
  <g id="ticks"><rect x="497" y="18" width="6" height="14" rx="2"/></g>
  <use href="#ticks" transform="rotate(30 500 500)"/>
  <use href="#ticks" transform="rotate(60 500 500)"/>
  <use href="#ticks" transform="rotate(90 500 500)"/>
  <use href="#ticks" transform="rotate(120 500 500)"/>
  <use href="#ticks" transform="rotate(150 500 500)"/>
  <use href="#ticks" transform="rotate(180 500 500)"/>
  <use href="#ticks" transform="rotate(210 500 500)"/>
  <use href="#ticks" transform="rotate(240 500 500)"/>
  <use href="#ticks" transform="rotate(270 500 500)"/>
  <use href="#ticks" transform="rotate(300 500 500)"/>
  <use href="#ticks" transform="rotate(330 500 500)"/>
</g>

<!-- orbit rails -->
<g fill="none" stroke="#8a6b2f" stroke-opacity="0.5" stroke-width="1.4">
  <circle cx="500" cy="500" r="92"/><circle cx="500" cy="500" r="130"/>
  <circle cx="500" cy="500" r="170"/><circle cx="500" cy="500" r="212"/>
  <circle cx="500" cy="500" r="285"/><circle cx="500" cy="500" r="360"/>
  <circle cx="500" cy="500" r="425"/><circle cx="500" cy="500" r="475"/>
</g>

<!-- ================= GEAR TRAIN (module m=7, meshes + inverse-ratio drive) ================= -->
<g>
  <!-- base plate -->
  <rect x="230" y="700" width="470" height="250" rx="18" fill="#121a22" stroke="#5a4620" stroke-width="3"/>
  <rect x="245" y="715" width="440" height="220" rx="12" fill="url(#brassD)" opacity="0.22"/>
  <!-- drive column up to the orrery -->
  <rect x="393" y="560" width="14" height="150" fill="url(#brassV)"/>
  <circle cx="400" cy="560" r="12" fill="url(#brassD)"/>

  <!-- G1: N=30, CW, 12s -->
  <g transform="translate(400,860)"><g>
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite"/>
    <circle r="96" fill="url(#brassD)"/><circle r="96" fill="none" stroke="#4a3a18" stroke-width="2.5"/>
    <g fill="url(#brassV)" stroke="#4a3a18" stroke-width="0.6">
      <use href="#t1" transform="rotate(0)"/><use href="#t1" transform="rotate(12)"/><use href="#t1" transform="rotate(24)"/>
      <use href="#t1" transform="rotate(36)"/><use href="#t1" transform="rotate(48)"/><use href="#t1" transform="rotate(60)"/>
      <use href="#t1" transform="rotate(72)"/><use href="#t1" transform="rotate(84)"/><use href="#t1" transform="rotate(96)"/>
      <use href="#t1" transform="rotate(108)"/><use href="#t1" transform="rotate(120)"/><use href="#t1" transform="rotate(132)"/>
      <use href="#t1" transform="rotate(144)"/><use href="#t1" transform="rotate(156)"/><use href="#t1" transform="rotate(168)"/>
      <use href="#t1" transform="rotate(180)"/><use href="#t1" transform="rotate(192)"/><use href="#t1" transform="rotate(204)"/>
      <use href="#t1" transform="rotate(216)"/><use href="#t1" transform="rotate(228)"/><use href="#t1" transform="rotate(240)"/>
      <use href="#t1" transform="rotate(252)"/><use href="#t1" transform="rotate(264)"/><use href="#t1" transform="rotate(276)"/>
      <use href="#t1" transform="rotate(288)"/><use href="#t1" transform="rotate(300)"/><use href="#t1" transform="rotate(312)"/>
      <use href="#t1" transform="rotate(324)"/><use href="#t1" transform="rotate(336)"/><use href="#t1" transform="rotate(348)"/>
    </g>
    <circle r="20" fill="url(#brassD)"/><circle r="6" fill="#2a210f"/>
  </g></g>

  <!-- G2: N=18, CCW, 7.2s (phase 10° meshes its tip into G1's valley) -->
  <g transform="translate(400,692)"><g>
    <animateTransform attributeName="transform" type="rotate" from="10 0 0" to="-350 0 0" dur="7.2s" repeatCount="indefinite"/>
    <circle r="54.25" fill="url(#brassD)"/><circle r="54.25" fill="none" stroke="#4a3a18" stroke-width="2"/>
    <g fill="url(#brassV)" stroke="#4a3a18" stroke-width="0.5">
      <use href="#t2" transform="rotate(0)"/><use href="#t2" transform="rotate(20)"/><use href="#t2" transform="rotate(40)"/>
      <use href="#t2" transform="rotate(60)"/><use href="#t2" transform="rotate(80)"/><use href="#t2" transform="rotate(100)"/>
      <use href="#t2" transform="rotate(120)"/><use href="#t2" transform="rotate(140)"/><use href="#t2" transform="rotate(160)"/>
      <use href="#t2" transform="rotate(180)"/><use href="#t2" transform="rotate(200)"/><use href="#t2" transform="rotate(220)"/>
      <use href="#t2" transform="rotate(240)"/><use href="#t2" transform="rotate(260)"/><use href="#t2" transform="rotate(280)"/>
      <use href="#t2" transform="rotate(300)"/><use href="#t2" transform="rotate(320)"/><use href="#t2" transform="rotate(340)"/>
    </g>
    <circle r="13" fill="url(#brassD)"/><circle r="4" fill="#2a210f"/>
  </g></g>

  <!-- G3: N=24, CW, 9.6s -->
  <g transform="translate(547,692)"><g>
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="9.6s" repeatCount="indefinite"/>
    <circle r="75.25" fill="url(#brassD)"/><circle r="75.25" fill="none" stroke="#4a3a18" stroke-width="2.2"/>
    <g fill="url(#brassV)" stroke="#4a3a18" stroke-width="0.6">
      <use href="#t3" transform="rotate(0)"/><use href="#t3" transform="rotate(15)"/><use href="#t3" transform="rotate(30)"/>
      <use href="#t3" transform="rotate(45)"/><use href="#t3" transform="rotate(60)"/><use href="#t3" transform="rotate(75)"/>
      <use href="#t3" transform="rotate(90)"/><use href="#t3" transform="rotate(105)"/><use href="#t3" transform="rotate(120)"/>
      <use href="#t3" transform="rotate(135)"/><use href="#t3" transform="rotate(150)"/><use href="#t3" transform="rotate(165)"/>
      <use href="#t3" transform="rotate(180)"/><use href="#t3" transform="rotate(195)"/><use href="#t3" transform="rotate(210)"/>
      <use href="#t3" transform="rotate(225)"/><use href="#t3" transform="rotate(240)"/><use href="#t3" transform="rotate(255)"/>
      <use href="#t3" transform="rotate(270)"/><use href="#t3" transform="rotate(285)"/><use href="#t3" transform="rotate(300)"/>
      <use href="#t3" transform="rotate(315)"/><use href="#t3" transform="rotate(330)"/><use href="#t3" transform="rotate(345)"/>
    </g>
    <circle r="16" fill="url(#brassD)"/><circle r="5" fill="#2a210f"/>
  </g></g>
</g>

<!-- ================= SUN ================= -->
<circle cx="500" cy="500" r="70" fill="url(#halo)" filter="url(#glow)"/>
<circle cx="500" cy="500" r="40" fill="url(#sunGrad)" filter="url(#glow)">
  <animateTransform attributeName="transform" type="rotate" from="0 500 500" to="360 500 500" dur="25s" repeatCount="indefinite"/>
</circle>

<!-- ================= PLANETS (real relative orbital speeds) ================= -->
<!-- Mercury: 87.97d -> 2.9s -->
<g><animateTransform attributeName="transform" type="rotate" from="40 500 500" to="400 500 500" dur="2.9s" repeatCount="indefinite"/>
 <g transform="translate(92,0)">
  <circle r="6" fill="url(#pMerc)"/>
  <g clip-path="url(#cMerc)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/>
    <circle cx="-1.6" cy="-1.6" r="1.3" fill="#5c554b"/><circle cx="2" cy="1.5" r="1.1" fill="#5c554b"/><circle cx="-2.6" cy="1.8" r="0.8" fill="#4c463d"/></g></g>
 </g></g>

<!-- Venus: 224.7d -> 7.4s -->
<g><animateTransform attributeName="transform" type="rotate" from="120 500 500" to="480 500 500" dur="7.4s" repeatCount="indefinite"/>
 <g transform="translate(130,0)">
  <circle r="10" fill="url(#pVenus)"/>
  <g clip-path="url(#cVenus)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="26s" repeatCount="indefinite"/>
    <path d="M-10,-3 Q0,-7 10,-1 M-9,2 Q1,6 9,4 M-6,-7 Q0,-3 6,-6" stroke="#c9a554" stroke-width="1.3" fill="none" opacity="0.6"/>
    <ellipse cx="2" cy="1" rx="4" ry="2.5" fill="#d8b866" opacity="0.4"/></g></g>
 </g></g>

<!-- Earth: 365.25d -> 12s -->
<g><animateTransform attributeName="transform" type="rotate" from="200 500 500" to="560 500 500" dur="12s" repeatCount="indefinite"/>
 <g transform="translate(170,0)">
  <circle r="10.5" fill="url(#pEarth)"/>
  <g clip-path="url(#cEarth)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3s" repeatCount="indefinite"/>
    <path d="M-4,-7 Q-9,-4 -7,1 Q-11,3 -6,6 Q-3,9 2,7 Q7,4 4,-1 Q9,-4 4,-7 Q0,-9 -4,-7 Z" fill="#3fa04a" opacity="0.85"/>
    <path d="M3,4 Q6,6 9,4 M-2,6 Q0,9 4,8" stroke="#2f8a40" stroke-width="1" fill="none" opacity="0.7"/>
    <ellipse cx="-2" cy="-3" rx="4" ry="1.6" fill="#ffffff" opacity="0.5" transform="rotate(-25 -2 -3)"/>
    <ellipse cx="4" cy="3" rx="3" ry="1.2" fill="#ffffff" opacity="0.4" transform="rotate(20 4 3)"/></g></g>
  <circle r="10.5" fill="none" stroke="#8fd0ff" stroke-opacity="0.35" stroke-width="1.2"/>
 </g></g>

<!-- Mars: 687d -> 22.6s -->
<g><animateTransform attributeName="transform" type="rotate" from="300 500 500" to="660 500 500" dur="22.6s" repeatCount="indefinite"/>
 <g transform="translate(212,0)">
  <circle r="8" fill="url(#pMars)"/>
  <g clip-path="url(#cMars)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3.2s" repeatCount="indefinite"/>
    <path d="M-3,-6 Q1,-4 3,-7 M-4,1 Q0,3 4,1 M-1,5 Q2,7 5,5" stroke="#8a3a18" stroke-width="1.2" fill="none" opacity="0.7"/>
    <circle cx="1" cy="-2" r="1.4" fill="#7a2f14" opacity="0.6"/><ellipse cx="-2" cy="3" rx="2" ry="1" fill="#6b2812" opacity="0.5"/>
    <path d="M-5,-6.5 Q0,-8 5,-6.5 Z" fill="#eef4f7" opacity="0.7"/><path d="M-5,6.5 Q0,8 5,6.5 Z" fill="#eef4f7" opacity="0.7"/></g></g>
 </g></g>

<!-- Jupiter: 4333d -> 142s -->
<g><animateTransform attributeName="transform" type="rotate" from="60 500 500" to="420 500 500" dur="142s" repeatCount="indefinite"/>
 <g transform="translate(285,0)">
  <circle r="24" fill="url(#pJup)"/>
  <g clip-path="url(#cJup)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.4s" repeatCount="indefinite"/>
    <rect x="-24" y="-20" width="48" height="3.5" fill="#b5884f" opacity="0.6"/>
    <rect x="-24" y="-12" width="48" height="5" fill="#caa06a" opacity="0.7"/>
    <rect x="-24" y="-3" width="48" height="7" fill="#8a6338" opacity="0.65"/>
    <rect x="-24" y="8" width="48" height="4.5" fill="#c69a62" opacity="0.6"/>
    <rect x="-24" y="16" width="48" height="3" fill="#9a713f" opacity="0.55"/>
    <ellipse cx="6" cy="5" rx="4.5" ry="3" fill="#b5532a" opacity="0.85"/></g></g>
 </g></g>

<!-- Saturn: 10759d -> 353s -->
<g><animateTransform attributeName="transform" type="rotate" from="150 500 500" to="510 500 500" dur="353s" repeatCount="indefinite"/>
 <g transform="translate(360,0)">
  <g transform="rotate(-20)">
   <ellipse cx="0" cy="0" rx="38" ry="10" fill="none" stroke="url(#ringGrad)" stroke-width="6"/>
   <ellipse cx="0" cy="0" rx="33" ry="8.5" fill="none" stroke="#d8bd82" stroke-opacity="0.35" stroke-width="1"/>
  </g>
  <circle r="19" fill="url(#pSat)"/>
  <g clip-path="url(#cSat)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.6s" repeatCount="indefinite"/>
    <rect x="-19" y="-14" width="38" height="2.6" fill="#b8974f" opacity="0.55"/>
    <rect x="-19" y="-5" width="38" height="4" fill="#caa06a" opacity="0.6"/>
    <rect x="-19" y="6" width="38" height="3.5" fill="#a07d3f" opacity="0.55"/>
    <rect x="-19" y="13" width="38" height="2" fill="#c69a62" opacity="0.45"/></g></g>
 </g></g>

<!-- Uranus: 30687d -> 1008s -->
<g><animateTransform attributeName="transform" type="rotate" from="240 500 500" to="600 500 500" dur="1008s" repeatCount="indefinite"/>
 <g transform="translate(425,0)">
  <g transform="rotate(82)"><ellipse cx="0" cy="0" rx="22" ry="5" fill="none" stroke="#a8d8d6" stroke-opacity="0.35" stroke-width="1.4"/></g>
  <circle r="13" fill="url(#pUra)"/>
  <g clip-path="url(#cUra)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
    <rect x="-13" y="-8" width="26" height="2" fill="#a0d0d0" opacity="0.4"/>
    <rect x="-13" y="2" width="26" height="2.5" fill="#7fb8b8" opacity="0.4"/></g></g>
 </g></g>

<!-- Neptune: 60190d -> 1977s -->
<g><animateTransform attributeName="transform" type="rotate" from="330 500 500" to="690 500 500" dur="1977s" repeatCount="indefinite"/>
 <g transform="translate(475,0)">
  <circle r="13" fill="url(#pNep)"/>
  <g clip-path="url(#cNep)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2.5s" repeatCount="indefinite"/>
    <rect x="-13" y="-7" width="26" height="2" fill="#6f94d8" opacity="0.5"/>
    <rect x="-13" y="4" width="26" height="2.5" fill="#4a6bc0" opacity="0.5"/>
    <ellipse cx="-2" cy="-1" rx="3" ry="2" fill="#152a6b" opacity="0.7"/></g></g>
 </g></g>

<!-- caption -->
<text x="500" y="965" text-anchor="middle" fill="#c9a24b" font-size="14" letter-spacing="3" opacity="0.85">C L O C K W O R K   O R R E R Y</text>
<text x="500" y="985" text-anchor="middle" fill="#7a6a3a" font-size="10" letter-spacing="2" opacity="0.7">periods at true relative rates</text>
</svg>