<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <style>
      .gear { fill: none; stroke: #d7ac42; }
      .idler { stroke-opacity: .85; }
      .orbit { stroke-opacity: .42; }
      .d1 { stroke-dasharray: 6 5; }
      .d2 { stroke-dasharray: 10 8; }
      .d3 { stroke-dasharray: 14 11; }
      .shadow { fill: #050404; fill-opacity: .55; }
      .arm { stroke: #c69a3b; stroke-width: 4; stroke-linecap: round; }
      .core { fill: url(#brassDim); }
      .frame { fill: none; stroke: #4c3a16; }
    </style>

    <radialGradient id="brass" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe69b"/>
      <stop offset="45%" stop-color="#d0a945"/>
      <stop offset="100%" stop-color="#7d5c1c"/>
    </radialGradient>

    <radialGradient id="brassDim" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#c49b3e" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#2b2113" stop-opacity=".18"/>
    </radialGradient>

    <radialGradient id="sunGrad" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#fff6bf"/>
      <stop offset="45%" stop-color="#f4c54c"/>
      <stop offset="100%" stop-color="#94651a"/>
    </radialGradient>

    <radialGradient id="gMercury" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f1e2b7"/><stop offset="100%" stop-color="#7e7154"/>
    </radialGradient>
    <radialGradient id="gVenus" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe2a0"/><stop offset="100%" stop-color="#8f6d22"/>
    </radialGradient>
    <radialGradient id="gEarth" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#9ad7d2"/><stop offset="100%" stop-color="#225a55"/>
    </radialGradient>
    <radialGradient id="gMars" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff9d74"/><stop offset="100%" stop-color="#742f19"/>
    </radialGradient>
    <radialGradient id="gJupiter" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffe7a8"/><stop offset="100%" stop-color="#9a7830"/>
    </radialGradient>
    <radialGradient id="gSaturn" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f4d186"/><stop offset="100%" stop-color="#896422"/>
    </radialGradient>
    <radialGradient id="gUranus" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#b4f2ef"/><stop offset="100%" stop-color="#2d6f69"/>
    </radialGradient>
    <radialGradient id="gNeptune" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#86abef"/><stop offset="100%" stop-color="#22396a"/>
    </radialGradient>

    <g id="marks" fill="#fff3c6" opacity=".55">
      <circle cx="-0.35" cy="-0.28" r="0.12"/>
      <circle cx="0.22" cy="0.33" r="0.09"/>
      <path d="M-0.62,0.05 Q0,-0.22 0.6,0.12" fill="none" stroke="#fff3c6" stroke-width="0.08" opacity=".7"/>
    </g>
  </defs>

  <rect width="1200" height="1200" fill="#0a0908"/>
  <circle cx="600" cy="600" r="585" class="frame" stroke-width="10" opacity=".75"/>
  <circle cx="600" cy="600" r="568" class="frame" stroke-width="2" opacity=".45"/>

  <!-- central brass drive gear -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 600 600" to="-360 600 600" dur="6s" repeatCount="indefinite"/>
    <circle cx="600" cy="600" r="45" class="gear idler d3" stroke-width="7"/>
    <circle cx="600" cy="600" r="34" fill="url(#sunGrad)" stroke="#dcb257" stroke-width="3"/>
    <circle cx="600" cy="600" r="12" fill="#fff3b0" opacity=".85"/>
  </g>

  <!-- compound idler gears -->
  <g transform="translate(654.6 614.6)">
    <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.53s" repeatCount="indefinite"/>
      <circle r="63.5" class="gear idler d2" stroke-width="4"/>
      <circle r="11.5" class="gear idler d1" stroke-width="3"/>
      <circle r="4" class="core"/>
    </g>
  </g>

  <g transform="translate(637.3 664.6)">
    <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3.94s" repeatCount="indefinite"/>
      <circle r="85.4" class="gear idler d2" stroke-width="4"/>
      <circle r="29.6" class="gear idler d2" stroke-width="3"/>
      <circle r="5" class="core"/>
    </g>
  </g>

  <g transform="translate(575.7 690.6)">
    <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6.51s" repeatCount="indefinite"/>
      <circle r="111.2" class="gear idler d2" stroke-width="4"/>
      <circle r="48.8" class="gear idler d2" stroke-width="3"/>
      <circle r="6" class="core"/>
    </g>
  </g>

  <g transform="translate(488.5 664.4)">
    <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="11.17s" repeatCount="indefinite"/>
      <circle r="126.2" class="gear idler d2" stroke-width="4"/>
      <circle r="83.8" class="gear idler d2" stroke-width="3"/>
      <circle r="7" class="core"/>
    </g>
  </g>

  <g transform="translate(346.3 532.0)">
    <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="28.96s" repeatCount="indefinite"/>
      <circle r="67.3" class="gear idler d2" stroke-width="4"/>
      <circle r="217.7" class="gear idler d3" stroke-width="3"/>
      <circle r="8" class="core"/>
    </g>
  </g>

  <g transform="translate(421.4 290.6)">
    <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="41.64s" repeatCount="indefinite"/>
      <circle r="47.7" class="gear idler d2" stroke-width="4"/>
      <circle r="312.3" class="gear idler d3" stroke-width="3"/>
      <circle r="9" class="core"/>
    </g>
  </g>

  <g transform="translate(715.2 170.0)">
    <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="53.35s" repeatCount="indefinite"/>
      <circle r="24.9" class="gear idler d2" stroke-width="4"/>
      <circle r="400.1" class="gear idler d3" stroke-width="3"/>
      <circle r="9" class="core"/>
    </g>
  </g>

  <g transform="translate(1052.6 338.7)">
    <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="63.68s" repeatCount="indefinite"/>
      <circle r="17.4" class="gear idler d1" stroke-width="4"/>
      <circle r="477.6" class="gear idler d3" stroke-width="3"/>
      <circle r="10" class="core"/>
    </g>
  </g>

  <!-- Mercury -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 600 600" to="360 600 600" dur="2.89s" repeatCount="indefinite"/>
    <circle cx="600" cy="600" r="120" class="gear orbit d2" stroke-width="4"/>
    <line x1="600" y1="600" x2="720" y2="600" class="arm"/>
    <g transform="translate(720 600)">
      <circle r="6" fill="url(#gMercury)" stroke="#8a6d3b" stroke-width="1"/>
      <g transform="scale(6)"><use xlink:href="#marks"/></g>
      <path class="shadow" d="M0,-6 A6,6 0 0 1 0,6 Z">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Venus -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 600 600" to="360 600 600" dur="7.38s" repeatCount="indefinite"/>
    <circle cx="600" cy="600" r="160" class="gear orbit d2" stroke-width="4"/>
    <line x1="600" y1="600" x2="760" y2="600" class="arm"/>
    <g transform="translate(760 600)">
      <circle r="10" fill="url(#gVenus)" stroke="#8a6d3b" stroke-width="1"/>
      <g transform="scale(10)"><use xlink:href="#marks"/></g>
      <path class="shadow" d="M0,-10 A10,10 0 0 1 0,10 Z">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Earth -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 600 600" to="360 600 600" dur="12s" repeatCount="indefinite"/>
    <circle cx="600" cy="600" r="205" class="gear orbit d2" stroke-width="4"/>
    <line x1="600" y1="600" x2="805" y2="600" class="arm"/>
    <g transform="translate(805 600)">
      <circle r="11" fill="url(#gEarth)" stroke="#8a6d3b" stroke-width="1"/>
      <g transform="scale(11)"><use xlink:href="#marks"/></g>
      <path class="shadow" d="M0,-11 A11,11 0 0 1 0,11 Z">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Mars -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 600 600" to="360 600 600" dur="22.57s" repeatCount="indefinite"/>
    <circle cx="600" cy="600" r="255" class="gear orbit d2" stroke-width="4"/>
    <line x1="600" y1="600" x2="855" y2="600" class="arm"/>
    <g transform="translate(855 600)">
      <circle r="7" fill="url(#gMars)" stroke="#8a6d3b" stroke-width="1"/>
      <g transform="scale(7)"><use xlink:href="#marks"/></g>
      <path class="shadow" d="M0,-7 A7,7 0 0 1 0,7 Z">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Jupiter -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 600 600" to="360 600 600" dur="142.34s" repeatCount="indefinite"/>
    <circle cx="600" cy="600" r="330" class="gear orbit d2" stroke-width="4"/>
    <line x1="600" y1="600" x2="930" y2="600" class="arm"/>
    <g transform="translate(930 600)">
      <circle r="20" fill="url(#gJupiter)" stroke="#8a6d3b" stroke-width="1"/>
      <g transform="scale(20)"><use xlink:href="#marks"/></g>
      <path class="shadow" d="M0,-20 A20,20 0 0 1 0,20 Z">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Saturn -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 600 600" to="360 600 600" dur="353.36s" repeatCount="indefinite"/>
    <circle cx="600" cy="600" r="405" class="gear orbit d2" stroke-width="4"/>
    <line x1="600" y1="600" x2="1005" y2="600" class="arm"/>
    <g transform="translate(1005 600)">
      <ellipse rx="34" ry="11" fill="none" stroke="#d2a94c" stroke-width="3" opacity=".85"/>
      <circle r="18" fill="url(#gSaturn)" stroke="#8a6d3b" stroke-width="1"/>
      <g transform="scale(18)"><use xlink:href="#marks"/></g>
      <path class="shadow" d="M0,-18 A18,18 0 0 1 0,18 Z">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Uranus -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 600 600" to="360 600 600" dur="1008.2s" repeatCount="indefinite"/>
    <circle cx="600" cy="600" r="470" class="gear orbit d2" stroke-width="4"/>
    <line x1="600" y1="600" x2="1070" y2="600" class="arm"/>
    <g transform="translate(1070 600)">
      <circle r="15" fill="url(#gUranus)" stroke="#8a6d3b" stroke-width="1"/>
      <g transform="scale(15)"><use xlink:href="#marks"/></g>
      <path class="shadow" d="M0,-15 A15,15 0 0 1 0,15 Z">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Neptune -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 600 600" to="360 600 600" dur="1977.5s" repeatCount="indefinite"/>
    <circle cx="600" cy="600" r="540" class="gear orbit d2" stroke-width="4"/>
    <line x1="600" y1="600" x2="1140" y2="600" class="arm"/>
    <g transform="translate(1140 600)">
      <circle r="14" fill="url(#gNeptune)" stroke="#8a6d3b" stroke-width="1"/>
      <g transform="scale(14)"><use xlink:href="#marks"/></g>
      <path class="shadow" d="M0,-14 A14,14 0 0 1 0,14 Z">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>