<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 1000" style="background-color: #050300;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a2000" />
      <stop offset="100%" stop-color="#050300" />
    </radialGradient>

    <!-- Sun Glow Gradient & Filter -->
    <radialGradient id="sunGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="40%" stop-color="#ffca28" />
      <stop offset="100%" stop-color="#f57f17" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Day/Night Shadow Gradient (x1=0 left/sun-facing, x2=1 right/away) -->
    <linearGradient id="shadowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="35%" stop-color="#000" stop-opacity="0" />
      <stop offset="50%" stop-color="#000" stop-opacity="0.6" />
      <stop offset="65%" stop-color="#000" stop-opacity="1" />
      <stop offset="100%" stop-color="#000" stop-opacity="1" />
    </linearGradient>

    <!-- Planet Clip Paths -->
    <clipPath id="clipMercury"><circle cx="0" cy="0" r="4" /></clipPath>
    <clipPath id="clipVenus"><circle cx="0" cy="0" r="8" /></clipPath>
    <clipPath id="clipEarth"><circle cx="0" cy="0" r="10" /></clipPath>
    <clipPath id="clipMars"><circle cx="0" cy="0" r="6" /></clipPath>
    <clipPath id="clipJupiter"><circle cx="0" cy="0" r="20" /></clipPath>
    <clipPath id="clipSaturn"><circle cx="0" cy="0" r="16" /></clipPath>
    
    <!-- Saturn's Ring Front Clip Path -->
    <clipPath id="clipFrontRing">
      <rect x="-30" y="0" width="60" height="30" />
    </clipPath>

    <!-- Animations -->
    <style>
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spin-reverse {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      .orbit-anim {
        animation-name: spin;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      .gear-anim {
        animation-name: spin-reverse;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      .surface-anim {
        animation-name: spin;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      .surface-anim-retro {
        animation-name: spin-reverse;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bg)" />

  <!-- Main Orrery Center -->
  <g transform="translate(500, 500)">
    
    <!-- Static Base Arms (Supporting the drive gears) -->
    <g stroke="#3d2900" stroke-width="8" stroke-linecap="round">
      <line x1="0" y1="0" x2="72.575" y2="0" />         <!-- Mercury arm -->
      <line x1="0" y1="0" x2="55.386" y2="95.947" />    <!-- Venus arm -->
      <line x1="0" y1="0" x2="-78.330" y2="135.660" />  <!-- Earth arm -->
      <line x1="0" y1="0" x2="-218.997" y2="0" />       <!-- Mars arm -->
      <line x1="0" y1="0" x2="-149.011" y2="-258.062" /><!-- Jupiter arm -->
      <line x1="0" y1="0" x2="198.626" y2="-344.030" /> <!-- Saturn arm -->
    </g>

    <!-- Center Hub & Sun -->
    <circle cx="0" cy="0" r="24" fill="#2a1b00" stroke="#b8860b" stroke-width="3" />
    <circle cx="0" cy="0" r="20" fill="url(#sunGrad)" filter="url(#glow)" />
    <circle cx="0" cy="0" r="21" fill="none" stroke="#fffde7" stroke-width="1" opacity="0.6" stroke-dasharray="2 3" />

    <!-- ==================== ORBITS & PLANETS ==================== -->
    
    <!-- 1. MERCURY (Orbit: 1.2s | Gear: 0.32s | R: 57.296) -->
    <g class="orbit-anim" style="animation-duration: 1.2s;">
      <!-- Brass Track & Teeth -->
      <circle cx="0" cy="0" r="57.296" fill="none" stroke="#d4af37" stroke-width="6" stroke-dasharray="4 4" />
      <circle cx="0" cy="0" r="57.296" fill="none" stroke="#b8860b" stroke-width="2" />
      <line x1="-47" y1="0" x2="-57" y2="0" stroke="#b8860b" stroke-width="2" />
      <line x1="47" y1="0" x2="57" y2="0" stroke="#b8860b" stroke-width="2" />
      
      <!-- Planet at Angle 0 -->
      <g transform="rotate(0) translate(57.296, 0)">
        <circle cx="0" cy="0" r="4" fill="#8c7853" />
        <g clip-path="url(#clipMercury)">
          <g class="surface-anim" style="animation-duration: 6s;">
            <circle cx="2" cy="0" r="1.2" fill="#5a4b38"/>
            <circle cx="-2" cy="2" r="1" fill="#5a4b38"/>
            <circle cx="-1" cy="-2" r="0.8" fill="#5a4b38"/>
          </g>
        </g>
        <circle cx="0" cy="0" r="4" fill="url(#shadowGrad)" />
        <circle cx="0" cy="0" r="4" fill="none" stroke="#d4af37" stroke-width="0.5" />
      </g>
    </g>

    <!-- 2. VENUS (Orbit: 3.1s | Gear: 0.496s | R: 95.493) -->
    <g class="orbit-anim" style="animation-duration: 3.1s;">
      <circle cx="0" cy="0" r="95.493" fill="none" stroke="#d4af37" stroke-width="6" stroke-dasharray="4 4" />
      <circle cx="0" cy="0" r="95.493" fill="none" stroke="#b8860b" stroke-width="2" />
      <line x1="-85" y1="0" x2="-95" y2="0" stroke="#b8860b" stroke-width="2" />
      <line x1="85" y1="0" x2="95" y2="0" stroke="#b8860b" stroke-width="2" />
      
      <!-- Planet at Angle 60 -->
      <g transform="rotate(60) translate(95.493, 0)">
        <circle cx="0" cy="0" r="8" fill="#e6c229" />
        <g clip-path="url(#clipVenus)">
          <g class="surface-anim-retro" style="animation-duration: 4s;"> <!-- Retrograde spin -->
            <path d="M-8,-3 Q0,-5 8,-3 L8,-1 Q0,-3 -8,-1 Z" fill="#d4a017"/>
            <path d="M-8,2 Q0,0 8,2 L8,4 Q0,2 -8,4 Z" fill="#d4a017"/>
          </g>
        </g>
        <circle cx="0" cy="0" r="8" fill="url(#shadowGrad)" />
        <circle cx="0" cy="0" r="8" fill="none" stroke="#d4af37" stroke-width="0.5" />
      </g>
    </g>

    <!-- 3. EARTH (Orbit: 5.0s | Gear: 0.54s | R: 141.381) -->
    <g class="orbit-anim" style="animation-duration: 5.0s;">
      <circle cx="0" cy="0" r="141.381" fill="none" stroke="#d4af37" stroke-width="6" stroke-dasharray="4 4" />
      <circle cx="0" cy="0" r="141.381" fill="none" stroke="#b8860b" stroke-width="2" />
      <line x1="-131" y1="0" x2="-141" y2="0" stroke="#b8860b" stroke-width="2" />
      <line x1="131" y1="0" x2="141" y2="0" stroke="#b8860b" stroke-width="2" />
      
      <!-- Planet at Angle 120 -->
      <g transform="rotate(120) translate(141.381, 0)">
        <circle cx="0" cy="0" r="10" fill="#2b65ec" />
        <g clip-path="url(#clipEarth)">
          <g class="surface-anim" style="animation-duration: 2s;">
            <path d="M-6,-4 Q-4,-8 0,-6 T6,-2 T4,4 T-2,6 T-6,-4 Z" fill="#4caf50"/>
            <path d="M-2,6 Q2,4 4,8 T0,10 T-2,6 Z" fill="#4caf50"/>
          </g>
        </g>
        <circle cx="0" cy="0" r="10" fill="url(#shadowGrad)" />
        <circle cx="0" cy="0" r="10" fill="none" stroke="#d4af37" stroke-width="1" />
      </g>
    </g>

    <!-- 4. MARS (Orbit: 9.4s | Gear: 0.705s | R: 203.718) -->
    <g class="orbit-anim" style="animation-duration: 9.4s;">
      <circle cx="0" cy="0" r="203.718" fill="none" stroke="#d4af37" stroke-width="6" stroke-dasharray="4 4" />
      <circle cx="0" cy="0" r="203.718" fill="none" stroke="#b8860b" stroke-width="2" />
      <line x1="-193" y1="0" x2="-203" y2="0" stroke="#b8860b" stroke-width="2" />
      <line x1="193" y1="0" x2="203" y2="0" stroke="#b8860b" stroke-width="2" />
      
      <!-- Planet at Angle 180 -->
      <g transform="rotate(180) translate(203.718, 0)">
        <circle cx="0" cy="0" r="6" fill="#c1440e" />
        <g clip-path="url(#clipMars)">
          <g class="surface-anim" style="animation-duration: 2.1s;">
            <circle cx="0" cy="-5" r="1.5" fill="#fff"/>
            <circle cx="2" cy="2" r="2" fill="#8b300a"/>
            <circle cx="-3" cy="1" r="1.5" fill="#8b300a"/>
          </g>
        </g>
        <circle cx="0" cy="0" r="6" fill="url(#shadowGrad)" />
        <circle cx="0" cy="0" r="6" fill="none" stroke="#d4af37" stroke-width="0.5" />
      </g>
    </g>

    <!-- 5. JUPITER (Orbit: 59.3s | Gear: 3.2s | R: 282.743) -->
    <g class="orbit-anim" style="animation-duration: 59.3s;">
      <circle cx="0" cy="0" r="282.743" fill="none" stroke="#d4af37" stroke-width="6" stroke-dasharray="4 4" />
      <circle cx="0" cy="0" r="282.743" fill="none" stroke="#b8860b" stroke-width="2" />
      <line x1="-272" y1="0" x2="-282" y2="0" stroke="#b8860b" stroke-width="2" />
      <line x1="272" y1="0" x2="282" y2="0" stroke="#b8860b" stroke-width="2" />
      
      <!-- Planet at Angle 240 -->
      <g transform="rotate(240) translate(282.743, 0)">
        <circle cx="0" cy="0" r="20" fill="#d39c7e" />
        <g clip-path="url(#clipJupiter)">
          <g class="surface-anim" style="animation-duration: 0.8s;">
            <rect x="-20" y="-12" width="40" height="4" fill="#c67b53"/>
            <rect x="-20" y="2" width="40" height="6" fill="#b56545"/>
            <rect x="-20" y="-4" width="40" height="3" fill="#e8d3c3"/>
            <circle cx="8" cy="8" r="3" fill="#a04020"/>
          </g>
        </g>
        <circle cx="0" cy="0" r="20" fill="url(#shadowGrad)" />
        <circle cx="0" cy="0" r="20" fill="none" stroke="#d4af37" stroke-width="1.5" />
      </g>
    </g>

    <!-- 6. SATURN (Orbit: 147.2s | Gear: 5.88s | R: 381.972) -->
    <g class="orbit-anim" style="animation-duration: 147.2s;">
      <circle cx="0" cy="0" r="381.972" fill="none" stroke="#d4af37" stroke-width="6" stroke-dasharray="4 4" />
      <circle cx="0" cy="0" r="381.972" fill="none" stroke="#b8860b" stroke-width="2" />
      <line x1="-371" y1="0" x2="-381" y2="0" stroke="#b8860b" stroke-width="2" />
      <line x1="371" y1="0" x2="381" y2="0" stroke="#b8860b" stroke-width="2" />
      
      <!-- Planet at Angle 300 -->
      <g transform="rotate(300) translate(381.972, 0)">
        <!-- Back Ring -->
        <g transform="rotate(-15)">
          <ellipse cx="0" cy="0" rx="26" ry="8" fill="none" stroke="#c4b58a" stroke-width="4" />
        </g>
        
        <circle cx="0" cy="0" r="16" fill="#e3d9b2" />
        <g clip-path="url(#clipSaturn)">
          <g class="surface-anim" style="animation-duration: 0.9s;">
            <rect x="-16" y="-8" width="32" height="3" fill="#d4c496"/>
            <rect x="-16" y="4" width="32" height="4" fill="#d4c496"/>
            <rect x="-16" y="-2" width="32" height="2" fill="#e8dcc4"/>
          </g>
        </g>
        <circle cx="0" cy="0" r="16" fill="url(#shadowGrad)" />
        <circle cx="0" cy="0" r="16" fill="none" stroke="#d4af37" stroke-width="1" />
        
        <!-- Front Ring (clipped) -->
        <g transform="rotate(-15)">
          <g clip-path="url(#clipFrontRing)">
            <ellipse cx="0" cy="0" rx="26" ry="8" fill="none" stroke="#c4b58a" stroke-width="4" />
          </g>
        </g>
      </g>
    </g>


    <!-- ==================== DRIVE GEARS ==================== -->
    <!-- These spin in reverse at exact proportions to their orbital rings. 
         Offsets are perfectly calculated to mesh teeth. -->

    <!-- Mercury Drive Gear (Offset: 4) -->
    <g transform="translate(72.575, 0)">
      <g class="gear-anim" style="animation-duration: 0.32s;">
        <circle cx="0" cy="0" r="15.279" fill="none" stroke="#d4af37" stroke-width="6" stroke-dasharray="4 4" stroke-dashoffset="4" />
        <circle cx="0" cy="0" r="15.279" fill="none" stroke="#b8860b" stroke-width="2" />
        <line x1="-10" y1="0" x2="10" y2="0" stroke="#8b6508" stroke-width="2" />
        <line x1="0" y1="-10" x2="0" y2="10" stroke="#8b6508" stroke-width="2" />
        <circle cx="0" cy="0" r="3" fill="#e6c229" />
      </g>
      <circle cx="0" cy="0" r="1.5" fill="#4a3000" />
    </g>

    <!-- Venus Drive Gear (Offset: 0) -->
    <g transform="translate(55.386, 95.947)">
      <g class="gear-anim" style="animation-duration: 0.496s;">
        <circle cx="0" cy="0" r="15.279" fill="none" stroke="#d4af37" stroke-width="6" stroke-dasharray="4 4" stroke-dashoffset="0" />
        <circle cx="0" cy="0" r="15.279" fill="none" stroke="#b8860b" stroke-width="2" />
        <line x1="-10" y1="0" x2="10" y2="0" stroke="#8b6508" stroke-width="2" />
        <line x1="0" y1="-10" x2="0" y2="10" stroke="#8b6508" stroke-width="2" />
        <circle cx="0" cy="0" r="3" fill="#e6c229" />
      </g>
      <circle cx="0" cy="0" r="1.5" fill="#4a3000" />
    </g>

    <!-- Earth Drive Gear (Offset: 4) -->
    <g transform="translate(-78.330, 135.660)">
      <g class="gear-anim" style="animation-duration: 0.54s;">
        <circle cx="0" cy="0" r="15.279" fill="none" stroke="#d4af37" stroke-width="6" stroke-dasharray="4 4" stroke-dashoffset="4" />
        <circle cx="0" cy="0" r="15.279" fill="none" stroke="#b8860b" stroke-width="2" />
        <line x1="-10" y1="0" x2="10" y2="0" stroke="#8b6508" stroke-width="2" />
        <line x1="0" y1="-10" x2="0" y2="10" stroke="#8b6508" stroke-width="2" />
        <circle cx="0" cy="0" r="3" fill="#e6c229" />
      </g>
      <circle cx="0" cy="0" r="1.5" fill="#4a3000" />
    </g>

    <!-- Mars Drive Gear (Offset: 4) -->
    <g transform="translate(-218.997, 0)">
      <g class="gear-anim" style="animation-duration: 0.705s;">
        <circle cx="0" cy="0" r="15.279" fill="none" stroke="#d4af37" stroke-width="6" stroke-dasharray="4 4" stroke-dashoffset="4" />
        <circle cx="0" cy="0" r="15.279" fill="none" stroke="#b8860b" stroke-width="2" />
        <line x1="-10" y1="0" x2="10" y2="0" stroke="#8b6508" stroke-width="2" />
        <line x1="0" y1="-10" x2="0" y2="10" stroke="#8b6508" stroke-width="2" />
        <circle cx="0" cy="0" r="3" fill="#e6c229" />
      </g>
      <circle cx="0" cy="0" r="1.5" fill="#4a3000" />
    </g>

    <!-- Jupiter Drive Gear (Offset: 4) -->
    <g transform="translate(-149.011, -258.062)">
      <g class="gear-anim" style="animation-duration: 3.2s;">
        <circle cx="0" cy="0" r="15.279" fill="none" stroke="#d4af37" stroke-width="6" stroke-dasharray="4 4" stroke-dashoffset="4" />
        <circle cx="0" cy="0" r="15.279" fill="none" stroke="#b8860b" stroke-width="2" />
        <line x1="-10" y1="0" x2="10" y2="0" stroke="#8b6508" stroke-width="2" />
        <line x1="0" y1="-10" x2="0" y2="10" stroke="#8b6508" stroke-width="2" />
        <circle cx="0" cy="0" r="3" fill="#e6c229" />
      </g>
      <circle cx="0" cy="0" r="1.5" fill="#4a3000" />
    </g>

    <!-- Saturn Drive Gear (Offset: 4) -->
    <g transform="translate(198.626, -344.030)">
      <g class="gear-anim" style="animation-duration: 5.88s;">
        <circle cx="0" cy="0" r="15.279" fill="none" stroke="#d4af37" stroke-width="6" stroke-dasharray="4 4" stroke-dashoffset="4" />
        <circle cx="0" cy="0" r="15.279" fill="none" stroke="#b8860b" stroke-width="2" />
        <line x1="-10" y1="0" x2="10" y2="0" stroke="#8b6508" stroke-width="2" />
        <line x1="0" y1="-10" x2="0" y2="10" stroke="#8b6508" stroke-width="2" />
        <circle cx="0" cy="0" r="3" fill="#e6c229" />
      </g>
      <circle cx="0" cy="0" r="1.5" fill="#4a3000" />
    </g>

  </g>
</svg>