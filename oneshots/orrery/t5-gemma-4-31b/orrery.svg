<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" style="background: #0a0a0c;">
  <defs>
    <!-- Brass Gradient -->
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fdf5e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Sun Glow -->
    <radialGradient id="sunGlow">
      <stop offset="0%" style="stop-color:#fff700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:0" />
    </radialGradient>

    <!-- Gear Shape Symbol -->
    <symbol id="gear" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="12" fill="none" stroke="url(#brass)" stroke-width="3" />
      <circle cx="20" cy="20" r="3" fill="url(#brass)" />
      <g stroke="url(#brass)" stroke-width="3">
        <line x1="20" y1="4" x2="20" y2="8" />
        <line x1="20" y1="32" x2="20" y2="36" />
        <line x1="4" y1="20" x2="8" y2="20" />
        <line x1="32" y1="20" x2="36" y2="20" />
        <line x1="8" y1="8" x2="12" y2="12" />
        <line x1="28" y1="28" x2="32" y2="32" />
        <line x1="8" y1="32" x2="12" y2="28" />
        <line x1="28" y1="12" x2="32" y2="8" />
      </g>
    </symbol>
  </defs>

  <style>
    .orbit { fill: none; stroke: #332a1a; stroke-width: 1; stroke-dasharray: 2,4; }
    .arm { animation: rotate linear infinite; transform-origin: 400px 400px; }
    .gear-spin { animation: rotate linear infinite; transform-origin: center; }
    .planet-body { filter: drop-shadow(0 0 2px rgba(0,0,0,0.5)); }
    
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Relative Orbital Periods (Earth = 10s) */
    /* Mercury: 0.24y, Venus: 0.61y, Earth: 1y, Mars: 1.88y, Jupiter: 11.8y, Saturn: 29y, Uranus: 84y, Neptune: 164y */
    .mercury { animation-duration: 2.4s; }
    .venus   { animation-duration: 6.1s; }
    .earth   { animation-duration: 10s; }
    .mars    { animation-duration: 18.8s; }
    .jupiter { animation-duration: 118s; }
    .saturn  { animation-duration: 290s; }
    .uranus  { animation-duration: 840s; }
    .neptune { animation-duration: 1640s; }

    /* Gear rotations are tied to the arm rotations but often reversed or shifted */
    .g1 { animation-duration: 2.4s; }
    .g2 { animation-duration: 6.1s; }
    .g3 { animation-duration: 10s; }
    .g4 { animation-duration: 18.8s; }
    .g5 { animation-duration: 118s; }
    .g6 { animation-duration: 290s; }
    .g7 { animation-duration: 840s; }
    .g8 { animation-duration: 1640s; }
  </style>

  <!-- Background Clock Plate -->
  <circle cx="400" cy="400" r="390" fill="#15151a" stroke="url(#brass)" stroke-width="8" />
  <circle cx="400" cy="400" r="380" fill="none" stroke="url(#brass)" stroke-width="1" opacity="0.5" />

  <!-- The Sun -->
  <circle cx="400" cy="400" r="40" fill="url(#sunGlow)" />
  <circle cx="400" cy="400" r="15" fill="#fff700" />
  
  <!-- Central Drive Gear -->
  <use href="#gear" x="380" y="380" width="40" height="40" class="gear-spin g3" style="animation-direction: reverse;" />

  <!-- MERCURY -->
  <circle cx="400" cy="400" r="50" class="orbit" />
  <g class="arm mercury">
    <line x1="400" y1="400" x2="450" y2="400" stroke="url(#brass)" stroke-width="2" />
    <use href="#gear" x="420" y="380" width="20" height="20" class="gear-spin g1" />
    <g transform="translate(450,400)">
      <circle r="4" fill="#A5A5A5" class="planet-body" />
      <path d="M 0,-4 A 4,4 0 0,1 0,4 Z" fill="black" opacity="0.6" transform="translate(2,0)" /> <!-- Shadow -->
    </g>
  </g>

  <!-- VENUS -->
  <circle cx="400" cy="400" r="80" class="orbit" />
  <g class="arm venus">
    <line x1="400" y1="400" x2="480" y2="400" stroke="url(#brass)" stroke-width="2" />
    <use href="#gear" x="450" y="385" width="30" height="30" class="gear-spin g2" />
    <g transform="translate(480,400)">
      <circle r="6" fill="#E3BB76" class="planet-body" />
      <path d="M 0,-6 A 6,6 0 0,1 0,6 Z" fill="black" opacity="0.6" transform="translate(3,0)" />
    </g>
  </g>

  <!-- EARTH -->
  <circle cx="400" cy="400" r="120" class="orbit" />
  <g class="arm earth">
    <line x1="400" y1="400" x2="520" y2="400" stroke="url(#brass)" stroke-width="2" />
    <use href="#gear" x="480" y="380" width="40" height="40" class="gear-spin g3" />
    <g transform="translate(520,400)">
      <circle r="6" fill="#2271B3" class="planet-body" />
      <path d="M 0,-6 A 6,6 0 0,1 0,6 Z" fill="black" opacity="0.6" transform="translate(3,0)" />
    </g>
  </g>

  <!-- MARS -->
  <circle cx="400" cy="400" r="160" class="orbit" />
  <g class="arm mars">
    <line x1="400" y1="400" x2="560" y2="400" stroke="url(#brass)" stroke-width="2" />
    <use href="#gear" x="520" y="375" width="50" height="50" class="gear-spin g4" />
    <g transform="translate(560,400)">
      <circle r="5" fill="#E27B58" class="planet-body" />
      <path d="M 0,-5 A 5,5 0 0,1 0,5 Z" fill="black" opacity="0.6" transform="translate(2.5,0)" />
    </g>
  </g>

  <!-- JUPITER -->
  <circle cx="400" cy="400" r="220" class="orbit" />
  <g class="arm jupiter">
    <line x1="400" y1="400" x2="620" y2="400" stroke="url(#brass)" stroke-width="2" />
    <use href="#gear" x="580" y="370" width="80" height="80" class="gear-spin g5" />
    <g transform="translate(620,400)">
      <circle r="12" fill="#D39C7E" class="planet-body" />
      <path d="M 0,-12 A 12,12 0 0,1 0,12 Z" fill="black" opacity="0.6" transform="translate(6,0)" />
    </g>
  </g>

  <!-- SATURN -->
  <circle cx="400" cy="400" r="280" class="orbit" />
  <g class="arm saturn">
    <line x1="400" y1="400" x2="680" y2="400" stroke="url(#brass)" stroke-width="2" />
    <use href="#gear" x="640" y="360" width="80" height="80" class="gear-spin g6" />
    <g transform="translate(680,400)">
      <ellipse cx="0" cy="0" rx="18" ry="6" fill="none" stroke="#C5AB6E" stroke-width="2" />
      <circle r="10" fill="#E2C275" class="planet-body" />
      <path d="M 0,-10 A 10,10 0 0,1 0,10 Z" fill="black" opacity="0.6" transform="translate(5,0)" />
    </g>
  </g>

  <!-- URANUS -->
  <circle cx="400" cy="400" r="330" class="orbit" />
  <g class="arm uranus">
    <line x1="400" y1="400" x2="730" y2="400" stroke="url(#brass)" stroke-width="2" />
    <use href="#gear" x="700" y="360" width="60" height="60" class="gear-spin g7" />
    <g transform="translate(730,400)">
      <circle r="8" fill="#BBE1E4" class="planet-body" />
      <path d="M 0,-8 A 8,8 0 0,1 0,8 Z" fill="black" opacity="0.6" transform="translate(4,0)" />
    </g>
  </g>

  <!-- NEPTUNE -->
  <circle cx="400" cy="400" r="370" class="orbit" />
  <g class="arm neptune">
    <line x1="400" y1="400" x2="770" y2="400" stroke="url(#brass)" stroke-width="2" />
    <use href="#gear" x="740" y="360" width="60" height="60" class="gear-spin g8" />
    <g transform="translate(770,400)">
      <circle r="8" fill="#6081FF" class="planet-body" />
      <path d="M 0,-8 A 8,8 0 0,1 0,8 Z" fill="black" opacity="0.6" transform="translate(4,0)" />
    </g>
  </g>
</svg>