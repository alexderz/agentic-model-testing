<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
 <defs>
 <!-- Brass-like gradients -->
 <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FFD700"/>
 <stop offset="100%" stop-color="#FFA500"/>
 </linearGradient>
 <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#E88D3A"/>
 <stop offset="100%" stop-color="#C44E1A"/>
 </linearGradient>
 <clipPath id="planetClip">
 <circle cx="400" cy="400" r="60"/>
 </clipPath>
 
 <!-- Gear teeth path (simple cog) -->
 <path id="gearTooth" d="M0,-5 L2,-2 L-2,-2 Z" fill="#333"/>
 </defs>

 <!-- Background -->
 <rect width="800" height="800" fill="#0B1A2A"/>

 <!-- Sun -->
 <circle cx="400" cy="400" r="40" fill="url(#sunGrad)">
 <animate attributeName="r" values="40;45;40" dur="4s" repeatCount="indefinite"/>
 </circle>
 <text x="400" y="405" text-anchor="middle" fill="#fff" font-family="serif" font-size="12">Sun</text>

 <!-- Gears (meshing) -->
 <!-- Central crank gear -->
 <g id="gear1">
 <circle cx="300" cy="400" r="25" fill="none" stroke="#B8860B" stroke-width="4"/>
 <!-- Teeth -->
 <use href="#gearTooth" x="290" y="390" transform="rotate(0)"/>
 <use href="#gearTooth" x="310" y="390" transform="rotate(90)"/>
 <use href="#gearTooth" x="330" y="400" transform="rotate(180)"/>
 <use href="#gearTooth" x="310" y="410" transform="rotate(270)"/>
 <!-- Animate -->
 <animateTransform attributeName="transform" type="rotate" from="0 300 400" to="360 300 400" dur="2s" repeatCount="indefinite"/>
 </g>

 <!-- Meshing gear 2 (larger) -->
 <g id="gear2">
 <circle cx="380" cy="400" r="40" fill="none" stroke="#8B4513" stroke-width="4"/>
 <animateTransform attributeName="transform" type="rotate" from="0 380 400" to="360 380 400" dur="3s" repeatCount="indefinite"/>
 </g>

 <!-- Meshing gear 3 (largest) -->
 <g id="gear3">
 <circle cx="460" cy="400" r="55" fill="none" stroke="#A0522D" stroke-width="4"/>
 <animateTransform attributeName="transform" type="rotate" from="0 460 400" to="360 460 400" dur="5s" repeatCount="indefinite"/>
 </g>

 <!-- Orbit rings (driven by gear3) -->
 <!-- Mercury orbit -->
 <circle cx="400" cy="400" r="120" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4 2"/>
 <!-- Venus orbit -->
 <circle cx="400" cy="400" r="160" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4 2"/>
 <!-- Earth orbit -->
 <circle cx="400" cy="400" r="200" fill="none" stroke="#777" stroke-width="1" stroke-dasharray="4 2"/>

 <!-- Planets with day/night shadow and spin -->
 <!-- Mercury -->
 <g id="mercury">
 <circle cx="400" cy="280" r="15" fill="url(#planetGrad)">
 <animate attributeName="r" values="280;290;280" dur="2s" repeatCount="indefinite"/>
 </circle>
 <!-- Shadow (day/night) -->
 <path id="shadowMerc" d="M-7.5,280 A15,15 0 0,1 7.5,280 L7.5,290 A15,15 0 0,1 -7.5,290 Z" fill="#000"/>
 <!-- Spin animation (planet rotates on its axis) -->
 <animateTransform attributeName="transform" type="rotate" from="0 400 280" to="360 400 280" dur="3s" repeatCount="indefinite"/>
 </g>

 <!-- Venus -->
 <g id="venus">
 <circle cx="560" cy="400" r="18" fill="url(#planetGrad)">
 <animate attributeName="r" values="400;410;400" dur="4s" repeatCount="indefinite"/>
 </circle>
 <path id="shadowVen" d="M552.5,400 A18,18 0 0,1 567.5,400 L567.5,418 A18,18 0 0,1 552.5,418 Z" fill="#000"/>
 <animateTransform attributeName="transform" type="rotate" from="0 560 400" to="360 560 400" dur="4s" repeatCount="indefinite"/>
 </g>

 <!-- Earth -->
 <g id="earth">
 <circle cx="600" cy="520" r="20" fill="url(#planetGrad)">
 <animate attributeName="r" values="520;530;520" dur="6s" repeatCount="indefinite"/>
 </circle>
 <path id="shadowEar" d="M592.5,520 A20,20 0 0,1 607.5,520 L607.5,540 A20,20 0 0,1 592.5,540 Z" fill="#000"/>
 <animateTransform attributeName="transform" type="rotate" from="0 600 520" to="360 600 520" dur="6s" repeatCount="indefinite"/>
 </g>

 <!-- Orbit arms (visual link to gears) -->
 <line x1="300" y1="400" x2="400" y2="280" stroke="#B8860B" stroke-width="2"/>
 <line x1="380" y1="400" x2="560" y2="400" stroke="#8B4513" stroke-width="2"/>
 <line x1="460" cy="400" x2="600" cy="520" stroke="#A0522D" stroke-width="2"/>

 <!-- Labels -->
 <text x="400" y="360" text-anchor="middle" fill="#FFF" font-family="sans-serif" font-size="10">Orbit</text>
 <text x="300" y="440" text-anchor="middle" fill="#FFF" font-family="sans-serif" font-size="9">Mercury</text>
 <text x="560" y="400" text-anchor="middle" fill="#FFF" font-family="sans-serif" font-size="9">Venus</text>
 <text x="600" y="540" text-anchor="middle" fill="#FFF" font-family="sans-serif" font-size="9">Earth</text>
</svg>