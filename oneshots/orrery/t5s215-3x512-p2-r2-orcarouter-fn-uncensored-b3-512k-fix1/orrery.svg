<svg viewBox="0 0 960 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Brass clockwork orrery">
<title>Brass Clockwork Orrery</title>
<defs>
  <radialGradient id="bg" cx="50%" cy="46%" r="78%">
    <stop offset="0%" stop-color="#2a2013"/><stop offset="45%" stop-color="#191207"/>
    <stop offset="100%" stop-color="#080502"/>
  </radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- brass gears (12 teeth, R=34) -->
  <symbol id="gear" viewBox="-50 -50 100 100">
    <g fill="#c9a24f" stroke="#6e5322" stroke-width="0.7">
      <rect x="-4" y="-48" width="8" height="16" rx="2"/>
      <rect x="-4" y="-48" width="8" height="16" rx="2" transform="rotate(30)"/>
      <rect x="-4" y="-48" width="8" height="16" rx="2" transform="rotate(60)"/>
      <rect x="-4" y="-48" width="8" height="16" rx="2" transform="rotate(90)"/>
      <rect x="-4" y="-48" width="8" height="16" rx="2" transform="rotate(120)"/>
      <rect x="-4" y="-48" width="8" height="16" rx="2" transform="rotate(150)"/>
      <rect x="-4" y="-48" width="8" height="16" rx="2" transform="rotate(180)"/>
      <rect x="-4" y="-48" width="8" height="16" rx="2" transform="rotate(210)"/>
      <rect x="-4" y="-48" width="8" height="16" rx="2" transform="rotate(240)"/>
      <rect x="-4" y="-48" width="8" height="16" rx="2" transform="rotate(270)"/>
      <rect x="-4" y="-48" width="8" height="16" rx="2" transform="rotate(300)"/>
      <rect x="-4" y="-48" width="8" height="16" rx="2" transform="rotate(330)"/>
    </g>
    <circle r="34" fill="#b98f3c" stroke="#6e5322" stroke-width="1.2"/>
    <circle r="27" fill="#d9b25a" stroke="#6e5322" stroke-width="0.8"/>
    <g stroke="#7a5a24" stroke-width="2">
      <line x1="-27" y1="0" x2="27" y2="0"/><line x1="0" y1="-27" x2="0" y2="27"/>
      <line x1="-19.1" y1="-19.1" x2="19.1" y2="19.1"/><line x1="-19.1" y1="19.1" x2="19.1" y2="-19.1"/>
    </g>
    <circle r="10" fill="#8a6a2c" stroke="#5c4318" stroke-width="1.2"/><circle r="4" fill="#3f2f12"/>
  </symbol>

  <!-- brass arm (points outward from origin) -->
  <g id="arm"><rect x="-3" y="-10" width="6" height="12" rx="3" fill="#b8923e"/><circle r="4.5" fill="#7a5a24"/></g>

  <!-- planets (terminator fixed; sun lights near side) -->
  <symbol id="p-mercury" viewBox="-20 -20 40 40"><circle r="16" fill="#9a8f83"/><path d="M0,-16A16,16 0 0,0 0,16Z" fill="#241d15"/></symbol>
  <symbol id="p-venus"   viewBox="-20 -20 40 40"><circle r="16" fill="#d9a86b"/><path d="M0,-16A16,16 0 0,0 0,16Z" fill="#332617"/></symbol>
  <symbol id="p-earth"   viewBox="-20 -20 40 40"><circle r="16" fill="#2f6ea3"/><path d="M-9,-5q5,-5 10,0t10,0v7q-5,4 -10,0t-10,0Z" fill="#3f8a4e"/><circle cx="7" cy="-7" r="3.2" fill="#3f8a4e"/><path d="M0,-16A16,16 0 0,0 0,16Z" fill="#1b2536"/></symbol>
  <symbol id="p-mars"    viewBox="-20 -20 40 40"><circle r="16" fill="#b5533a"/><path d="M-7,-9q6,-4 12,1t8,3v5q-6,3 -12,-1Z" fill="#8f3d2a"/><path d="M0,-16A16,16 0 0,0 0,16Z" fill="#2a1712"/></symbol>
  <symbol id="p-jupiter" viewBox="-20 -20 40 40"><circle r="16" fill="#c9a878"/><path d="M-15,-7Q0,-10 15,-7" stroke="#a07f52" stroke-width="3.2" fill="none"/><path d="M-16,0Q0,-3 16,0" stroke="#e4cba0" stroke-width="3.2" fill="none"/><path d="M-15,7Q0,4 15,7" stroke="#9c7a4d" stroke-width="3.2" fill="none"/><circle cx="8" cy="6" r="3" fill="#b5623f"/><path d="M0,-16A16,16 0 0,0 0,16Z" fill="#2c2114"/></symbol>
  <symbol id="p-saturn"  viewBox="-24 -24 48 48"><circle r="16" fill="#d9bd85"/><path d="M-15,-3Q0,-6 15,-3" stroke="#c2a266" stroke-width="3" fill="none"/><g transform="rotate(-16)"><ellipse rx="24" ry="7.5" fill="none" stroke="#c9a86b" stroke-width="3.2"/><ellipse rx="24" ry="7.5" fill="none" stroke="#8f7038" stroke-width="1"/></g><path d="M0,-16A16,16 0 0,0 0,16Z" fill="#2b2214"/></symbol>
  <symbol id="p-uranus"  viewBox="-20 -20 40 40"><circle r="16" fill="#a7d3d8"/><path d="M0,-16A16,16 0 0,0 0,16Z" fill="#20303a"/></symbol>
  <symbol id="p-neptune" viewBox="-20 -20 40 40"><circle r="16" fill="#5f86c9"/><path d="M-14,-2Q0,-5 14,-2" stroke="#4a6bb0" stroke-width="3" fill="none"/><path d="M0,-16A16,16 0 0,0 0,16Z" fill="#1b2740"/></symbol>
</defs>

<rect width="960" height="960" fill="url(#bg)"/>

<!-- ORBITS -->
<g fill="none" stroke="#8a6f3c" stroke-width="1.5">
  <circle cx="480" cy="480" r="72"/><circle cx="480" cy="480" r="96"/><circle cx="480" cy="480" r="120"/>
  <circle cx="480" cy="480" r="144"/><circle cx="480" cy="480" r="176"/><circle cx="480" cy="480" r="210"/>
  <circle cx="480" cy="480" r="252"/><circle cx="480" cy="480" r="300"/>
</g>

<!-- SUN -->
<g transform="translate(480,480)">
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="6s" repeatCount="indefinite"/>
    <circle r="34" fill="#ffd27a"/><circle r="26" fill="#ffe9b8"/><circle r="17" fill="#fff6d8"/>
  </g>
</g>

<!-- GEARS -->
<use href="#gear" x="480" y="408" width="100" height="100"><animateTransform attributeName="transform" type="rotate" from="0 480 408" to="-360 480 408" dur="5s" repeatCount="indefinite"/></use>
<use href="#gear" x="480" y="384" width="100" height="100"><animateTransform attributeName="transform" type="rotate" from="0 480 384" to="360 480 384" dur="5s" repeatCount="indefinite"/></use>
<use href="#gear" x="480" y="360" width="100" height="100"><animateTransform attributeName="transform" type="rotate" from="0 480 360" to="-360 480 360" dur="5s" repeatCount="indefinite"/></use>
<use href="#gear" x="480" y="336" width="100" height="100"><animateTransform attributeName="transform" type="rotate" from="0 480 336" to="360 480 336" dur="5s" repeatCount="indefinite"/></use>
<use href="#gear" x="480" y="304" width="100" height="100"><animateTransform attributeName="transform" type="rotate" from="0 480 304" to="-360 480 304" dur="5s" repeatCount="indefinite"/></use>
<use href="#gear" x="480" y="270" width="100" height="100"><animateTransform attributeName="transform" type="rotate" from="0 480 270" to="360 480 270" dur="5s" repeatCount="indefinite"/></use>
<use href="#gear" x="480" y="228" width="100" height="100"><animateTransform attributeName="transform" type="rotate" from="0 480 228" to="-360 480 228" dur="5s" repeatCount="indefinite"/></use>
<use href="#gear" x="480" y="180" width="100" height="100"><animateTransform attributeName="transform" type="rotate" from="0 480 180" to="360 480 180" dur="5s" repeatCount="indefinite"/></use>

<!-- ARMS -->
<g transform="translate(480,480)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite"/><use href="#arm" y="-72"/></g></g>
<g transform="translate(480,480)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/><use href="#arm" y="-96"/></g></g>
<g transform="translate(480,480)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/><use href="#arm" y="-120"/></g></g>
<g transform="translate(480,480)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/><use href="#arm" y="-144"/></g></g>
<g transform="translate(480,480)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/><use href="#arm" y="-176"/></g></g>
<g transform="translate(480,480)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/><use href="#arm" y="-210"/></g></g>
<g transform="translate(480,480)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/><use href="#arm" y="-252"/></g></g>
<g transform="translate(480,480)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/><use href="#arm" y="-300"/></g></g>

<!-- PLANETS (terminator stays fixed = sun-lit near side) -->
<g transform="translate(480,480)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite"/><use href="#p-mercury" x="-95" y="-95" width="40" height="40"/></g></g>
<g transform="translate(480,480)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/><use href="#p-venus" x="-95" y="-119" width="40" height="40"/></g></g>
<g transform="translate(480,480)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/><use href="#p-earth" x="-95" y="-143" width="40" height="40"/></g></g>
<g transform="translate(480,480)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/><use href="#p-mars" x="-95" y="-167" width="40" height="40"/></g></g>
<g transform="translate(480,480)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/><use href="#p-jupiter" x="-97" y="-199" width="40" height="40"/></g></g>
<g transform="translate(480,480)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/><use href="#p-saturn" x="-127" y="-239" width="48" height="48"/></g></g>
<g transform="translate(480,480)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/><use href="#p-uranus" x="-172" y="-279" width="40" height="40"/></g></g>
<g transform="translate(480,480)"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/><use href="#p-neptune" x="-220" y="-327" width="40" height="40"/></g></g>
</svg>