<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" font-family="Georgia, serif">
  <defs>
    <!-- ===== MATERIALS ===== -->
    <radialGradient id="space" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1b2440"/>
      <stop offset="55%" stop-color="#0a0e1c"/>
      <stop offset="100%" stop-color="#02030a"/>
    </radialGradient>

    <radialGradient id="sunG" cx="38%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fffbe0"/>
      <stop offset="30%" stop-color="#ffe17a"/>
      <stop offset="65%" stop-color="#ff9b1f"/>
      <stop offset="100%" stop-color="#d94e00"/>
    </radialGradient>

    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#f8e2a0"/>
      <stop offset="28%" stop-color="#d9ac46"/>
      <stop offset="55%" stop-color="#a9781f"/>
      <stop offset="80%" stop-color="#7a5212"/>
      <stop offset="100%" stop-color="#5a3d0c"/>
    </linearGradient>
    <linearGradient id="brassEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2c4"/>
      <stop offset="50%" stop-color="#c6952f"/>
      <stop offset="100%" stop-color="#6e4a10"/>
    </linearGradient>

    <!-- planet spheres: light comes from the SUN (centre), so highlight is offset toward origin -->
    <radialGradient id="pMer" cx="35%" cy="35%" r="75%"><stop offset="0%" stop-color="#cfc4b4"/><stop offset="55%" stop-color="#8a7f72"/><stop offset="100%" stop-color="#3a332c"/></radialGradient>
    <radialGradient id="pVen" cx="35%" cy="35%" r="75%"><stop offset="0%" stop-color="#f6e6b0"/><stop offset="55%" stop-color="#c79a52"/><stop offset="100%" stop-color="#6f4a1e"/></radialGradient>
    <radialGradient id="pEar" cx="35%" cy="35%" r="75%"><stop offset="0%" stop-color="#a8d8ff"/><stop offset="45%" stop-color="#3f7fc4"/><stop offset="80%" stop-color="#173a5e"/><stop offset="100%" stop-color="#0a1a2e"/></radialGradient>
    <radialGradient id="pMar" cx="35%" cy="35%" r="75%"><stop offset="0%" stop-color="#f0a070"/><stop offset="50%" stop-color="#b5481f"/><stop offset="100%" stop-color="#4a1708"/></radialGradient>
    <radialGradient id="pJup" cx="35%" cy="35%" r="75%"><stop offset="0%" stop-color="#f3e2c0"/><stop offset="45%" stop-color="#c79a5f"/><stop offset="80%" stop-color="#7a5528"/><stop offset="100%" stop-color="#3b2810"/></radialGradient>
    <radialGradient id="pSat" cx="35%" cy="35%" r="75%"><stop offset="0%" stop-color="#f7ecc4"/><stop offset="50%" stop-color="#cba95f"/><stop offset="100%" stop-color="#6b5120"/></radialGradient>
    <linearGradient id="ringG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0b8"/><stop offset="50%" stop-color="#c69a40"/><stop offset="100%" stop-color="#7a5818"/>
    </linearGradient>

    <!-- day/night terminator overlay: transparent (day) -> black (night) -->
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000" stop-opacity="0"/>
      <stop offset="42%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="58%"  stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.92"/>
    </linearGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- ===== REUSABLE GEARS (teeth via dasharray) ===== -->
    <!-- drive rings: concentric, each turns one orbit -->
    <g id="ringMer"><circle r="21" fill="url(#brass)"/><circle r="24" fill="none" stroke="url(#brassEdge)" stroke-width="6" stroke-dasharray="7.53 7.53"/><circle r="13" fill="none" stroke="#5a3d0c" stroke-width="1.5"/><circle r="5" fill="#2a1c08"/></g>
    <g id="ringVen"><circle r="29" fill="url(#brass)"/><circle r="32" fill="none" stroke="url(#brassEdge)" stroke-width="6" stroke-dasharray="7.06 7.06"/><circle r="19" fill="none" stroke="#5a3d0c" stroke-width="1.5"/><circle r="6" fill="#2a1c08"/></g>
    <g id="ringEar"><circle r="39" fill="url(#brass)"/><circle r="42" fill="none" stroke="url(#brassEdge)" stroke-width="6" stroke-dasharray="7.33 7.33"/><circle r="27" fill="none" stroke="#5a3d0c" stroke-width="1.5"/><circle r="8" fill="#2a1c08"/></g>
    <g id="ringMar"><circle r="51" fill="url(#brass)"/><circle r="54.5" fill="none" stroke="url(#brassEdge)" stroke-width="7" stroke-dasharray="7.13 7.13"/><circle r="37" fill="none" stroke="#5a3d0c" stroke-width="1.5"/><circle r="11" fill="#2a1c08"/></g>
    <g id="ringJup"><circle r="65" fill="url(#brass)"/><circle r="69" fill="none" stroke="url(#brassEdge)" stroke-width="8" stroke-dasharray="7.56 7.56"/><circle r="48" fill="none" stroke="#5a3d0c" stroke-width="1.5"/><circle r="14" fill="#2a1c08"/></g>
    <g id="ringSat"><circle r="82" fill="url(#brass)"/><circle r="86" fill="none" stroke="url(#brassEdge)" stroke-width="8" stroke-dasharray="7.18 7.18"/><circle r="62" fill="none" stroke="#5a3d0c" stroke-width="1.5"/><circle r="18" fill="#2a1c08"/></g>
    <!-- pinions that mesh with each ring -->
    <g id="pin"><circle r="8" fill="url(#brass)"/><circle r="11" fill="none" stroke="url(#brassEdge)" stroke-width="6" stroke-dasharray="6.91 6.91"/><circle r="2.6" fill="#2a1c08"/></g>
    <!-- central sun-gear + small meshing pinion -->
    <g id="sunGear"><circle r="14" fill="url(#brass)"/><circle r="17" fill="none" stroke="url(#brassEdge)" stroke-width="6" stroke-dasharray="7.48 7.48"/><circle r="6" fill="#2a1c08"/></g>
    <g id="pinA"><circle r="9" fill="url(#brass)"/><circle r="12" fill="none" stroke="url(#brassEdge)" stroke-width="6" stroke-dasharray="7.54 7.54"/><circle r="3" fill="#2a1c08"/></g>

    <!-- planets -->
    <g id="mercury"><circle r="4.5" fill="url(#pMer)"/><circle r="4.5" fill="url(#night)" transform="rotate(0)"/></g>
    <g id="venus"><circle r="7.5" fill="url(#pVen)"/><circle r="7.5" fill="url(#night)" transform="rotate(0)"/></g>
    <g id="earth"><circle r="8" fill="url(#pEar)"/><circle r="8" fill="url(#night)" transform="rotate(0)"/></g>
    <g id="mars"><circle r="6" fill="url(#pMar)"/><circle r="6" fill="url(#night)" transform="rotate(0)"/></g>
    <g id="jupiter">
      <circle r="22" fill="url(#pJup)"/>
      <g opacity="0.45" clip-path="url(#jupClip)"><path d="M-22 -13 q22 -6 44 0 M-22 2 q22 7 44 0 M-22 14 q22 -5 44 0" stroke="#7a4a18" stroke-width="4" fill="none"/></g>
      <ellipse cx="8" cy="7" rx="5" ry="3.4" fill="#b5561f" opacity="0.7"/>
      <circle r="22" fill="url(#night)" transform="rotate(0)"/>
    </g>
    <g id="saturn">
      <circle r="15" fill="url(#pSat)"/>
      <circle r="15" fill="url(#night)" transform="rotate(0)"/>
      <g>
        <ellipse rx="27" ry="7" fill="none" stroke="url(#ringG)" stroke-width="4.5" opacity="0.95"/>
        <ellipse rx="22" ry="5.5" fill="none" stroke="#8a6a28" stroke-width="1.4" opacity="0.7"/>
      </g>
    </g>
    <clipPath id="jupClip"><circle r="22"/></clipPath>
  </defs>

  <!-- ================= SCENE ================= -->
  <rect width="800" height="800" fill="url(#space)"/>
  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="70" cy="90" r="1.1" opacity=".8"/><circle cx="730" cy="70" r="1.3" opacity=".7"/>
    <circle cx="120" cy="720" r="1" opacity=".6"/><circle cx="690" cy="690" r="1.2" opacity=".8"/>
    <circle cx="400" cy="40" r="1" opacity=".5"/><circle cx="60" cy="430" r="1.1" opacity=".7"/>
    <circle cx="760" cy="380" r="1" opacity=".6"/><circle cx="250" cy="760" r="1.2" opacity=".7"/>
    <circle cx="560" cy="770" r="1" opacity=".5"/><circle cx="30" cy="250" r="1" opacity=".6"/>
    <circle cx="770" cy="180" r="1.1" opacity=".7"/><circle cx="480" cy="760" r="1" opacity=".5"/>
  </g>

  <g transform="translate(400 400)">

    <!-- orbit tracks -->
    <g fill="none" stroke-linecap="round">
      <circle r="92"  stroke="url(#brassEdge)" stroke-width="1.4" opacity=".55"/>
      <circle r="130" stroke="url(#brassEdge)" stroke-width="1.4" opacity=".55"/>
      <circle r="178" stroke="url(#brassEdge)" stroke-width="1.4" opacity=".55"/>
      <circle r="230" stroke="url(#brassEdge)" stroke-width="1.4" opacity=".55"/>
      <circle r="295" stroke="url(#brassEdge)" stroke-width="1.4" opacity=".55"/>
      <circle r="350" stroke="url(#brassEdge)" stroke-width="1.6" opacity=".6"/>
    </g>

    <!-- ===== DRIVE TRAIN: concentric rings + meshing pinions, each arm carries its planet ===== -->

    <!-- MERCURY  (year = 2.89 s) -->
    <g transform="rotate(-20)">
      <g><use href="#ringMer"/><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2.89s" repeatCount="indefinite"/></g>
      <g transform="rotate(0)"><use href="#pin" transform="translate(35 0)"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.324s" repeatCount="indefinite"/></g>
      <g><line x1="0" y1="0" x2="92" y2="0" stroke="url(#brass)" stroke-width="3.2" opacity=".9"/><circle cx="92" cy="0" r="3.4" fill="url(#brass)"/>
        <g><use href="#mercury"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></g></g>
    </g>

    <!-- VENUS  (year = 7.38 s) -->
    <g transform="rotate(110)">
      <g><use href="#ringVen"/><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="7.38s" repeatCount="indefinite"/></g>
      <g transform="rotate(72)"><use href="#pin" transform="translate(43 0)"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.537s" repeatCount="indefinite"/></g>
      <g><line x1="0" y1="0" x2="130" y2="0" stroke="url(#brass)" stroke-width="3.2" opacity=".9"/><circle cx="130" cy="0" r="3.6" fill="url(#brass)"/>
        <g><use href="#venus"/><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/></g></g>
    </g>

    <!-- EARTH  (year = 12 s) -->
    <g transform="rotate(200)">
      <g><use href="#ringEar"/><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="12s" repeatCount="indefinite"/></g>
      <g transform="rotate(144)"><use href="#pin" transform="translate(53 0)"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.143s" repeatCount="indefinite"/></g>
      <g><line x1="0" y1="0" x2="178" y2="0" stroke="url(#brass)" stroke-width="3.4" opacity=".9"/><circle cx="178" cy="0" r="3.8" fill="url(#brass)"/>
        <g><use href="#earth"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/></g></g>
    </g>

    <!-- MARS  (year = 22.57 s) -->
    <g transform="rotate(300)">
      <g><use href="#ringMar"/><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="22.57s" repeatCount="indefinite"/></g>
      <g transform="rotate(216)"><use href="#pin" transform="translate(65.5 0)"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.514s" repeatCount="indefinite"/></g>
      <g><line x1="0" y1="0" x2="230" y2="0" stroke="url(#brass)" stroke-width="3.2" opacity=".9"/><circle cx="230" cy="0" r="3.6" fill="url(#brass)"/>
        <g><use href="#mars"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6.2s" repeatCount="indefinite"/></g></g>
    </g>

    <!-- JUPITER  (year = 142.3 s) -->
    <g transform="rotate(130)">
      <g><use href="#ringJup"/><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="142.3s" repeatCount="indefinite"/></g>
      <g transform="rotate(288)"><use href="#pin" transform="translate(80 0)"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22.72s" repeatCount="indefinite"/></g>
      <g><line x1="0" y1="0" x2="295" y2="0" stroke="url(#brass)" stroke-width="3.6" opacity=".9"/><circle cx="295" cy="0" r="4.2" fill="url(#brass)"/>
        <g><use href="#jupiter"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.6s" repeatCount="indefinite"/></g></g>
    </g>

    <!-- SATURN  (year = 353.5 s) -->
    <g transform="rotate(250)">
      <g><use href="#ringSat"/><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="353.5s" repeatCount="indefinite"/></g>
      <g transform="rotate(348)"><use href="#pin" transform="translate(97 0)"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="44.72s" repeatCount="indefinite"/></g>
      <g><line x1="0" y1="0" x2="350" y2="0" stroke="url(#brass)" stroke-width="3.6" opacity=".9"/><circle cx="350" cy="0" r="4.2" fill="url(#brass)"/>
        <g><use href="#saturn"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.9s" repeatCount="indefinite"/></g></g>
    </g>

    <!-- ===== CENTRAL CLOCKWORK: sun-gear meshed with a pinion ===== -->
    <g><use href="#sunGear"/><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="8s" repeatCount="indefinite"/></g>
    <g transform="rotate(-40)"><g transform="translate(29 0)"><use href="#pinA"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.33s" repeatCount="indefinite"/></g></g>

    <!-- ===== SUN ===== -->
    <circle r="42" fill="#ff9b1f" opacity=".18" filter="url(#soft)"/>
    <circle r="32" fill="#ffb833" opacity=".22" filter="url(#soft)"/>
    <circle r="24" fill="url(#sunG)" filter="url(#glow)"/>
    <circle r="24" fill="none" stroke="#fff4c0" stroke-width="1" opacity=".8"/>

  </g>

  <!-- ===== LABELS ===== -->
  <g fill="#d9c07a" font-size="12" opacity=".8" text-anchor="middle">
    <text x="400" y="30">BRASS ORRERY · gear ratios after real planetary periods</text>
    <text x="400" y="788" font-size="10" fill="#9a8a5a">1 Earth revolution = 12 s · inner gears drive each arm · terminator = day / night</text>
  </g>
</svg>