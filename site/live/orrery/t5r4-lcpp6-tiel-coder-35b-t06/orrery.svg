<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2c4"/><stop offset="0.45" stop-color="#e2b85a"/>
      <stop offset="0.75" stop-color="#a9742a"/><stop offset="1" stop-color="#6b4412"/>
    </linearGradient>
    <linearGradient id="brassH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff2c4"/><stop offset="0.5" stop-color="#d39e45"/>
      <stop offset="1" stop-color="#73481a"/>
    </linearGradient>
    <radialGradient id="plateBg" cx="50%" cy="38%" r="80%">
      <stop offset="0" stop-color="#241d11"/><stop offset="1" stop-color="#0c0a06"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbe0"/><stop offset="0.35" stop-color="#ffd45a"/>
      <stop offset="0.75" stop-color="#ff9a2e"/><stop offset="1" stop-color="#c4520e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCore" cx="42%" cy="42%" r="65%">
      <stop offset="0" stop-color="#fffdf0"/><stop offset="0.5" stop-color="#ffd24a"/>
      <stop offset="1" stop-color="#ff8e1e"/>
    </radialGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.28" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </linearGradient>
    <radialGradient id="mercury" cx="30%" cy="50%" r="75%">
      <stop offset="0" stop-color="#e8e8e8"/><stop offset="0.55" stop-color="#7d7d7d"/><stop offset="1" stop-color="#141414"/></radialGradient>
    <radialGradient id="venus" cx="30%" cy="50%" r="75%">
      <stop offset="0" stop-color="#fdf3cf"/><stop offset="0.55" stop-color="#d4a45a"/><stop offset="1" stop-color="#2e1c04"/></radialGradient>
    <radialGradient id="earth" cx="30%" cy="50%" r="75%">
      <stop offset="0" stop-color="#cfeaff"/><stop offset="0.55" stop-color="#2f6fd6"/><stop offset="1" stop-color="#04122e"/></radialGradient>
    <radialGradient id="mars" cx="30%" cy="50%" r="75%">
      <stop offset="0" stop-color="#f6bd94"/><stop offset="0.55" stop-color="#c14a1f"/><stop offset="1" stop-color="#2a0c04"/></radialGradient>
    <radialGradient id="jupiter" cx="30%" cy="50%" r="75%">
      <stop offset="0" stop-color="#f6e0b0"/><stop offset="0.55" stop-color="#c48a4a"/><stop offset="1" stop-color="#331d0c"/></radialGradient>
    <radialGradient id="saturn" cx="30%" cy="50%" r="75%">
      <stop offset="0" stop-color="#f8ecc0"/><stop offset="0.55" stop-color="#caa95b"/><stop offset="1" stop-color="#2c2108"/></radialGradient>
    <radialGradient id="uranus" cx="30%" cy="50%" r="75%">
      <stop offset="0" stop-color="#cdf4f4"/><stop offset="0.55" stop-color="#6fc4cc"/><stop offset="1" stop-color="#0a3538"/></radialGradient>
    <radialGradient id="neptune" cx="30%" cy="50%" r="75%">
      <stop offset="0" stop-color="#aac8ff"/><stop offset="0.55" stop-color="#3758c0"/><stop offset="1" stop-color="#050a2e"/></radialGradient>

    <!-- 12-tooth cog, module 10 -->
    <g id="gearA"><circle r="53" fill="url(#brass)" stroke="#4a3112" stroke-width="2"/>
      <g fill="url(#brass)" stroke="#4a3112" stroke-width="1.4">
        <rect x="-5.5" y="53" width="11" height="7" transform="rotate(0)"/><rect x="-5.5" y="53" width="11" height="7" transform="rotate(30)"/><rect x="-5.5" y="53" width="11" height="7" transform="rotate(60)"/><rect x="-5.5" y="53" width="11" height="7" transform="rotate(90)"/><rect x="-5.5" y="53" width="11" height="7" transform="rotate(120)"/><rect x="-5.5" y="53" width="11" height="7" transform="rotate(150)"/><rect x="-5.5" y="53" width="11" height="7" transform="rotate(180)"/><rect x="-5.5" y="53" width="11" height="7" transform="rotate(210)"/><rect x="-5.5" y="53" width="11" height="7" transform="rotate(240)"/><rect x="-5.5" y="53" width="11" height="7" transform="rotate(270)"/><rect x="-5.5" y="53" width="11" height="7" transform="rotate(300)"/><rect x="-5.5" y="53" width="11" height="7" transform="rotate(330)"/></g>
      <circle r="18" fill="url(#brassH)" stroke="#4a3112" stroke-width="2"/><circle r="6" fill="#23160a"/></g>
    <!-- 8-tooth cog, module 10 -->
    <g id="gearB"><circle r="35" fill="url(#brass)" stroke="#4a3112" stroke-width="2"/>
      <g fill="url(#brass)" stroke="#4a3112" stroke-width="1.2">
        <rect x="-4.5" y="35" width="9" height="5" transform="rotate(0)"/><rect x="-4.5" y="35" width="9" height="5" transform="rotate(45)"/><rect x="-4.5" y="35" width="9" height="5" transform="rotate(90)"/><rect x="-4.5" y="35" width="9" height="5" transform="rotate(135)"/><rect x="-4.5" y="35" width="9" height="5" transform="rotate(180)"/><rect x="-4.5" y="35" width="9" height="5" transform="rotate(225)"/><rect x="-4.5" y="35" width="9" height="5" transform="rotate(270)"/><rect x="-4.5" y="35" width="9" height="5" transform="rotate(315)"/></g>
      <circle r="13" fill="url(#brassH)" stroke="#4a3112" stroke-width="1.6"/><circle r="4.5" fill="#23160a"/></g>
    <!-- 6-tooth cog, module 10 -->
    <g id="gearD"><circle r="26" fill="url(#brass)" stroke="#4a3112" stroke-width="2"/>
      <g fill="url(#brass)" stroke="#4a3112" stroke-width="1.2">
        <rect x="-4" y="26" width="8" height="4" transform="rotate(0)"/><rect x="-4" y="26" width="8" height="4" transform="rotate(60)"/><rect x="-4" y="26" width="8" height="4" transform="rotate(120)"/><rect x="-4" y="26" width="8" height="4" transform="rotate(180)"/><rect x="-4" y="26" width="8" height="4" transform="rotate(240)"/><rect x="-4" y="26" width="8" height="4" transform="rotate(300)"/></g>
      <circle r="10" fill="url(#brassH)" stroke="#4a3112" stroke-width="1.6"/><circle r="4" fill="#23160a"/></g>

    <clipPath id="cM"><circle r="5"/></clipPath><clipPath id="cV"><circle r="8"/></clipPath>
    <clipPath id="cE"><circle r="9"/></clipPath><clipPath id="cMa"><circle r="6"/></clipPath>
    <clipPath id="cJ"><circle r="20"/></clipPath><clipPath id="cSa"><circle r="16"/></clipPath>
    <clipPath id="cU"><circle r="11"/></clipPath><clipPath id="cN"><circle r="10"/></clipPath>
  </defs>

  <rect width="1000" height="1060" fill="url(#plateBg)"/>

  <text x="500" y="48" text-anchor="middle" fill="#e7c885" font-size="26" letter-spacing="5">BRASS CLOCKWORK ORRERY</text>
  <text x="500" y="74" text-anchor="middle" fill="#9c8453" font-size="13" letter-spacing="2">ORBITAL PERIODS AT REAL RATIO · MESHING GEAR DRIVE TRAIN</text>

  <!-- frame -->
  <circle cx="500" cy="430" r="405" fill="none" stroke="url(#brass)" stroke-width="12"/>
  <circle cx="500" cy="430" r="392" fill="none" stroke="#3a2710" stroke-width="3"/>
  <circle cx="500" cy="430" r="383" fill="none" stroke="#8a6a34" stroke-width="1" opacity="0.6"/>

  <!-- orbits -->
  <g fill="none" stroke="#8a6a34" opacity="0.55">
    <circle cx="500" cy="430" r="70" stroke-width="1"/><circle cx="500" cy="430" r="108" stroke-width="1"/>
    <circle cx="500" cy="430" r="146" stroke-width="1.2"/><circle cx="500" cy="430" r="184" stroke-width="1.2"/>
    <circle cx="500" cy="430" r="238" stroke-width="1.4"/><circle cx="500" cy="430" r="292" stroke-width="1.5"/>
    <circle cx="500" cy="430" r="336" stroke-width="1.5"/><circle cx="500" cy="430" r="362" stroke-width="1.6"/></g>

  <!-- SUN (drive axle) -->
  <g transform="translate(500,430)">
    <circle r="128" fill="url(#sunGlow)" opacity="0.9"/>
    <g stroke="#ffe08a" stroke-width="3" opacity="0.5">
      <line x1="0" y1="54" x2="0" y2="96" transform="rotate(0)"/><line x1="0" y1="54" x2="0" y2="96" transform="rotate(30)"/>
      <line x1="0" y1="54" x2="0" y2="96" transform="rotate(60)"/><line x1="0" y1="54" x2="0" y2="96" transform="rotate(90)"/>
      <line x1="0" y1="54" x2="0" y2="96" transform="rotate(120)"/><line x1="0" y1="54" x2="0" y2="96" transform="rotate(150)"/>
      <line x1="0" y1="54" x2="0" y2="96" transform="rotate(180)"/><line x1="0" y1="54" x2="0" y2="96" transform="rotate(210)"/>
      <line x1="0" y1="54" x2="0" y2="96" transform="rotate(240)"/><line x1="0" y1="54" x2="0" y2="96" transform="rotate(270)"/>
      <line x1="0" y1="54" x2="0" y2="96" transform="rotate(300)"/><line x1="0" y1="54" x2="0" y2="96" transform="rotate(330)"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="80s" repeatCount="indefinite"/>
      <circle r="70" fill="none" stroke="#ffcf5a" stroke-width="2" opacity="0.5" stroke-dasharray="3 9"/></g>
    <circle r="48" fill="url(#sunCore)"/>
  </g>

  <!-- MERCURY -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 500 430" to="360 500 430" dur="8s" repeatCount="indefinite"/>
    <g transform="translate(570,430)">
      <circle r="5" fill="url(#mercury)"/><g clip-path="url(#cM)"><rect x="-6" y="-6" width="12" height="12" fill="url(#night)"/></g>
      <g clip-path="url(#cM)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="5" ry="1.4" fill="#414141" opacity="0.55"/><ellipse cx="-1.2" cy="2" rx="2.8" ry="1" fill="#2f2f2f" opacity="0.5"/></g></g>
      <circle r="5" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="0.4"/></g></g>

  <!-- VENUS -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 500 430" to="360 500 430" dur="20.45s" repeatCount="indefinite"/>
    <g transform="translate(608,430)">
      <circle r="8" fill="url(#venus)"/><g clip-path="url(#cV)"><rect x="-9" y="-9" width="18" height="18" fill="url(#night)"/></g>
      <g clip-path="url(#cV)"><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="-2" rx="8" ry="1.6" fill="#dab866" opacity="0.45"/><ellipse cx="0" cy="3" rx="7" ry="1.4" fill="#dab866" opacity="0.4"/></g></g>
      <circle r="8" fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="0.4"/></g></g>

  <!-- EARTH -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 500 430" to="360 500 430" dur="33.18s" repeatCount="indefinite"/>
    <g transform="translate(646,430)">
      <circle r="9" fill="url(#earth)"/><g clip-path="url(#cE)"><rect x="-10" y="-10" width="20" height="20" fill="url(#night)"/></g>
      <g clip-path="url(#cE)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="9" ry="2.4" fill="#1a5a2a" opacity="0.5"/><ellipse cx="0" cy="3.5" rx="8" ry="1.7" fill="#1a5a2a" opacity="0.45"/><ellipse cx="0" cy="-3.5" rx="7" ry="1.3" fill="#eaf1ff" opacity="0.45"/></g></g>
      <circle r="9" fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="0.4"/></g></g>

  <!-- MARS -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 500 430" to="360 500 430" dur="62.5s" repeatCount="indefinite"/>
    <g transform="translate(684,430)">
      <circle r="6" fill="url(#mars)"/><g clip-path="url(#cMa)"><rect x="-7" y="-7" width="14" height="14" fill="url(#night)"/></g>
      <g clip-path="url(#cMa)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.2s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="-1.5" rx="6" ry="1.3" fill="#7a2a10" opacity="0.55"/><ellipse cx="0" cy="2.6" rx="5" ry="1.1" fill="#7a2a10" opacity="0.5"/></g></g>
      <circle r="6" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="0.4"/></g></g>

  <!-- JUPITER -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 500 430" to="360 500 430" dur="393.9s" repeatCount="indefinite"/>
    <g transform="translate(738,430)">
      <circle r="20" fill="url(#jupiter)"/><g clip-path="url(#cJ)"><rect x="-21" y="-21" width="42" height="42" fill="url(#night)"/></g>
      <g clip-path="url(#cJ)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="-9" rx="20" ry="2.6" fill="#8a5a2a" opacity="0.5"/><ellipse cx="0" cy="-2" rx="20" ry="3.2" fill="#a06a34" opacity="0.45"/><ellipse cx="0" cy="5" rx="19" ry="3" fill="#744c20" opacity="0.55"/><ellipse cx="0" cy="11" rx="17" ry="2.4" fill="#9a642f" opacity="0.45"/></g></g>
      <circle r="20" fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="0.5"/></g></g>

  <!-- SATURN -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 500 430" to="360 500 430" dur="978.2s" repeatCount="indefinite"/>
    <g transform="translate(792,430)">
      <g transform="rotate(-22)"><ellipse rx="31" ry="8" fill="none" stroke="url(#brassH)" stroke-width="4" opacity="0.85"/><ellipse rx="37" ry="6.5" fill="none" stroke="#b8913f" stroke-width="1.5" opacity="0.6"/></g>
      <circle r="16" fill="url(#saturn)"/><g clip-path="url(#cSa)"><rect x="-17" y="-17" width="34" height="34" fill="url(#night)"/></g>
      <g clip-path="url(#cSa)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="-5" rx="16" ry="2" fill="#b8963f" opacity="0.5"/><ellipse cx="0" cy="3" rx="15" ry="2.2" fill="#9a7c30" opacity="0.5"/></g></g>
      <circle r="16" fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="0.4"/></g></g>

  <!-- URANUS -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 500 430" to="360 500 430" dur="2789.7s" repeatCount="indefinite"/>
    <g transform="translate(836,430)">
      <circle r="11" fill="url(#uranus)"/><g clip-path="url(#cU)"><rect x="-12" y="-12" width="24" height="24" fill="url(#night)"/></g>
      <g clip-path="url(#cU)"><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="-3" rx="11" ry="1.5" fill="#3a8f98" opacity="0.55"/><ellipse cx="0" cy="4" rx="10" ry="1.3" fill="#3a8f98" opacity="0.45"/></g></g>
      <circle r="11" fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="0.4"/></g></g>

  <!-- NEPTUNE -->
  <g><animateTransform attributeName="transform" type="rotate" from="0 500 430" to="360 500 430" dur="5471.8s" repeatCount="indefinite"/>
    <g transform="translate(862,430)">
      <circle r="10" fill="url(#neptune)"/><g clip-path="url(#cN)"><rect x="-11" y="-11" width="22" height="22" fill="url(#night)"/></g>
      <g clip-path="url(#cN)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="-2" rx="10" ry="1.6" fill="#1e3a8a" opacity="0.55"/><ellipse cx="0" cy="4" rx="9" ry="1.5" fill="#1e3a8a" opacity="0.5"/></g></g>
      <circle r="10" fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="0.4"/></g></g>

  <!-- DRIVE SHAFT + GEAR TRAIN -->
  <rect x="493" y="815" width="14" height="86" rx="6" fill="url(#brassH)" stroke="#3a2710" stroke-width="1.5"/>
  <circle cx="500" cy="815" r="10" fill="#2a1c08" stroke="#b8913f" stroke-width="2"/>

  <g transform="translate(500,900)"><use href="#gearA"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></use></g>
  <g transform="translate(600,900)"><use href="#gearB"><animateTransform attributeName="transform" type="rotate" from="22.5" to="-517.5" dur="12s" repeatCount="indefinite"/></use></g>
  <g transform="translate(680,900)"><use href="#gearB"><animateTransform attributeName="transform" type="rotate" from="0" to="540" dur="12s" repeatCount="indefinite"/></use></g>
  <g transform="translate(750,900)"><use href="#gearD"><animateTransform attributeName="transform" type="rotate" from="150" to="-570" dur="12s" repeatCount="indefinite"/></use></g>

  <rect x="330" y="955" width="470" height="70" rx="10" fill="#17120b" stroke="url(#brass)" stroke-width="2" opacity="0.9"/>
  <text x="565" y="984" text-anchor="middle" fill="#e7c885" font-size="15" letter-spacing="3">GEAR DRIVE TRAIN</text>
  <text x="565" y="1006" text-anchor="middle" fill="#9c8453" font-size="11" letter-spacing="1">SUN WHEEL · 12T → 8T → 8T → 6T (module 10) · counter-rotating mesh</text>
</svg>