<svg viewBox="0 0 1200 950" xmlns="http://www.w3.org/2000/svg" font-family="'Trebuchet MS', 'Segoe UI', sans-serif">
<title>Brass Clockwork Orrery</title>
<defs>
  <!-- ===== palette / materials ===== -->
  <radialGradient id="bg" cx="50%" cy="38%" r="75%">
    <stop offset="0%" stop-color="#241c11"/><stop offset="55%" stop-color="#140f09"/><stop offset="100%" stop-color="#070503"/>
  </radialGradient>
  <radialGradient id="brass" cx="38%" cy="32%" r="75%">
    <stop offset="0%" stop-color="#f4dd94"/><stop offset="42%" stop-color="#cba14a"/>
    <stop offset="78%" stop-color="#9c6f24"/><stop offset="100%" stop-color="#6d4a15"/>
  </radialGradient>
  <linearGradient id="brassSheen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f7e6a8"/><stop offset="50%" stop-color="#b98a34"/><stop offset="100%" stop-color="#7c5618"/>
  </linearGradient>
  <radialGradient id="brassHub" cx="42%" cy="38%" r="70%">
    <stop offset="0%" stop-color="#ffe9a8"/><stop offset="60%" stop-color="#b8862f"/><stop offset="100%" stop-color="#6e4d15"/>
  </radialGradient>
  <radialGradient id="sunCore" cx="42%" cy="38%" r="72%">
    <stop offset="0%" stop-color="#fff6cf"/><stop offset="35%" stop-color="#ffd873"/><stop offset="70%" stop-color="#f2a83c"/><stop offset="100%" stop-color="#d97e1e"/>
  </radialGradient>
  <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffd67a" stop-opacity=".85"/><stop offset="45%" stop-color="#f2a83c" stop-opacity=".35"/><stop offset="100%" stop-color="#f2a83c" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="planetShade" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".45"/><stop offset="26%" stop-color="#ffffff" stop-opacity="1"/>
    <stop offset="38%" stop-color="#fffdf4" stop-opacity=".7"/><stop offset="44%" stop-color="#f3d9a0" stop-opacity=".12"/>
    <stop offset="52%" stop-color="#0b0704" stop-opacity=".26"/><stop offset="62%" stop-color="#080503" stop-opacity=".58"/>
    <stop offset="78%" stop-color="#060402" stop-opacity=".8"/><stop offset="100%" stop-color="#040302" stop-opacity=".93"/>
  </radialGradient>

  <!-- ===== gears (built as teeth ring + solid disc so meshes read correctly) ===== -->
  <g id="gearBig">
    <circle r="60" fill="none" stroke="#8a5f1c" stroke-width="24" stroke-dasharray="1.5 30"/>
    <circle r="60" fill="url(#brass)"/><circle r="54" fill="none" stroke="#7a5417" stroke-width="1.4" opacity=".5"/>
    <circle r="22" fill="url(#brassHub)" stroke="#5f4312" stroke-width="1.5"/><circle r="8" fill="#3a290c"/>
  </g>
  <g id="gearMid">
    <circle r="40" fill="none" stroke="#8a5f1c" stroke-width="16" stroke-dasharray="1.2 20"/>
    <circle r="40" fill="url(#brass)"/><circle r="35" fill="none" stroke="#7a5417" stroke-width="1.2" opacity=".5"/>
    <circle r="15" fill="url(#brassHub)" stroke="#5f4312" stroke-width="1.2"/><circle r="5.5" fill="#3a290c"/>
  </g>
  <g id="gearSmall">
    <circle r="28" fill="none" stroke="#8a5f1c" stroke-width="11" stroke-dasharray="1 14"/>
    <circle r="28" fill="url(#brass)"/><circle r="24" fill="none" stroke="#7a5417" stroke-width="1.1" opacity=".5"/>
    <circle r="10" fill="url(#brassHub)" stroke="#5f4312" stroke-width="1.1"/><circle r="4" fill="#3a290c"/>
  </g>

  <!-- ===== sun ===== -->
  <g id="sun">
    <circle r="130" fill="url(#sunGlow)"/>
    <g stroke="url(#brassSheen)" stroke-width="6" stroke-linecap="round">
      <line y2="-58"/><line y2="-58" transform="rotate(30)"/><line y2="-58" transform="rotate(60)"/>
      <line y2="-58" transform="rotate(90)"/><line y2="-58" transform="rotate(120)"/><line y2="-58" transform="rotate(150)"/>
      <line y2="-58" transform="rotate(180)"/><line y2="-58" transform="rotate(210)"/><line y2="-58" transform="rotate(240)"/>
      <line y2="-58" transform="rotate(270)"/><line y2="-58" transform="rotate(300)"/><line y2="-58" transform="rotate(330)"/>
    </g>
    <circle r="46" fill="url(#sunCore)" stroke="#c98a2e" stroke-width="2"/>
    <circle r="46" fill="none" stroke="#fff3c4" stroke-width="1.5" opacity=".6"/>
  </g>

  <!-- ===== planets (spin their texture; the day/night terminator stays fixed) ===== -->
  <g id="p-mercury">
    <circle r="8" fill="#9a927f"/><circle cx="-3" cy="-2" r="1.6" fill="#7d7563"/><circle cx="3" cy="2" r="1.3" fill="#7d7563"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="9s" repeatCount="indefinite"/><circle cx="-4" cy="2" r="1.4" fill="#7d7563"/></g>
    <circle r="8" fill="url(#planetShade)"/>
  </g>
  <g id="p-venus">
    <circle r="12" fill="#e0c07a"/><circle cx="-4" cy="-3" r="2.5" fill="#d2ab63"/><circle cx="4" cy="3" r="2" fill="#cdb06a"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="15s" repeatCount="indefinite"/><circle cx="-5" cy="3" r="2.2" fill="#d2ab63"/></g>
    <circle r="12" fill="url(#planetShade)"/>
  </g>
  <g id="p-earth">
    <circle r="13" fill="#3f74b0"/><path d="M-9,-3 Q-3,-8 3,-4 Q8,0 2,5 Q-6,7 -9,2 Z" fill="#5c9a4e"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite"/><path d="M2,-8 Q7,-6 5,0 Q1,4 -3,1 Z" fill="#5c9a4e"/></g>
    <circle r="13" fill="url(#planetShade)"/>
  </g>
  <g id="p-mars">
    <circle r="10" fill="#b5623f"/><circle cx="-3" cy="-2" r="2" fill="#9c4f31"/><circle cx="3" cy="2" r="1.6" fill="#a8573a"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="11s" repeatCount="indefinite"/><circle cx="-4" cy="2" r="1.8" fill="#9c4f31"/></g>
    <circle r="10" fill="url(#planetShade)"/>
  </g>
  <g id="p-jupiter">
    <circle r="26" fill="#d7b98a"/><path d="M-26,-14 Q0,-10 26,-14 L26,-7 Q0,-3 -26,-7 Z" fill="#c2a06e"/>
    <path d="M-26,2 Q0,6 26,2 L26,9 Q0,13 -26,9 Z" fill="#b8945f"/><circle cx="12" cy="-2" r="4.5" fill="#c07a52"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/><path d="M-24,-2 Q0,2 24,-2 L24,5 Q0,9 -24,5 Z" fill="#c2a06e"/></g>
    <circle r="26" fill="url(#planetShade)"/>
  </g>
  <g id="p-saturn">
    <ellipse rx="48" ry="13" transform="rotate(-18)" fill="none" stroke="#b98f52" stroke-width="7" opacity=".85"/>
    <circle r="22" fill="#d8c08a"/><path d="M-22,-10 Q0,-6 22,-10 L22,-4 Q0,0 -22,-4 Z" fill="#c8ad74"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="13s" repeatCount="indefinite"/><path d="M-20,2 Q0,6 20,2 L20,8 Q0,12 -20,8 Z" fill="#c8ad74"/></g>
    <circle r="22" fill="url(#planetShade)"/>
    <ellipse rx="48" ry="13" transform="rotate(-18)" fill="none" stroke="#e6cf9a" stroke-width="2.5" opacity=".7" stroke-dasharray="0 20 28 40"/>
  </g>
  <g id="p-uranus">
    <circle r="16" fill="#9fd0d6"/><path d="M-16,-4 Q0,0 16,-4 L16,3 Q0,7 -16,3 Z" fill="#8ec2ca"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite"/><circle cx="-5" cy="3" r="2.4" fill="#8ec2ca"/></g>
    <circle r="16" fill="url(#planetShade)"/>
  </g>
  <g id="p-neptune">
    <circle r="15" fill="#4f79c8"/><path d="M-15,-3 Q0,1 15,-3 L15,4 Q0,8 -15,4 Z" fill="#426ab5"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite"/><circle cx="-4" cy="3" r="2.2" fill="#3a5fa8"/></g>
    <circle r="15" fill="url(#planetShade)"/>
  </g>

  <!-- ===== the eight orbit gears (each meshes into its neighbours) ===== -->
  <g id="og-mercury"><use href="#gearSmall"/><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="88s" repeatCount="indefinite"/></g>
  <g id="og-venus"><use href="#gearSmall"/><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="218.75s" repeatCount="indefinite"/></g>
  <g id="og-earth"><use href="#gearMid"/><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="352s" repeatCount="indefinite"/></g>
  <g id="og-mars"><use href="#gearSmall"/><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="663.75s" repeatCount="indefinite"/></g>
  <g id="og-jupiter"><use href="#gearBig"/><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4180s" repeatCount="indefinite"/></g>
  <g id="og-saturn"><use href="#gearMid"/><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="10375s" repeatCount="indefinite"/></g>
  <g id="og-uranus"><use href="#gearBig"/><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="29857.5s" repeatCount="indefinite"/></g>
  <g id="og-neptune"><use href="#gearMid"/><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="61600s" repeatCount="indefinite"/></g>

  <!-- ===== motion paths (one revolution each, period = that gear's) ===== -->
  <path id="mp-mercury" fill="none" d="M485,375 a115,115 0 1,0 230,0 a115,115 0 1,0 -230,0"><animateMotion dur="88s" repeatCount="indefinite" rotate="auto"/></path>
  <path id="mp-venus" fill="none" d="M475,375 a125,125 0 1,1 250,0 a125,125 0 1,1 -250,0"><animateMotion dur="218.75s" repeatCount="indefinite" rotate="auto"/></path>
  <path id="mp-earth" fill="none" d="M465,375 a135,135 0 1,0 270,0 a135,135 0 1,0 -270,0"><animateMotion dur="352s" repeatCount="indefinite" rotate="auto"/></path>
  <path id="mp-mars" fill="none" d="M455,375 a145,145 0 1,1 290,0 a145,145 0 1,1 -290,0"><animateMotion dur="663.75s" repeatCount="indefinite" rotate="auto"/></path>
  <path id="mp-jupiter" fill="none" d="M445,375 a155,155 0 1,0 310,0 a155,155 0 1,0 -310,0"><animateMotion dur="4180s" repeatCount="indefinite" rotate="auto"/></path>
  <path id="mp-saturn" fill="none" d="M435,375 a165,165 0 1,1 330,0 a165,165 0 1,1 -330,0"><animateMotion dur="10375s" repeatCount="indefinite" rotate="auto"/></path>
  <path id="mp-uranus" fill="none" d="M425,375 a175,175 0 1,0 350,0 a175,175 0 1,0 -350,0"><animateMotion dur="29857.5s" repeatCount="indefinite" rotate="auto"/></path>
  <path id="mp-neptune" fill="none" d="M415,375 a185,185 0 1,1 370,0 a185,185 0 1,1 -370,0"><animateMotion dur="61600s" repeatCount="indefinite" rotate="auto"/></path>

  <!-- ===== drive column (escapement -> pinion -> every orbit gear) ===== -->
  <g id="dc-mercury">
    <line x1="600" y1="375" x2="485" y2="375" stroke="#a97f2c" stroke-width="10" stroke-linecap="round"/>
    <circle cx="485" cy="375" r="6" fill="url(#brassHub)" stroke="#5f4312"/><animateTransform attributeName="transform" type="rotate" from="0 600 375" to="-360 600 375" dur="88s" repeatCount="indefinite"/>
  </g>
  <g id="dc-venus">
    <line x1="600" y1="375" x2="475" y2="375" stroke="#a97f2c" stroke-width="10" stroke-linecap="round"/>
    <circle cx="475" cy="375" r="6" fill="url(#brassHub)" stroke="#5f4312"/><animateTransform attributeName="transform" type="rotate" from="0 600 375" to="360 600 375" dur="218.75s" repeatCount="indefinite"/>
  </g>
  <g id="dc-earth">
    <line x1="600" y1="375" x2="465" y2="375" stroke="#a97f2c" stroke-width="10" stroke-linecap="round"/>
    <circle cx="465" cy="375" r="6" fill="url(#brassHub)" stroke="#5f4312"/><animateTransform attributeName="transform" type="rotate" from="0 600 375" to="-360 600 375" dur="352s" repeatCount="indefinite"/>
  </g>
  <g id="dc-mars">
    <line x1="600" y1="375" x2="455" y2="375" stroke="#a97f2c" stroke-width="10" stroke-linecap="round"/>
    <circle cx="455" cy="375" r="6" fill="url(#brassHub)" stroke="#5f4312"/><animateTransform attributeName="transform" type="rotate" from="0 600 375" to="360 600 375" dur="663.75s" repeatCount="indefinite"/>
  </g>
  <g id="dc-jupiter">
    <line x1="600" y1="375" x2="445" y2="375" stroke="#a97f2c" stroke-width="10" stroke-linecap="round"/>
    <circle cx="445" cy="375" r="6" fill="url(#brassHub)" stroke="#5f4312"/><animateTransform attributeName="transform" type="rotate" from="0 600 375" to="-360 600 375" dur="4180s" repeatCount="indefinite"/>
  </g>
  <g id="dc-saturn">
    <line x1="600" y1="375" x2="435" y2="375" stroke="#a97f2c" stroke-width="10" stroke-linecap="round"/>
    <circle cx="435" cy="375" r="6" fill="url(#brassHub)" stroke="#5f4312"/><animateTransform attributeName="transform" type="rotate" from="0 600 375" to="360 600 375" dur="10375s" repeatCount="indefinite"/>
  </g>
  <g id="dc-uranus">
    <line x1="600" y1="375" x2="425" y2="375" stroke="#a97f2c" stroke-width="10" stroke-linecap="round"/>
    <circle cx="425" cy="375" r="6" fill="url(#brassHub)" stroke="#5f4312"/><animateTransform attributeName="transform" type="rotate" from="0 600 375" to="-360 600 375" dur="29857.5s" repeatCount="indefinite"/>
  </g>
  <g id="dc-neptune">
    <line x1="600" y1="375" x2="415" y2="375" stroke="#a97f2c" stroke-width="10" stroke-linecap="round"/>
    <circle cx="415" cy="375" r="6" fill="url(#brassHub)" stroke="#5f4312"/><animateTransform attributeName="transform" type="rotate" from="0 600 375" to="360 600 375" dur="61600s" repeatCount="indefinite"/>
  </g>

  <!-- ===== the escapement (the visible driver) ===== -->
  <g id="esc">
    <circle r="28" fill="none" stroke="#8a5f1c" stroke-width="11" stroke-dasharray="1 14"/>
    <circle r="28" fill="url(#brass)"/><circle r="24" fill="none" stroke="#7a5417" stroke-width="1.1" opacity=".5"/>
    <g stroke="#c99a3e" stroke-width="2"><line y1="-24" y2="24"/><line x1="-24" x2="24"/></g>
    <circle r="9" fill="url(#brassHub)" stroke="#5f4312" stroke-width="1.5"/><circle r="3.5" fill="#3a290c"/>
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="88s" repeatCount="indefinite"/>
  </g>

  <!-- ===== decorative frame (static) ===== -->
  <g id="frame">
    <rect x="12" y="12" width="1176" height="926" rx="30" fill="none" stroke="url(#brassSheen)" stroke-width="14"/>
    <rect x="28" y="28" width="1144" height="894" rx="22" fill="none" stroke="#7a5417" stroke-width="2.5" opacity=".7"/>
    <g fill="url(#brassHub)" stroke="#5f4312" stroke-width="1">
      <circle cx="12" cy="12" r="10"/><circle cx="1188" cy="12" r="10"/><circle cx="12" cy="938" r="10"/><circle cx="1188" cy="938" r="10"/>
      <circle cx="600" cy="12" r="7"/><circle cx="600" cy="938" r="7"/><circle cx="12" cy="475" r="7"/><circle cx="1188" cy="475" r="7"/>
    </g>
  </g>

  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<style>
  .label{fill:#e8c877;font-size:15px;letter-spacing:.06em;font-weight:600;paint-order:stroke;stroke:#0a0703;stroke-width:3px;}
  .title{fill:#f2d489;font-size:30px;letter-spacing:.14em;font-weight:700;paint-order:stroke;stroke:#0a0703;stroke-width:5px;}
  .sub{fill:#bfa066;font-size:13px;letter-spacing:.28em;}
</style>

<rect width="1200" height="950" fill="url(#bg)"/>

<!-- orbit rings (behind everything) -->
<g id="rings">
  <circle cx="600" cy="375" r="115" fill="none" stroke="#caa45e" stroke-width="1.2" opacity=".28" stroke-dasharray="2 7"/>
  <circle cx="600" cy="375" r="125" fill="none" stroke="#caa45e" stroke-width="1.2" opacity=".28" stroke-dasharray="2 7"/>
  <circle cx="600" cy="375" r="135" fill="none" stroke="#caa45e" stroke-width="1.2" opacity=".28" stroke-dasharray="2 7"/>
  <circle cx="600" cy="375" r="145" fill="none" stroke="#caa45e" stroke-width="1.2" opacity=".28" stroke-dasharray="2 7"/>
  <circle cx="600" cy="375" r="155" fill="none" stroke="#caa45e" stroke-width="1.2" opacity=".28" stroke-dasharray="2 7"/>
  <circle cx="600" cy="375" r="165" fill="none" stroke="#caa45e" stroke-width="1.2" opacity=".28" stroke-dasharray="2 7"/>
  <circle cx="600" cy="375" r="175" fill="none" stroke="#caa45e" stroke-width="1.2" opacity=".28" stroke-dasharray="2 7"/>
  <circle cx="600" cy="375" r="185" fill="none" stroke="#caa45e" stroke-width="1.2" opacity=".28" stroke-dasharray="2 7"/>
</g>

<!-- gears (outermost drawn first so inner ones sit on top) -->
<use href="#og-neptune" x="415" y="375"/><use href="#og-uranus" x="425" y="375"/>
<use href="#og-saturn"  x="435" y="375"/><use href="#og-jupiter" x="445" y="375"/>
<use href="#og-mars"    x="455" y="375"/><use href="#og-earth"   x="465" y="375"/>
<use href="#og-venus"   x="475" y="375"/><use href="#og-mercury" x="485" y="375"/>

<!-- drive column + sun -->
<use href="#dc-neptune"/><use href="#dc-uranus"/><use href="#dc-saturn"/><use href="#dc-jupiter"/>
<use href="#dc-mars"/><use href="#dc-earth"/><use href="#dc-venus"/><use href="#dc-mercury"/>
<use href="#esc" x="600" y="375" filter="url(#glow)"/>
<use href="#sun" x="600" y="375" filter="url(#glow)"/>

<!-- planets riding their gears -->
<use href="#p-mercury"><animateMotion dur="88s" repeatCount="indefinite" rotate="auto"><mpath href="#mp-mercury"/></animateMotion></use>
<use href="#p-venus"><animateMotion dur="218.75s" repeatCount="indefinite" rotate="auto"><mpath href="#mp-venus"/></animateMotion></use>
<use href="#p-earth"><animateMotion dur="352s" repeatCount="indefinite" rotate="auto"><mpath href="#mp-earth"/></animateMotion></use>
<use href="#p-mars"><animateMotion dur="663.75s" repeatCount="indefinite" rotate="auto"><mpath href="#mp-mars"/></animateMotion></use>
<use href="#p-jupiter"><animateMotion dur="4180s" repeatCount="indefinite" rotate="auto"><mpath href="#mp-jupiter"/></animateMotion></use>
<use href="#p-saturn"><animateMotion dur="10375s" repeatCount="indefinite" rotate="auto"><mpath href="#mp-saturn"/></animateMotion></use>
<use href="#p-uranus"><animateMotion dur="29857.5s" repeatCount="indefinite" rotate="auto"><mpath href="#mp-uranus"/></animateMotion></use>
<use href="#p-neptune"><animateMotion dur="61600s" repeatCount="indefinite" rotate="auto"><mpath href="#mp-neptune"/></animateMotion></use>

<!-- labels (static, so the day/night terminator stays anchored to the sun) -->
<g class="label" text-anchor="middle">
  <text x="600" y="592">MERCURY</text><text x="600" y="614">VENUS</text>
  <text x="600" y="636">EARTH</text><text x="600" y="658">MARS</text>
  <text x="600" y="682">JUPITER</text><text x="600" y="704">SATURN</text>
  <text x="600" y="726">URANUS</text><text x="600" y="748">NEPTUNE</text>
</g>

<!-- title -->
<g text-anchor="middle"><text class="title" x="600" y="812">THE BRASS ORRERY</text><text class="sub" x="600" y="838">A CLOCKWORK MODEL OF THE SOLAR SYSTEM</text></g>

<!-- frame on top -->
<use href="#frame"/>
</svg>