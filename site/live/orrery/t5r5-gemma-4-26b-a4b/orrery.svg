<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" style="background: #050508; font-family: serif;">
  <defs>
    <!-- Brass Material Gradients -->
    <radialGradient id="brassGradient" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#B5A642" />
      <stop offset="100%" stop-color="#8B7500" />
    </radialGradient>
    
    <radialGradient id="sunGradient" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFF5A6" />
      <stop offset="40%" stop-color="#FF8C00" />
      <stop offset="100%" stop-color="#8B4513" />
    </radialGradient>

    <!-- Shadow/Day-Night Effect -->
    <!-- This gradient is applied to the planet to simulate a lit side and a dark side -->
    <radialGradient id="planetLight" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3" />
      <stop offset="40%" stop-color="black" stop-opacity="0.4" />
      <stop offset="100%" stop-color="black" stop-opacity="0.8" />
    </radialGradient>

    <!-- Gear Tooth Pattern -->
    <path id="gearTeeth">
      <path d="M -5,-10 L -2,-10 L -1,-12 L 1,-12 L 2,-10 L 5,-10 L 6,-8 L 8,-8 L 8,-5 L 10,-5 L 10,-2 L 12,-2 L 12,2 L 10,2 L 10,5 L 8,5 L 8,8 L 6,8 L 5,10 L 2,10 L 1,12 L -1,12 L -2,10 L -5,10 L -6,8 L -8,8 L -8,5 L -10,5 L -10,2 L -12,2 L -12,-2 L -10,-2 L -10,-5 L -8,-5 L -8,-8 L -6,-8 L -5,-10 Z" />
    </path>

    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Stars -->
  <g opacity="0.5">
    <circle cx="100" cy="100" r="1" fill="white" />
    <circle cx="700" cy="200" r="1.5" fill="white" />
    <circle cx="400" cy="700" r="1" fill="white" />
    <circle cx="150" cy="600" r="1" fill="white" />
    <circle cx="650" cy="50" r="1.2" fill="white" />
    <circle cx="200" cy="400" r="0.8" fill="white" />
  </g>

  <!-- The Central Sun -->
  <g transform="translate(400, 400)">
    <circle r="45" fill="url(#sunGradient)" filter="url(#glow)" />
    <circle r="35" fill="none" stroke="#FFD700" stroke-width="2" stroke-dasharray="5,5" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Clockwork Mechanism (Gears) -->
  <g opacity="0.6">
    <!-- Main Sun Gear -->
    <g transform="translate(400, 400)">
      <use href="#gearTeeth" fill="url(#brassGradient)" transform="scale(15)" />
      <circle r="20" fill="none" stroke="#8B7500" stroke-width="2" />
    </g>
    
    <!-- Planetary Connection Gears (Simplified Visual Representation) -->
    <g id="connectionGears" transform="translate(400, 400)">
      <!-- Mercury Gear -->
      <g transform="rotate(0)">
        <use href="#gearTeeth" fill="url(#brassGradient)" transform="translate(60, 0) scale(4) rotate(15)" />
      </g>
      <!-- Earth Gear -->
      <g transform="rotate(90)">
        <use href="#gearTeeth" fill="url(#brassGradient)" transform="translate(150, 0) scale(7) rotate(-15)" />
      </g>
      <!-- Jupiter Gear -->
      <g transform="rotate(180)">
        <use href="#gearTeeth" fill="url(#brassGradient)" transform="translate(280, 0) scale(10) rotate(10)" />
      </g>
    </g>
  </g>

  <!-- ORBITAL SYSTEM -->
  <!-- We use a pattern of: 
       1. Orbit Group (rotates around center)
       2. Planet Group (rotates on axis for day/night)
       3. The Planet itself (the visual sphere) 
  -->

  <!-- Mercury -->
  <g transform="translate(400, 400)">
    <circle r="60" fill="none" stroke="#B5A642" stroke-width="1" stroke-dasharray="2,4" opacity="0.3" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite" />
      <g transform="translate(60, 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite" />
          <circle r="8" fill="#A5A5A5" />
          <circle r="8" fill="url(#planetLight)" />
        </g>
      </g>
    </g>
  </g>

  <!-- Venus -->
  <g transform="translate(400, 400)">
    <circle r="90" fill="none" stroke="#B5A642" stroke-width="1" stroke-dasharray="2,4" opacity="0.3" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite" />
      <g transform="translate(90, 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
          <circle r="12" fill="#E3BB7B" />
          <circle r="12" fill="url(#planetLight)" />
        </g>
      </g>
    </g>
  </g>

  <!-- Earth -->
  <g transform="translate(400, 400)">
    <circle r="130" fill="none" stroke="#B5A642" stroke-width="1" stroke-dasharray="2,4" opacity="0.3" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
      <g transform="translate(130, 0)">
        <!-- Continents/Colors (Simplified) -->
        <circle r="14" fill="#2271B3" />
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite" />
          <path d="M -5,-5 Q 0,-8 5,-5 Q 8,0 5,5 Q 0,8 -5,5 Q -8,0 -5,-5" fill="#4CAF50" opacity="0.6" />
          <circle r="14" fill="url(#planetLight)" />
        </g>
      </g>
    </g>
  </g>

  <!-- Mars -->
  <g transform="translate(400, 400)">
    <circle r="170" fill="none" stroke="#B5A642" stroke-width="1" stroke-dasharray="2,4" opacity="0.3" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="35s" repeatCount="indefinite" />
      <g transform="translate(170, 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite" />
          <circle r="10" fill="#E27B58" />
          <circle r="10" fill="url(#planetLight)" />
        </g>
      </g>
    </g>
  </g>

  <!-- Jupiter -->
  <g transform="translate(400, 400)">
    <circle r="230" fill="none" stroke="#B5A642" stroke-width="1" stroke-dasharray="2,4" opacity="0.3" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="80s" repeatCount="indefinite" />
      <g transform="translate(230, 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite" />
          <circle r="25" fill="#D39C7E" />
          <!-- Jupiter Bands -->
          <rect x="-25" y="-10" width="50" height="5" fill="#A57C64" opacity="0.5" />
          <rect x="-25" y="5" width="50" height="5" fill="#A57C64" opacity="0.5" />
          <circle r="25" fill="url(#planetLight)" />
        </g>
      </g>
    </g>
  </g>

  <!-- Saturn -->
  <g transform="translate(400, 400)">
    <circle r="290" fill="none" stroke="#B5A642" stroke-width="1" stroke-dasharray="2,4" opacity="0.3" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="140s" repeatCount="indefinite" />
      <g transform="translate(290, 0)">
        <!-- Saturn Rings -->
        <ellipse cx="0" cy="0" rx="40" ry="12" fill="none" stroke="#C5AB6E" stroke-width="6" opacity="0.7" />
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
          <circle r="18" fill="#C5AB6E" />
          <circle r="18" fill="url(#planetLight)" />
        </g>
      </g>
    </g>
  </g>

  <!-- Uranus -->
  <g transform="translate(400, 400)">
    <circle r="340" fill="none" stroke="#B5A642" stroke-width="1" stroke-dasharray="2,4" opacity="0.3" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="250s" repeatCount="indefinite" />
      <g transform="translate(340, 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite" />
          <circle r="14" fill="#BBE1E2" />
          <circle r="14" fill="url(#planetLight)" />
        </g>
      </g>
    </g>
  </g>

  <!-- Neptune -->
  <g transform="translate(400, 400)">
    <circle r="380" fill="none" stroke="#B5A642" stroke-width="1" stroke-dasharray="2,4" opacity="0.3" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="400s" repeatCount="indefinite" />
      <g transform="translate(380, 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite" />
          <circle r="13" fill="#6082C6" />
          <circle r="13" fill="url(#planetLight)" />
        </g>
      </g>
    </g>
  </g>

</svg>