<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7d6" />
      <stop offset="50%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ff8c00" />
    </radialGradient>
    <radialGradient id="brassGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4d03f" />
      <stop offset="50%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#8b4513" />
    </radialGradient>
    <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#0a0e1a" />

  <!-- Sun -->
  <g id="sun">
    <circle cx="400" cy="400" r="80" fill="url(#sunGrad)" filter="url(#sunGlow)" />
    <animate attributeName="r" values="70;90;70" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.8;1" dur="5s" repeatCount="indefinite" />
  </g>

  <!-- Orbits -->
  <circle cx="400" cy="400" r="100" fill="none" stroke="#daa520" stroke-width="1" opacity="0.5" />
  <circle cx="400" cy="400" r="140" fill="none" stroke="#daa520" stroke-width="1" opacity="0.5" />
  <circle cx="400" cy="400" r="180" fill="none" stroke="#daa520" stroke-width="1" opacity="0.5" />
  <circle cx="400" cy="400" r="220" fill="none" stroke="#daa520" stroke-width="1" opacity="0.5" />
  <circle cx="400" cy="400" r="260" fill="none" stroke="#daa520" stroke-width="1" opacity="0.5" />
  <circle cx="400" cy="400" r="300" fill="none" stroke="#daa520" stroke-width="1" opacity="0.5" />

  <!-- Central Gear -->
  <g id="centralGear">
    <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="15s" repeatCount="indefinite" />
    <circle cx="400" cy="400" r="60" fill="#8b4513" stroke="#daa520" stroke-width="3" />
    <circle cx="400" cy="400" r="35" fill="#daa520" />
    <rect x="395" y="50" width="10" height="15" fill="#8b4513" stroke="#daa520" stroke-width="1" transform="rotate(0, 400, 400)" />
    <rect x="395" y="50" width="10" height="15" fill="#8b4513" stroke="#daa520" stroke-width="1" transform="rotate(30, 400, 400)" />
    <rect x="395" y="50" width="10" height="15" fill="#8b4513" stroke="#daa520" stroke-width="1" transform="rotate(60, 400, 400)" />
    <rect x="395" y="50" width="10" height="15" fill="#8b4513" stroke="#daa520" stroke-width="1" transform="rotate(90, 400, 400)" />
    <rect x="395" y="50" width="10" height="15" fill="#8b4513" stroke="#daa520" stroke-width="1" transform="rotate(120, 400, 400)" />
    <rect x="395" y="50" width="10" height="15" fill="#8b4513" stroke="#daa520" stroke-width="1" transform="rotate(150, 400, 400)" />
    <rect x="395" y="50" width="10" height="15" fill="#8b4513" stroke="#daa520" stroke-width="1" transform="rotate(180, 400, 400)" />
    <rect x="395" y="50" width="10" height="15" fill="#8b4513" stroke="#daa520" stroke-width="1" transform="rotate(210, 400, 400)" />
    <rect x="395" y="50" width="10" height="15" fill="#8b4513" stroke="#daa520" stroke-width="1" transform="rotate(240, 400, 400)" />
    <rect x="395" y="50" width="10" height="15" fill="#8b4513" stroke="#daa520" stroke-width="1" transform="rotate(270, 400, 400)" />
    <rect x="395" y="50" width="10" height="15" fill="#8b4513" stroke="#daa520" stroke-width="1" transform="rotate(300, 400, 400)" />
    <rect x="395" y="50" width="10" height="15" fill="#8b4513" stroke="#daa520" stroke-width="1" transform="rotate(330, 400, 400)" />
  </g>

  <!-- Gearbox -->
  <g id="gearbox">
    <rect x="350" y="250" width="100" height="80" fill="#5c4033" stroke="#daa520" stroke-width="2" />
    <circle cx="400" cy="300" r="10" fill="#daa520" />
    <circle cx="400" cy="350" r="10" fill="#daa520" />
  </g>

  <!-- Mercury -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="80s" repeatCount="indefinite" />
    <line x1="400" y1="400" x2="400" y2="100" stroke="#daa520" stroke-width="4" />
    <g transform="translate(400, 100)">
      <g>
        <circle cx="0" cy="0" r="10" fill="#daa520" stroke="#b8860b" stroke-width="2" />
        <rect x="-5" y="-5" width="10" height="10" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(45, 0, 0)" />
        <rect x="-5" y="-5" width="10" height="10" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(90, 0, 0)" />
        <rect x="-5" y="-5" width="10" height="10" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(135, 0, 0)" />
        <rect x="-5" y="-5" width="10" height="10" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(180, 0, 0)" />
        <rect x="-5" y="-5" width="10" height="10" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(225, 0, 0)" />
        <rect x="-5" y="-5" width="10" height="10" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(270, 0, 0)" />
        <rect x="-5" y="-5" width="10" height="10" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(315, 0, 0)" />
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
        <circle cx="0" cy="0" r="15" fill="url(#brassGrad)" stroke="#daa520" stroke-width="2" />
        <circle cx="-8" cy="0" r="15" fill="#000" opacity="0.6" />
      </g>
    </g>
  </g>

  <!-- Venus -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="38s" repeatCount="indefinite" />
    <line x1="400" y1="400" x2="400" y2="140" stroke="#daa520" stroke-width="4" />
    <g transform="translate(400, 140)">
      <g>
        <circle cx="0" cy="0" r="8" fill="#daa520" stroke="#b8860b" stroke-width="2" />
        <rect x="-4" y="-4" width="8" height="8" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(45, 0, 0)" />
        <rect x="-4" y="-4" width="8" height="8" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(90, 0, 0)" />
        <rect x="-4" y="-4" width="8" height="8" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(135, 0, 0)" />
        <rect x="-4" y="-4" width="8" height="8" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(180, 0, 0)" />
        <rect x="-4" y="-4" width="8" height="8" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(225, 0, 0)" />
        <rect x="-4" y="-4" width="8" height="8" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(270, 0, 0)" />
        <rect x="-4" y="-4" width="8" height="8" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(315, 0, 0)" />
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
        <circle cx="0" cy="0" r="20" fill="#f1c40f" stroke="#daa520" stroke-width="2" />
        <circle cx="-12" cy="0" r="20" fill="#000" opacity="0.6" />
      </g>
    </g>
  </g>

  <!-- Earth -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="20s" repeatCount="indefinite" />
    <line x1="400" y1="400" x2="400" y2="180" stroke="#daa520" stroke-width="4" />
    <g transform="translate(400, 180)">
      <g>
        <circle cx="0" cy="0" r="9" fill="#daa520" stroke="#b8860b" stroke-width="2" />
        <rect x="-4.5" y="-4.5" width="9" height="9" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(45, 0, 0)" />
        <rect x="-4.5" y="-4.5" width="9" height="9" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(90, 0, 0)" />
        <rect x="-4.5" y="-4.5" width="9" height="9" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(135, 0, 0)" />
        <rect x="-4.5" y="-4.5" width="9" height="9" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(180, 0, 0)" />
        <rect x="-4.5" y="-4.5" width="9" height="9" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(225, 0, 0)" />
        <rect x="-4.5" y="-4.5" width="9" height="9" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(270, 0, 0)" />
        <rect x="-4.5" y="-4.5" width="9" height="9" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(315, 0, 0)" />
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
        <circle cx="0" cy="0" r="22" fill="#3498db" stroke="#daa520" stroke-width="2" />
        <circle cx="-14" cy="0" r="22" fill="#000" opacity="0.6" />
      </g>
    </g>
  </g>

  <!-- Mars -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="40s" repeatCount="indefinite" />
    <line x1="400" y1="400" x2="400" y2="220" stroke="#daa520" stroke-width="4" />
    <g transform="translate(400, 220)">
      <g>
        <circle cx="0" cy="0" r="8" fill="#daa520" stroke="#b8860b" stroke-width="2" />
        <rect x="-4" y="-4" width="8" height="8" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(45, 0, 0)" />
        <rect x="-4" y="-4" width="8" height="8" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(90, 0, 0)" />
        <rect x="-4" y="-4" width="8" height="8" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(135, 0, 0)" />
        <rect x="-4" y="-4" width="8" height="8" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(180, 0, 0)" />
        <rect x="-4" y="-4" width="8" height="8" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(225, 0, 0)" />
        <rect x="-4" y="-4" width="8" height="8" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(270, 0, 0)" />
        <rect x="-4" y="-4" width="8" height="8" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(315, 0, 0)" />
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
        <circle cx="0" cy="0" r="18" fill="#e74c3c" stroke="#daa520" stroke-width="2" />
        <circle cx="-12" cy="0" r="18" fill="#000" opacity="0.6" />
      </g>
    </g>
  </g>

  <!-- Jupiter -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="160s" repeatCount="indefinite" />
    <line x1="400" y1="400" x2="400" y2="260" stroke="#daa520" stroke-width="4" />
    <g transform="translate(400, 260)">
      <g>
        <circle cx="0" cy="0" r="12" fill="#daa520" stroke="#b8860b" stroke-width="2" />
        <rect x="-6" y="-6" width="12" height="12" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(45, 0, 0)" />
        <rect x="-6" y="-6" width="12" height="12" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(90, 0, 0)" />
        <rect x="-6" y="-6" width="12" height="12" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(135, 0, 0)" />
        <rect x="-6" y="-6" width="12" height="12" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(180, 0, 0)" />
        <rect x="-6" y="-6" width="12" height="12" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(225, 0, 0)" />
        <rect x="-6" y="-6" width="12" height="12" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(270, 0, 0)" />
        <rect x="-6" y="-6" width="12" height="12" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(315, 0, 0)" />
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
        <circle cx="0" cy="0" r="40" fill="#d35400" stroke="#daa520" stroke-width="2" />
        <rect x="-30" y="-10" width="60" height="20" fill="#8b4513" opacity="0.6" />
        <rect x="-30" y="5" width="60" height="20" fill="#8b4513" opacity="0.6" />
        <rect x="-30" y="20" width="60" height="20" fill="#8b4513" opacity="0.6" />
        <circle cx="-12" cy="0" r="40" fill="#000" opacity="0.6" />
      </g>
    </g>
  </g>

  <!-- Saturn -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="300s" repeatCount="indefinite" />
    <line x1="400" y1="400" x2="400" y2="300" stroke="#daa520" stroke-width="4" />
    <g transform="translate(400, 300)">
      <g>
        <circle cx="0" cy="0" r="11" fill="#daa520" stroke="#b8860b" stroke-width="2" />
        <rect x="-5.5" y="-5.5" width="11" height="11" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(45, 0, 0)" />
        <rect x="-5.5" y="-5.5" width="11" height="11" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(90, 0, 0)" />
        <rect x="-5.5" y="-5.5" width="11" height="11" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(135, 0, 0)" />
        <rect x="-5.5" y="-5.5" width="11" height="11" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(180, 0, 0)" />
        <rect x="-5.5" y="-5.5" width="11" height="11" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(225, 0, 0)" />
        <rect x="-5.5" y="-5.5" width="11" height="11" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(270, 0, 0)" />
        <rect x="-5.5" y="-5.5" width="11" height="11" fill="#daa520" stroke="#b8860b" stroke-width="1" transform="rotate(315, 0, 0)" />
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
        <circle cx="0" cy="0" r="35" fill="#f4d03f" stroke="#daa520" stroke-width="2" />
        <rect x="-25" y="-8" width="50" height="16" fill="#daa520" opacity="0.6" />
        <rect x="-25" y="0" width="50" height="16" fill="#daa520" opacity="0.6" />
        <circle cx="-12" cy="0" r="35" fill="#000" opacity="0.6" />
      </g>
    </g>
  </g>
</svg>