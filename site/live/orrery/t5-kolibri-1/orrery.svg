<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions: gear symbol -->
  <defs>
    <symbol id="gear" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="40" fill="none" stroke="#888" stroke-width="5"/>
      <path d="M50,10 L50,20 M50,80 L50,90 M10,50 L20,50 M80,50 L90,50
               M20,20 L30,30 M30,20 L20,30 M70,80 L80,70 M80,80 L70,70"
            stroke="#888" stroke-width="3"/>
    </symbol>
  </defs>

  <!-- Sun -->
  <circle cx="250" cy="250" r="30" fill="#ffcc00"/>

  <!-- Central gear (represents the drive‑train) -->
  <g style="transform-origin: 250px 250px; animation: gearSpin 4s linear infinite;">
    <use href="#gear" transform="translate(250,250) scale(0.5)"/>
  </g>

  <!-- Mercury (fastest orbit) -->
  <g transform="translate(250,250)" style="transform-origin: 0 0; animation: orbit 4s linear infinite;">
    <g transform="translate(0,-40)">
      <circle r="8" fill="#ff6600"/>
      <g style="transform-origin: 0 0; animation: night 2s linear infinite;">
        <path d="M -8 0 A 8 8 0 0 1 8 0 Z" fill="#000" opacity="0.5"/>
      </g>
    </g>
  </g>

  <!-- Venus -->
  <g transform="translate(250,250)" style="transform-origin: 0 0; animation: orbit 6s linear infinite;">
    <g transform="translate(0,-60)">
      <circle r="10" fill="#ff9900"/>
      <g style="transform-origin: 0 0; animation: night 3s linear infinite;">
        <path d="M -10 0 A 10 10 0 0 1 10 0 Z" fill="#000" opacity="0.5"/>
      </g>
    </g>
  </g>

  <!-- Earth -->
  <g transform="translate(250,250)" style="transform-origin: 0 0; animation: orbit 10s linear infinite;">
    <g transform="translate(0,-80)">
      <circle r="12" fill="#66ccff"/>
      <g style="transform-origin: 0 0; animation: night 4s linear infinite;">
        <path d="M -12 0 A 12 12 0 0 1 12 0 Z" fill="#000" opacity="0.5"/>
      </g>
    </g>
  </g>

  <!-- Mars (slowest orbit) -->
  <g transform="translate(250,250)" style="transform-origin: 0 0; animation: orbit 15s linear infinite;">
    <g transform="translate(0,-100)">
      <circle r="14" fill="#ff4444"/>
      <g style="transform-origin: 0 0; animation: night 5s linear infinite;">
        <path d="M -14 0 A 14 14 0 0 1 14 0 Z" fill="#000" opacity="0.5"/>
      </g>
    </g>
  </g>

  <style>
    @keyframes orbit {
      to { transform: rotate(360deg); }
    }
    @keyframes night {
      to { transform: rotate(360deg); }
    }
    @keyframes gearSpin {
      to { transform: rotate(360deg); }
    }
  </style>
</svg>