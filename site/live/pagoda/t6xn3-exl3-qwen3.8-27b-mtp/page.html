<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>五重塔 · Voxel Pagoda</title>
<style>
  :root{
    --ink:#3a2416; --paper:#f7f1e4; --vermilion:#e0472f; --gold:#f0c24c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0c0f14;overflow:hidden}
  #app{position:fixed;inset:0}
  canvas{display:block}

  .ui{position:fixed;z-index:10;pointer-events:none;user-select:none}

  .title{top:26px;left:30px}
  .title .jp{
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Songti SC","SimSun",serif;
    font-size:clamp(52px,9vw,120px);font-weight:700;line-height:.82;
    color:var(--paper);letter-spacing:.04em;
    text-shadow:0 6px 30px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  }
  .title .rule{width:56px;height:3px;background:var(--vermilion);margin:16px 0 12px;
    box-shadow:0 0 18px rgba(224,71,47,.6)}
  .title .en{
    font-family:Georgia,"Times New Roman",serif;font-style:italic;
    font-size:clamp(14px,1.7vw,20px);color:#e7dcc7;letter-spacing:.02em;
  }
  .title .en small{display:block;font-style:normal;font-family:ui-monospace,monospace;
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#b6a588;margin-top:6px}

  .hud{bottom:26px;left:30px;display:flex;gap:12px;flex-wrap:wrap}
  .chip{
    pointer-events:auto;cursor:pointer;font-family:ui-monospace,monospace;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:#d8cbb4;background:rgba(20,16,12,.55);border:1px solid rgba(240,194,76,.35);
    padding:9px 14px;border-radius:2px;backdrop-filter:blur(6px);
    transition:transform .25s cubic-bezier(.2,.9,.2,1),background .25s,color .25s,border-color .25s;
  }
  .chip:hover{transform:translateY(-3px);background:rgba(224,71,47,.22);
    border-color:var(--vermilion);color:#fff}
  .chip.on{background:var(--vermilion);color:#fff;border-color:var(--vermilion);
    box-shadow:0 6px 22px rgba(224,71,47,.4)}

  .stamp{top:26px;right:30px;width:70px;height:70px;display:grid;place-items:center;
    color:var(--vermilion);border:3px solid var(--vermilion);border-radius:6px;
    font-family:"Hiragino Mincho ProN","Yu Mincho","Songti SC","SimSun",serif;
    font-size:40px;font-weight:700;transform:rotate(-7deg);
    box-shadow:0 0 0 3px rgba(224,71,47,.12),0 8px 24px rgba(0,0,0,.4);
    animation:stamp 6s ease-in-out infinite}
  @keyframes stamp{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(-4deg) translateY(-2px)}}

  .hint{bottom:26px;right:30px;font-family:ui-monospace,monospace;font-size:11px;
    letter-spacing:.18em;text-transform:uppercase;color:#8f8267}

  @media (max-width:640px){
    .title{top:18px;left:18px}
    .stamp{width:52px;height:52px;font-size:30px}
    .hint{display:none}
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="app"></div>

  <div class="ui title">
    <div class="jp">五重塔</div>
    <div class="rule"></div>
    <div class="en">Five‑Storey Pagoda<small>Voxel Study · Sakura Season</small></div>
  </div>

  <div class="ui stamp">桜</div>

  <div class="ui hud">
    <div class="chip on" id="btnOrbit">◐ Orbit: On</div>
    <div class="chip" id="btnWind">❀ Wind: Calm</div>
  </div>

  <div class="ui hint">drag to look · scroll to zoom</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- palette ---------------- */
const C = {
  wall:0xb6773f, wallD:0x9a6334, base:0x8a5a34,
  beam:0x3a2c20, eave:0x453429, trim:0x2a2018, gold:0xd9a441,
  stone:0x9a9284, stoneD:0x7d766a, stoneL:0xafa79a,
  tr1:0x7a4a24, tr2:0x9a5c28, tr3:0x8a5a2a, tr4:0x6f4a26, tr5:0x93582a,
  torii:0xc8372a, toriiD:0x8f271d,
  leaf:0x8f4f63, leaf2:0xb56a7f, leaf3:0xd98ba0, leaf4:0xeec1cf, leaf5:0xfbe0e8,
  water:0x3b6f7a, waterL:0x69b6bd, waterD:0x2c515a,
  grass:0x6fa84f, grass2:0x5f9a45, grass3:0x7fb45b,
  path:0x8a6f4a, pathD:0x73593a, pathL:0x9c8158,
  pine:0x2f5d3a, pine2:0x3a6f45,
  petal:0xf2c7d4,
  sky1:0xf4c7d1, sky2:0xf6ddcd, sky3:0xf0b8a2, sky4:0xe0966f, sky5:0xc97a4f
};

/* ---------------- renderer / scene / camera ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf0b8a2, 55, 165);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 600);
camera.position.set(24, 13, 30);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 14;
controls.maxDistance = 80;
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = 1.42;
controls.target.set(0, 6, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;

/* ---------------- voxel helpers ---------------- */
const matCache = new Map();
function getMat(color, o={}){
  const key = color+'|'+(o.emissive||0)+'|'+(o.roughness??1)+'|'+(o.transparent?1:0)+'|'+(o.opacity??1);
  if(matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshLambertMaterial({ color, roughness:o.roughness??1,
    emissive:o.emissive||0x000000, emissiveIntensity:o.emissiveIntensity??1 });
  if(o.transparent){ m.transparent=true; m.opacity=o.opacity??1; }
  matCache.set(key,m); return m;
}
function voxel(x,y,z,sx,sy,sz,color,o){
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz), getMat(color,o));
  m.position.set(x,y,z);
  m.castShadow = o.cast!==false;
  m.receiveShadow = o.receive!==false;
  scene.add(m); return m;
}
function block(cx,cy,cz,sx,sy,sz,color,o){ voxel(cx-sx/2, cy-sy/2, cz-sz/2, sx,sy,sz,color,o); }
function box(cx,y0,cz,w,d,color,steps=1,o){
  const sy=(o&&o.h)??1;
  for(let k=0;k<steps;k++) block(cx, y0+k*sy, cz, w, sy, d, color, o);
}
function line(cx0,cz0,cx1,cz1,y,s,color,steps=32){
  const len=Math.hypot(cx1-cx0,cz1-cz0);
  const n=Math.max(1,Math.round(len/steps));
  for(let i=0;i<=n;i++){ const t=i/n; block(cx0+(cx1-cx0)*t, y, cz0+(cz1-cz0)*t, s,s,s,color); }
}
function hline(y,zt,zt1,cx0,cx1,s){ for(let x=cx0;x<=cx1;x++) block(x,y,zt,s,s,s); void zt1; }
function vline(x,z,y0,y1,s){ for(let y=y0;y<=y1;y++) block(x,y,z,s,s,s); }
function vlineV(x,z,y0,y1,s,color){ for(let y=y0;y<=y1;y++) block(x,y,z,s,s,s,color); }
function hlineV(y,z,cx0,cx1,s,color){ for(let x=cx0;x<=cx1;x++) block(x,y,z,s,s,s,color); }
function hlineH(y,cz,z0,z1,s,color){ for(let z=z0;z<=z1;z++) block(y,z,cz,s,s,s,color); }
function hlineHh(y,cz,z0,z1,s){ for(let z=z0;z<=z1;z++) block(y,z,cz,s,s,s); }
function lineV(cx0,cz0,cx1,cz1,y,s,color){
  const len=Math.hypot(cx1-cx0,cz1-cz0); const n=Math.max(1,Math.round(len/0.5));
  for(let i=0;i<=n;i++){ const t=i/n; block(cx0+(cx1-cx0)*t, y, cz0+(cz1-cz0)*t, s,s,s,color); }
}
function ring(cx,cz,r,rr,y,s,color){
  for(let a=0;a<360;a+=15){ const x=cx+Math.cos(a*Math.PI/180)*r, z=cz+Math.sin(a*Math.PI/180)*r;
    if(Math.hypot(x-cx,z-cz)>=rr) block(x,y,z,s,s,s,color); }
}
function grid(cx,cz,rx,rz,y,s,color){
  for(let x=cx-rx;x<=cx+rx;x+=s) for(let z=cz-rz;z<=cz+rz;z+=s) block(x,y,z,s,s,s,color);
}
function blob(cx,cy,cz,r,color,jitter=0.5){
  const r2=r*r;
  for(let x=Math.floor(cx-r);x<=Math.ceil(cx+r);x++)
   for(let y=Math.floor(cy-r);y<=Math.ceil(cy+r);y++)
    for(let z=Math.floor(cz-r);z<=Math.ceil(cz+r);z++){
      const dx=x-cx+(Math.random()-0.5)*jitter, dy=y-cy+(Math.random()-0.5)*jitter, dz=z-cz+(Math.random()-0.5)*jitter;
      if(dx*dx+dy*dy+dz*dz<=r2) block(x,y,z,1,1,1,color);
    }
}
function pillar(cx,cz,y0,y1,s,color){ vlineV(cx,cz,y0,y1,s,color); }
function eave(cx,cz,y,half,up,ringS,upS){
  for(let r=0;r<=half;r++){ const w=r*2+1;
    if(r<half) block(cx,y,cz-1.5-r,w,1,w,C.eave);
    else block(cx,y,cz-1.5-half,upS,1,upS,C.eave);
    lineV(cx-1.5-r,cz-1.5-half,cx+1.5-r,cz-1.5-half,y,ringS,C.eave);
    if(r<half) block(cx,y,cz+1.5+r,w,1,w,C.eave);
    else block(cx,y,cz+1.5+half,upS,1,upS,C.eave);
    lineV(cx-1.5-r,cz+1.5+half,cx+1.5-r,cz+1.5+half,y,ringS,C.eave);
    if(r<half) block(cx-1.5-r,y,cz,w,1,w,C.eave);
    else block(cx-1.5-half,y,cz,upS,1,upS,C.eave);
    if(r<half) block(cx+1.5+r,y,cz,w,1,w,C.eave);
    else block(cx+1.5+half,y,cz,upS,1,upS,C.eave);
  }
}
function beam(cx0,cz0,cx1,cz1,y,s,color){ lineV(cx0,cz0,cx1,cz1,y,s,color); }
function frame(cx,cz,r,y,s,color){
  lineV(cx-r,cz,cx+r,cz,y,s,color); lineV(cx-r,cz,cx+r,cz,y,s,color);
  lineV(cx,cz-r,cx,cz+r,y,s,color); lineV(cx,cz-r,cx,cz+r,y,s,color);
}
function lattice(cx,cz,r,y,s,color){
  const k=(r*2+1)/4;
  for(let x=cx-r+k;x<=cx+r-k;x+=k) lineV(x,cz-r,x,cz+r,y,s,color);
  for(let z=cz-r+k;z<=cz+r-k;z+=k) lineV(cx-r,z,cx+r,z,y,s,color);
}
function finial(cx,cz,y){
  block(cx,y+0.5,cz,1,1,1,C.gold);
  vlineV(cx,cz,y+1,y+3,1,C.gold);
  for(let i=0;i<3;i++){ const rr=1-i*0.35; ring(cx,cz,rr,rr*0.5,y+1+i*0.8,1,C.gold); }
  vlineV(cx,cz,y+4,y+6,1,C.gold);
  block(cx,y+6.5,cz,1,1,1,C.gold);
}

/* ---------------- sky + ground ---------------- */
function buildSky(){
  const g=new THREE.SphereGeometry(240,32,16);
  const pos=g.attributes.position, col=[];
  const grad=[[0,C.sky1],[0.22,C.sky2],[0.45,C.sky3],[0.66,C.sky4],[1,C.sky5]].map(([s,c])=>[s,new THREE.Color(c)]);
  const v=new THREE.Vector3();
  for(let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos,i).normalize();
    const t=THREE.MathUtils.clamp((v.y+0.15)/1.15,0,1);
    let c=grad[0][1].clone();
    for(let k=0;k<grad.length-1;k++){ if(t>=grad[k][0]&&t<=grad[k+1][0]){
      const f=(t-grad[k][0])/(grad[k+1][0]-grad[k][0]); c=grad[k][1].clone().lerp(grad[k+1][1],f); break; } }
    col.push(c.r,c.g,c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  const sky=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false}));
  scene.add(sky);
}
function buildGround(){
  for(let x=-34;x<=34;x++) for(let z=-34;z<=34;z++){
    const r=Math.hypot(x,z);
    let c;
    if(x>=-3&&x<=3){ c=(z<=-15&&z>=-20)?C.pathD:C.path; if((x+z)%2===0) c=C.pathL; }
    else if(z>=-18&&z<=-23&&Math.abs(x)<=9){ c=(x+z)%2?C.pathD:C.path; }
    else if(r>30) c=Math.random()<0.5?C.grass2:C.grass3;
    else c=Math.random()<0.8?C.grass:C.grass2;
    voxel(x,0,z,1,1,1,c,{cast:false});
  }
}

/* ---------------- stone platform ---------------- */
function buildPlatform(){
  for(let y=0;y<=2;y++){
    const r=12-y;
    for(let x=-r;x<=r;x++) for(let z=-r;z<=r;z++){
      if(Math.hypot(x,z)>r+0.4) continue;
      const edge=Math.hypot(x,z)>r-1.4;
      let c=edge?C.stoneD:C.stone;
      if((x+z)%2===0 && !edge) c=C.stoneL;
      voxel(x,y,z,1,1,1,c,{cast:false});
    }
  }
  // stairs to the front (south, +z)
  for(let z=13;z<=15;z++) for(let x=-3;x<=3;x++) voxel(x,2,z,1,1,1,C.stoneL,{cast:false});
  // corner accent
  for(const [sx,sz] of [[12,12],[12,-12],[-12,12],[-12,-12]]) block(sx,3,sz,1,1,1,C.stoneL);
}

/* ---------------- pagoda ---------------- */
function buildPagoda(){
  const floors=[{y:3,h:3,wall:4,trim:5,eave:6},{y:8,h:3,wall:3,trim:4,eave:5},
    {y:13,h:3,wall:3,trim:4,eave:5},{y:18,h:3,wall:2,trim:3,eave:4},{y:23,h:3,wall:2,trim:3,eave:4}];
  floors.forEach((f,i)=>{
    const col=C['tr'+(i+1)];
    box(0,f.y,0,f.wall*2+1,1,f.wall*2+1,C.base);
    box(0,f.y+1,0,f.wall*2,f.h-1,f.wall*2,col);
    // corners
    for(const [sx,sz] of [[1,1],[1,-1],[-1,1],[-1,-1]]) pillar(f.wall-1, sz*(f.wall-1), f.y+1, f.y+f.h-1, 1, C.trim);
    // lintel band + trim
    box(0,f.y+f.h,0,f.trim*2+1,1,f.trim*2+1,C.beam);
    frame(0,0,f.trim,f.y+f.h,1,C.gold);
    // windows (warm emissive)
    const lit = Math.random()<0.5 ? 0x3a2410 : 0x140c06;
    const win=()=>{ for(let yy=0;yy<2;yy++) for(let zz=0;zz<2;zz++)
      voxel(0,f.y+2+yy,f.wall-1-1+zz,1,1,1,0x2a1c10,{emissive:lit,emissiveIntensity:0.9,cast:false}); };
    win();
    for(const [fx,fz] of [[0,-(f.wall-1)],[0,f.wall-1],[f.wall-1,0],[-(f.wall-1),0]])
      for(let yy=0;yy<2;yy++) for(let zz=0;zz<2;zz++)
        voxel(fx, f.y+2+yy, fz, 1,1,1, 0x2a1c10, {emissive:lit,emissiveIntensity:0.9,cast:false});
    // eave + upturned tips
    eave(0,0,f.y+f.h+1,f.eave,2,1,2);
    for(const [ax,az] of [[f.eave,f.eave],[f.eave,-f.eave],[-f.eave,f.eave],[-f.eave,-f.eave]])
      block(ax,f.y+f.h+2,az,1,1,1,C.trim);
  });
  // roof + spire
  box(0,27,0,3,1,3,C.beam);
  box(0,28,0,1,1,1,C.beam);
  vlineV(0,0,29,30,1,C.beam);
  finial(0,0,31);
}

/* ---------------- torii gate ---------------- */
function buildTorii(){
  const y=2;
  for(const x of [-4,4]) pillar(x,0,y,y+7,1,C.torii);
  vlineV(-4,0,y+7,y+7,1,C.toriiD);
  hlineV(y+7,0,-5,5,1,C.torii);
  hlineV(y+8,0,-6,6,1,C.torii);
  for(const x of [-6,6]) vlineV(x,0,y+8,y+9,1,C.torii);
  hlineV(y+9,0,-6,6,1,C.toriiD);
  for(const x of [-6,6]) block(x,y+10,0,1,1,1,C.toriiD);
  hlineV(y+6,0,-3,3,1,C.toriiD);
  block(0,y+7,0,1,1,1,C.toriiD);
  // foot stones
  for(const x of [-4,4]) for(let z=-1;z<=1;z++) voxel(x,y,z,1,1,1,C.stoneD,{cast:false});
}

/* ---------------- cherry trees ---------------- */
function buildTree(cx,cz,sc,colIdx){
  for(let y=0;y<10*sc;y++) pillar(cx,cz,y+1,y+1,1,C['tr'+colIdx]);
  for(let b=0;b<3;b++){
    const ang=b*2.1+cx; const lx=cx+Math.cos(ang)*3*sc, lz=cz+Math.sin(ang)*3*sc;
    lineV(cx,cz+0.5*sc,lx,lz+0.5*sc,5*sc+b,1,C['tr'+colIdx]);
  }
  const cols=[C.leaf,C.leaf2,C.leaf3,C.leaf4,C.leaf5];
  const clusters=[[0,9*sc,0,3.2*sc],[3*sc,8*sc,1,2.4*sc],[-3*sc,8*sc,-1,2.4*sc],
    [1,9*sc,3*sc,2.3*sc],[-1,9*sc,-3*sc,2.3*sc],[0,11*sc,0,2.5*sc]];
  clusters.forEach((cl,i)=>{
    blob(cl[0]+cx,cl[1]+cz,cl[2]+cz,cl[3],cols[i%cols.length],0.7);
    blob(cl[0]+cx,cl[1]+cz,cl[2]+cz,cl[3]*0.6,C.leaf5,0.6);
  });
}

/* ---------------- pond ---------------- */
const waterMats=[];
function buildPond(){
  const cx=7,cz=10;
  // dark bed
  for(let x=cx-6;x<=cx+6;x++) for(let z=cz-5;z<=cz+5;z++)
    if(Math.hypot(x-cx,(z-cz)*1.25)<5.8) voxel(x,0,z,1,1,1,C.waterD,{cast:false});
  // water surface (animated)
  for(let x=cx-6;x<=cx+6;x++) for(let z=cz-5;z<=cz+5;z++){
    if(Math.hypot(x-cx,(z-cz)*1.25)<5.5){
      const ph=Math.random()*6.28;
      const m=new THREE.MeshLambertMaterial({color:C.water,transparent:true,opacity:0.92,
        emissive:0x0a2a30,emissiveIntensity:0.4});
      const w=new THREE.Mesh(new THREE.BoxGeometry(1,0.5,1),m);
      w.position.set(x,0.6,z); w.receiveShadow=true;
      scene.add(w); waterMats.push({m,ph});
    }
  }
  // stone rim
  for(let a=0;a<360;a+=8){ const r=5.5, x=cx+Math.cos(a*Math.PI/180)*r, z=cz+Math.sin(a*Math.PI/180)*r*0.8;
    block(Math.round(x),1,Math.round(z),1,1,1,C.stone); }
  // lotus pads
  for(let i=0;i<5;i++){ const a=Math.random()*6.28, rr=Math.random()*3;
    block(cx+Math.cos(a)*rr,0.8,cz+Math.sin(a)*rr*0.8,1,0.4,1,C.pine); }
  block(cx+1,1.2,cz+0.5,1,0.8,1,C.leaf5);
}

/* ---------------- lanterns + shrubs ---------------- */
function lantern(cx,cz){
  box(cx,2,cz,2,1,2,C.stoneD);
  pillar(cx,cz,3,5,1,C.stone);
  box(cx,6,cz,2,2,2,C.stoneL);
  voxel(cx,6,cz,1,1,1,0x3a2410,{emissive:0x2a1c10,emissiveIntensity:0.8,cast:false});
  box(cx,7,cz,2,1,2,C.stoneD);
  voxel(cx,7.6,cz,1,1,1,C.stoneD);
}
function shrub(cx,cz){ blob(cx,3,cz,2,C.pine,0.6); blob(cx,4,cz,1.4,C.pine2,0.5); }

/* ---------------- petals ---------------- */
const petalMat = new THREE.MeshLambertMaterial({color:C.petal,transparent:true,opacity:0.95,
  side:THREE.DoubleSide,emissive:0x602030,emissiveIntensity:0.25});
const petals=[];
function buildPetals(){
  const geo=new THREE.PlaneGeometry(0.4,0.3);
  for(let i=0;i<70;i++){
    const m=new THREE.Mesh(geo,petalMat);
    m.castShadow=false;
    const t={m, x:(Math.random()-0.5)*46, y:6+Math.random()*14, z:(Math.random()-0.5)*46,
      vx:(Math.random()-0.5)*0.4, vy:-(0.4+Math.random()*0.5), vz:(Math.random()-0.5)*0.4,
      sway:Math.random()*6.28, spin:Math.random()*3, phase:Math.random()*6.28};
    scene.add(m); petals.push(t);
  }
}
function updatePetals(dt,t){
  for(const p of petals){
    p.sway+=dt*1.5;
    p.x+=p.vx*dt+Math.sin(p.sway)*0.4*dt;
    p.z+=p.vz*dt+Math.cos(p.sway*0.8)*0.4*dt;
    p.y+=p.vy*dt;
    p.m.rotation.x+=p.spin*dt; p.m.rotation.y+=p.spin*0.7*dt;
    if(p.y<0.2){ p.y=16+Math.random()*6; p.x=(Math.random()-0.5)*46; p.z=(Math.random()-0.5)*46; }
    p.m.position.set(p.x,p.y,p.z);
  }
}

/* ---------------- lights ---------------- */
function buildLights(){
  scene.add(new THREE.HemisphereLight(0xffe0d0,0x5a4a3a,0.55));
  const sun=new THREE.DirectionalLight(0xffd9a8,1.35);
  sun.position.set(34,42,20);
  sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.near=1; sun.shadow.camera.far=130;
  const d=42;
  sun.shadow.camera.left=-d; sun.shadow.camera.right=d;
  sun.shadow.camera.top=d; sun.shadow.camera.bottom=-d;
  sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.02;
  sun.target.position.set(0,6,0);
  scene.add(sun); scene.add(sun.target);
  const fill=new THREE.DirectionalLight(0x9ab6d6,0.25); fill.position.set(-20,15,-25); scene.add(fill);
}

/* ---------------- build ---------------- */
buildSky();
buildGround();
buildPlatform();
buildPagoda();
buildTorii();
buildTree(-14,2,1.2,1);
buildTree(13,-6,1.0,2);
buildTree(-9,-11,0.9,3);
buildTree(15,8,0.85,4);
buildPond();
lantern(-6,-6); lantern(6,-6);
shrub(-7,6); shrub(9,-3); shrub(-12,-3);

/* ---------------- UI ---------------- */
let wind=0;
const btnOrbit=document.getElementById('btnOrbit');
const btnWind=document.getElementById('btnWind');
btnOrbit.onclick=()=>{ controls.autoRotate=!controls.autoRotate;
  btnOrbit.textContent='◐ Orbit: '+(controls.autoRotate?'On':'Off');
  btnOrbit.classList.toggle('on',controls.autoRotate); };
btnWind.onclick=()=>{ wind=wind===0?1:0;
  btnWind.textContent='❀ Wind: '+(wind?'Breezy':'Calm');
  btnWind.classList.toggle('on',wind===1); };

/* ---------------- loop ---------------- */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  const ws=wind?1.6:1;
  controls.autoRotateSpeed=0.45*ws;
  controls.update();
  updatePetals(dt*ws,t);
  for(const w of waterMats){
    w.m.emissiveIntensity=0.35+Math.sin(t*1.5+w.ph)*0.15;
    w.m.opacity=0.86+Math.sin(t*2+w.ph)*0.06;
  }
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
