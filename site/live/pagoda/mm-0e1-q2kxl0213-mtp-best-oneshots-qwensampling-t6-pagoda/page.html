<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>五重塔 — Voxel Pagoda at Dusk</title>
<style>
  :root{
    --ink:#f3ece0; --dim:#b7a99a; --red:#d1382a; --red-d:#8d231b; --gold:#d8ac55;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Songti SC",Georgia,"Times New Roman",serif;
    --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#080a11;color:var(--ink);font-family:var(--sans)}
  canvas{display:block;position:fixed;inset:0}
  .vig{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(125% 95% at 52% 38%,transparent 42%,rgba(6,8,14,.55) 100%)}
  .vig:after{content:"";position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;
    background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
  #ui{position:fixed;inset:0;z-index:5;pointer-events:none}

  /* ── title column ─────────────────────────────────── */
  .title{position:absolute;top:clamp(18px,3.4vh,34px);left:clamp(18px,3vw,46px);
    display:flex;gap:14px;align-items:flex-start}
  .title .rule{width:2px;height:0;background:linear-gradient(180deg,var(--red),rgba(209,56,42,.05));
    animation:rule 1.4s .5s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rule{to{height:min(52vh,430px)}}
  .vert{writing-mode:vertical-rl;text-orientation:mixed;font-family:var(--mincho);
    font-weight:600;font-size:clamp(30px,4.6vw,62px);line-height:1;letter-spacing:.26em;
    text-shadow:0 3px 26px rgba(0,0,0,.65)}
  .vert span{display:inline-block;opacity:0;transform:translateY(16px);
    animation:rise .85s cubic-bezier(.2,.85,.25,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .sub{margin-top:18px;writing-mode:vertical-rl;font-size:10px;letter-spacing:.42em;
    color:var(--dim);text-transform:uppercase;opacity:0;animation:rise 1s 1.15s forwards}

  .seal{position:absolute;top:clamp(18px,3.4vh,34px);right:clamp(18px,3vw,42px);
    width:64px;height:64px;background:linear-gradient(160deg,#c9372b,#8f231c);
    border-radius:3px;display:grid;place-items:center;font-family:var(--mincho);
    font-size:33px;color:#fdf3ea;transform:rotate(3deg);
    box-shadow:0 10px 28px rgba(120,20,14,.45),inset 0 0 0 1px rgba(255,255,255,.18);
    opacity:0;animation:stamp .7s 1.5s cubic-bezier(.2,1.5,.4,1) forwards}
  @keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(1.5)}to{opacity:1;transform:rotate(3deg)}}

  /* ── panels ───────────────────────────────────────── */
  .panel{position:absolute;bottom:clamp(16px,3vh,30px);background:rgba(10,13,20,.56);
    border:1px solid rgba(255,255,255,.10);border-radius:3px;backdrop-filter:blur(7px);
    padding:14px 16px;opacity:0;transform:translateY(14px);
    animation:rise .9s 1.85s cubic-bezier(.2,.8,.2,1) forwards}
  .panel .lbl{font-size:9px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
  .controls{left:clamp(18px,3vw,46px);display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end;pointer-events:auto}
  .btns{display:flex;gap:8px}
  button{font-family:var(--mincho);font-size:17px;color:var(--ink);cursor:pointer;
    width:56px;height:56px;border-radius:3px;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.14);transition:.25s cubic-bezier(.2,.8,.2,1);
    display:grid;place-items:center;line-height:1}
  button em{display:block;font-family:var(--sans);font-style:normal;font-size:8px;letter-spacing:.2em;
    color:var(--dim);margin-top:4px}
  button:hover{transform:translateY(-3px);border-color:rgba(209,56,42,.75);background:rgba(209,56,42,.14)}
  button.on{background:linear-gradient(160deg,#d1382a,#8d231b);border-color:#e0563f;
    box-shadow:0 8px 22px rgba(140,26,18,.4)}
  button.on em{color:#f4d9cf}
  .wind{width:190px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:rgba(255,255,255,.2);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 0 4px rgba(216,172,85,.18);transition:.2s}
  input[type=range]::-webkit-slider-thumb:hover{box-shadow:0 0 0 7px rgba(216,172,85,.25)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--gold)}
  .ticks{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.2em;color:var(--dim);margin-top:7px}

  .stats{right:clamp(18px,3vw,42px);display:grid;grid-template-columns:auto auto;gap:5px 16px;
    font-family:var(--mincho);font-size:13px}
  .stats b{color:var(--gold);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .stats i{font-style:normal;font-family:var(--sans);font-size:9px;letter-spacing:.3em;color:var(--dim);
    text-transform:uppercase;align-self:center}
  .hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:9px;
    letter-spacing:.34em;color:rgba(243,236,224,.42);text-transform:uppercase;
    opacity:0;animation:rise 1s 2.4s forwards}

  /* ── veil ─────────────────────────────────────────── */
  #veil{position:fixed;inset:0;z-index:20;background:#0a0c13;display:grid;place-items:center;
    transition:opacity 1.1s ease}
  #veil.off{opacity:0;pointer-events:none}
  #veil .v{writing-mode:vertical-rl;font-family:var(--mincho);font-size:26px;letter-spacing:.5em;
    color:#e7dccd;animation:pulse 1.9s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  @media (max-width:760px){ .stats,.hint{display:none} .controls{gap:14px} .wind{width:130px} }
</style>
</head>
<body>

<div id="ui">
  <div class="title">
    <div class="rule"></div>
    <div>
      <h1 class="vert" id="vert">五重塔</h1>
      <div class="sub">Voxel Study · Three.js</div>
    </div>
  </div>
  <div class="seal">塔</div>

  <div class="panel controls">
    <div>
      <div class="lbl">光源 / Light</div>
      <div class="btns">
        <button data-t="day">昼<em>day</em></button>
        <button data-t="dusk" class="on">夕<em>dusk</em></button>
        <button data-t="night">夜<em>night</em></button>
      </div>
    </div>
    <div class="wind">
      <div class="lbl">花吹雪 / Wind</div>
      <input type="range" id="wind" min="0" max="100" value="34" />
      <div class="ticks"><span>静</span><span>風</span><span>嵐</span></div>
    </div>
    <div>
      <div class="lbl">視点 / Orbit</div>
      <div class="btns"><button id="spin" class="on">転<em>auto</em></button></div>
    </div>
  </div>

  <div class="panel stats">
    <i>塔高</i><b>52 m</b>
    <i>階数</i><b>5</b>
    <i>桜</i><b>6</b>
    <i>花弁</i><b id="pn">160</b>
  </div>
  <div class="hint">drag to look · scroll to zoom · keys 1 2 3</div>
</div>
<div class="vig"></div>
<div id="veil"><div class="v">構築中</div></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ══════════════════════════════════════════════════════════
   0 · helpers
   ══════════════════════════════════════════════════════════ */
let seed = 90210;
const rnd  = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const ri   = n => (rnd() * n) | 0;
const pick = a => a[ri(a.length)];
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b - a) * t;

/* every shape in the scene is a cube (BoxGeometry) */
const store = new Map();
function vox(x, y, z, c, tag = 'solid', sx = 1, sy = 1, sz = 1){
  const k = c + '|' + tag;
  let a = store.get(k); if (!a) store.set(k, a = []);
  a.push(x, y, z, sx, sy, sz);
}
/* box resting on y = y0, centred on x/z */
function stack(x, y0, z, nx, ny, nz, c, tag){ vox(x, y0 + ny / 2, z, c, tag, nx, ny, nz); }

/* ══════════════════════════════════════════════════════════
   1 · palette
   ══════════════════════════════════════════════════════════ */
const C = {
  mossD:0x466235, moss:0x55743e, mossL:0x688a49,
  gravel:0xb3ab9c, gravelD:0x9b9487, sand:0xd5c8ae, sandD:0xc0b298,
  stD:0x575c61, st:0x737a80, stL:0x909799, stP:0xa9b0b3,
  woodD:0x4a3122, wood:0x6b4530,
  red:0xb33327, redD:0x8b2620, redL:0xc94a34,
  pl:0xece2ce, plD:0xd9cdb6,
  rfD:0x2b323f, rf:0x374052, rfL:0x475265,
  gold:0xd6a54b, goldD:0xb18536,
  trunk:0x573a29, trunkD:0x422d20,
  p1:0xf7d3dd, p2:0xefbacb, p3:0xe4a2b8,
  leafD:0x2f4a2b, leaf:0x3a5c33, leafL:0x476c3c,
  water:0x2a6c86, mud:0x24312f, mudD:0x1b2523,
  dark:0x241d1a, glow:0xffdca6, koi:0xf2f2f2, koiO:0xe87a35,
};
const ROOF = [C.rfD, C.rf, C.rf, C.rfL];

/* ══════════════════════════════════════════════════════════
   2 · scene furniture
   ══════════════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xa97f63, 0.0038);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.6, 700);
const target = new THREE.Vector3(0, 20, 0);

/* sky — a giant inverted cube with a gradient + sun shader */
const skyU = {
  uZenith:{value:new THREE.Color(0x2c3d70)}, uHorizon:{value:new THREE.Color(0xf2a35c)},
  uGround:{value:new THREE.Color(0x2a2320)}, uSunDir:{value:new THREE.Vector3(0.9,0.11,-0.42)},
  uSunCol:{value:new THREE.Color(0xffb06a)}, uSunPow:{value:900}, uSunStr:{value:2.4},
};
const sky = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false, uniforms:skyU,
  vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);} `,
  fragmentShader:`
    uniform vec3 uZenith,uHorizon,uGround,uSunCol; uniform vec3 uSunDir; uniform float uSunPow,uSunStr;
    varying vec3 vP;
    void main(){
      vec3 d = normalize(vP);
      float t = smoothstep(-0.02, 0.55, d.y);
      vec3 col = mix(uHorizon, uZenith, t);
      col = mix(uGround, col, smoothstep(-0.30, -0.01, d.y));
      float s = max(dot(d, normalize(uSunDir)), 0.0);
      col += uSunCol * pow(s, uSunPow) * uSunStr;
      col += uSunCol * pow(s, 7.0) * 0.22;
      gl_FragColor = vec4(col, 1.0);
    }`
}));
sky.scale.setScalar(500); sky.renderOrder = -1; scene.add(sky);

/* lights */
const sun = new THREE.DirectionalLight(0xffd2a0, 2.7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -78; sun.shadow.camera.right = 78;
sun.shadow.camera.top  =  78; sun.shadow.camera.bottom = -78;
sun.shadow.camera.near = 1;  sun.shadow.camera.far = 340;
sun.shadow.bias = -0.0007; sun.shadow.normalBias = 0.55;
scene.add(sun, sun.target);

const hemi = new THREE.HemisphereLight(0x62799f, 0x4b4436, 0.7); scene.add(hemi);
const fill = new THREE.DirectionalLight(0x8faed4, 0.28); fill.position.set(-60, 34, 55); scene.add(fill);
const lanternLights = [];

/* ══════════════════════════════════════════════════════════
   3 · the world — all cubes
   ══════════════════════════════════════════════════════════ */
const POND = { x:32, z:17, r:9.5 }, BAY = { x:19, z:23, r:5 };
function blob(x, z){
  let hit = false;
  for (const b of [POND, BAY]){
    const dx = x-b.x, dz = z-b.z, d = Math.hypot(dx, dz);
    if (d > b.r*1.5) continue;
    const a = Math.atan2(dz, dx);
    if (d < b.r*(0.82 + 0.24*Math.sin(a*3 + b.x) + 0.13*Math.sin(a*5 + b.z))) hit = true;
  }
  return hit;
}
function pondEdge(x, z){
  if (blob(x, z)) return false;
  for (let i = 0; i < 12; i++){ const a = i/12*Math.PI*2; if (blob(x+Math.cos(a)*2.4, z+Math.sin(a)*2.4)) return true; }
  return false;
}
function onPath(x, z){ return Math.abs(x) < 4 && z > 15 && z < 35; }

/* — ground ————————————————————————————————————— */
function buildGround(){
  for (let x = -70; x < 70; x += 4) for (let z = -70; z < 70; z += 4){
    const cx = x+2, cz = z+2, d = Math.hypot(cx, cz);
    if (Math.abs(cx) < 15 && Math.abs(cz) < 15) continue;      // hidden by platform
    if (blob(cx, cz)) continue;                                 // pond hole
    let c;
    if (pondEdge(cx, cz))      c = pick([C.st, C.stD, C.stL]);
    else if (onPath(cx, cz))   c = pick([C.gravel, C.gravelD]);
    else if (d < 45)           c = pick([C.moss, C.mossL, C.moss]);
    else                       c = pick([C.mossD, C.moss, C.mossD]);
    stack(cx, -1, cz, 4, 1, 4, c);
  }
  /* stepping stones up the approach */
  for (let z = 17; z < 34; z += 3) stack(0, 0, z, 3, 0.35, 2, pick([C.stL, C.stP, C.st]), 'solid');
}

/* — stone platform + stairs ——————————————— */
function pave(cx, y, cz, w, dep, tile, cols){
  const x0 = cx - w/2, z0 = cz - dep/2;
  for (let x = x0; x < x0 + w - .01; x += tile){
    const sx = Math.min(tile, x0 + w - x);
    for (let z = z0; z < z0 + dep - .01; z += tile)
      stack(x + sx/2, y, z + sz(z, z0, dep, tile), sx, 1, sz(z, z0, dep, tile), pick(cols));
  }
}
const sz = (z, z0, dep, t) => Math.min(t, z0 + dep - z);

function buildPlatform(){
  stack(0, 0, 0, 27, 3, 27, C.stD);   pave(0, 3, 0, 27, 27, 3, [C.st, C.stD, C.stL]);
  stack(0, 4, 0, 21, 2, 21, C.st);    pave(0, 6, 0, 21, 21, 3, [C.stL, C.st, C.stP]);
  /* stairs on the south face */
  stack(0, 0, 10, 9, 5, 1, C.st); stack(0, 0, 11, 9, 4, 1, C.stL);
  stack(0, 0, 13, 9, 2, 1, C.st); stack(0, 0, 14, 9, 1, 1, C.stL);
  for (const s of [-1, 1]){
    stack(s*6, 6, 9, 2, 1, 5, C.stD);
    stack(s*6, 7, 9, 1, 1, 1, C.gold, 'gold');
    stack(s*6, 0, 12, 2, 3, 3, C.stD);
  }
  /* lanterns flanking the stairs */
  buildLantern(-15, 15); buildLantern(15, 15);
}

/* — stone lantern (tōrō) ——————————————— */
function buildLantern(x, z){
  stack(x, 0, z, 3, 1, 3, C.stD);
  stack(x, 1, z, 1, 3, 1, C.st);
  stack(x, 4, z, 3, 1, 3, C.stL);
  vox(x, 6, z, C.glow, 'glow', 2, 2, 2);
  for (const a of [-1,1]) for (const b of [-1,1]) vox(x+a, 6, z+b, C.stL, 'solid');
  stack(x, 7, z, 5, 1, 5, C.stD);
  vox(x, 8.5, z, C.stL);
  const p = new THREE.PointLight(0xffb060, 0, 26, 1.9);
  p.position.set(x, 6, z); scene.add(p); lanternLights.push(p);
}

/* — the pagoda ————————————————————————— */
function buildStoryBody(y, half, h, i){
  stack(0, y, 0, half*2+1, 1, half*2+1, C.redD);                       // base beam
  stack(0, y+1, 0, half*2-1, h-2, half*2-1, i === 0 ? C.plD : C.pl);   // plaster
  stack(0, y+h-1, 0, half*2+1, 1, half*2+1, C.red);                    // top beam
  for (const a of [-1,1]) for (const b of [-1,1])
    stack(a*half, y+1, b*half, 1, h-2, 1, C.red);                       // corner posts
  if (i === 0){
    for (const s of [-1,1]){ stack(s*3, y+1, half, 1, h-2, 1, C.red); stack(s*half, y+1, s*3, 1, h-2, 1, C.red); }
    vox(0, y+2.5, half+0.2, C.dark, 'solid', 3, 3, 1);                  // doorway
    vox(0, y+4.6, half+0.3, C.gold, 'gold', 5, 1, 1);
    for (const s of [-1,1]) vox(s*4.5, y+2.5, half+0.2, C.dark, 'solid', 1, 2, 1);
  } else {
    const n = half;
    for (const s of [-1,1]) for (let k = -n+1; k < n; k += 2)
      if (Math.abs(k) < 1.5) vox(k, y + 1 + (h-3)/2, s*(half+0.05), C.dark, 'solid', 1, 1.4, 0.9);
  }
  /* bracketing under the eaves */
  for (const a of [-1,1]) for (const b of [-1,1]) vox(a*half, y+h, b*half, C.redL);
  for (const s of [-1,1]){ vox(0, y+h, s*half, C.redL); vox(s*half, y+h, 0, C.redL); }
}

function buildEave(y, H){
  for (let k = 0; k < 3; k++){
    const h = H - k, cy = y + 0.5 + k;
    if (h > 1) vox(0, cy, 0, k === 0 ? C.woodD : ROOF[1], k === 0 ? 'solid' : 'roof', 2*h-1, 1, 2*h-1);
    for (let x = -h; x <= h; x++) for (let z = -h; z <= h; z++){
      if (Math.abs(x) !== h && Math.abs(z) !== h) continue;
      vox(x, cy, z, k === 0 ? C.red : pick(ROOF), k === 0 ? 'solid' : 'roof');
    }
  }
  for (const a of [-1,1]) for (const b of [-1,1]){
    const X = a*(H+1), Z = b*(H+1);
    vox(X, y+0.5, Z, C.rfD, 'roof');
    vox(X, y+0.5, b*H, C.redD, 'solid'); vox(a*H, y+0.5, Z, C.redD, 'solid');
    vox(X, y+1.5, Z, C.rf, 'roof');
    vox(X, y+1.5, b*H, C.rf, 'roof');    vox(a*H, y+1.5, Z, C.rf, 'roof');
    vox(X, y+2.5, Z, C.rfL, 'roof');
  }
}

function buildPagoda(){
  const halves = [6,5,4,3,2], hs = [5,4,4,3,3];
  let y = 7;
  for (let i = 0; i < 5; i++){
    buildStoryBody(y, halves[i], hs[i], i);
    y += hs[i];
    buildEave(y, halves[i] + 3);
    y += 3;
  }
  /* spire (sōrin) */
  stack(0, y, 0, 3, 1, 3, C.rfL, 'roof');
  stack(0, y+1, 0, 1, 9, 1, C.gold, 'gold');
  for (const [dy, s] of [[2,3],[4,3],[6,2],[7,2]]) stack(0, y+dy, 0, s, 1, s, C.goldD, 'gold');
  stack(0, y+10, 0, 2, 2, 2, C.gold, 'gold');
  vox(0, y+12.2, 0, C.gold, 'gold', 1, 1.4, 1);
}

/* — torii gate ————————————————————————— */
function buildTorii(x, z){
  const w = 7;
  for (const s of [-1,1]){
    stack(x+s*w, 0, z, 3, 1, 3, C.stD);
    stack(x+s*w, 1, z, 2, 1, 2, C.redD);
    stack(x+s*w, 2, z, 2, 10, 2, C.red);
  }
  stack(x, 9, z, 2*w+5, 1, 1, C.redD);
  vox(x, 11.5, z, C.red, 'solid', 1, 3, 1);
  stack(x, 12, z, 2*w+7, 1, 3, C.redD);
  stack(x, 13, z, 2*w+9, 1, 4, C.rfD, 'roof');
  for (const s of [-1,1]) vox(x+s*(w+5), 14.5, z, C.rf, 'roof', 1, 1, 4);
  vox(x, 13.5, z, C.gold, 'gold', 1, 1, 1.5);
}

/* — cherry trees ————————————————————————— */
function blobVox(bx, by, bz, r, cols){
  const n = Math.round(r);
  for (let x = -n; x <= n; x++) for (let y = -n; y <= n; y++) for (let z = -n; z <= n; z++){
    const d = Math.sqrt(x*x + y*y*1.5 + z*z);
    if (d > r + 0.4 || d < r - 1.9 || rnd() < 0.16) continue;
    vox(bx+x, by+y, bz+z, pick(cols));
  }
}
function buildSakura(x, z, s){
  let cx = x, cy = 0, cz = z;
  const H = Math.round((7 + rnd()*4) * s);
  const top = [];
  for (let i = 0; i < H; i++){
    const w = i < 2 ? 2 : 1;
    stack(cx, cy, cz, w, 1, w, i < 3 ? C.trunkD : pick([C.trunk, C.trunkD]));
    cy += 1;
    if (i > 2){ if (rnd() < .34) cx += rnd() < .5 ? -1 : 1; if (rnd() < .26) cz += rnd() < .5 ? -1 : 1; }
    if (i > H*0.45) top.push([cx, cy, cz]);
  }
  const arms = 3 + ri(3);
  for (let a = 0; a < arms; a++){
    const ang = a/arms*Math.PI*2 + rnd(), dx = Math.cos(ang), dz = Math.sin(ang);
    const o = top[top.length-1];
    let bx = o[0], by = o[1], bz = o[2];
    const len = 2 + ri(3);
    for (let i = 0; i < len; i++){
      bx += Math.sign(dx); bz += Math.sign(dz); by += i < 1 ? 1 : 0;
      vox(bx, by, bz, C.trunk);
    }
    blobVox(bx + Math.sign(dx), by + 1, bz + Math.sign(dz), 2.6 + rnd()*1.4, [C.p1, C.p2, C.p2, C.p3]);
  }
  blobVox(cx, cy + 1, cz, 3.1 + rnd()*1.2, [C.p1, C.p2, C.p3]);
  blobVox(cx + 2, cy, cz - 2, 2.4, [C.p2, C.p3, C.p1]);
}
function buildPine(x, z, s){
  stack(x, 0, z, 2, 1, 2, C.stD);
  stack(x, 1, z, 1, Math.round(4*s), 1, C.trunkD);
  const y0 = 1 + Math.round(4*s);
  for (let k = 0; k < 3; k++){
    const r = 4 - k;
    stack(x, y0 + k*2, z, r*2+1, 1, r*2+1, k === 2 ? C.leafL : pick([C.leaf, C.leafD, C.leaf]));
  }
}

/* — pond, island, rocks ————————————— */
function buildPond(){
  for (let x = 4; x < 48; x += 2) for (let z = 2; z < 36; z += 2){
    if (!blob(x, z)) continue;
    stack(x, -2.4, z, 2, 1.4, 2, pick([C.mud, C.mudD]));
    stack(x, -1.0, z, 2, 0.8, 2, pick([C.water, C.water]), 'water');
  }
  /* island */
  const ix = POND.x + 3, iz = POND.z - 3;
  stack(ix, -1.2, iz, 5, 2.2, 5, C.mud); pave(ix, 1, iz, 5, 5, 2, [C.st, C.stL]);
  buildPine(ix, iz, 0.85);
  /* rocks */
  for (let i = 0; i < 16; i++){
    const a = rnd()*Math.PI*2, r = 9 + rnd()*4;
    const rx = Math.round(POND.x + Math.cos(a)*r), rz = Math.round(POND.z + Math.sin(a)*r);
    if (blob(rx, rz)) continue;
    const s = 1 + ri(2);
    stack(rx, 0, rz, s, 0.8 + rnd()*1.4, s, pick([C.stD, C.st, C.stL]));
  }
  /* reeds */
  for (let i = 0; i < 70; i++){
    const a = rnd()*Math.PI*2, r = 10.4 + rnd()*1.6;
    const rx = POND.x + Math.cos(a)*r, rz = POND.z + Math.sin(a)*r;
    if (blob(Math.round(rx), Math.round(rz))) continue;
    vox(Math.round(rx), 1 + rnd(), Math.round(rz), pick([C.leaf, C.leafL, C.mossL]), 'solid', 0.3, 2 + rnd()*1.6, 0.3);
  }
}

/* — distant mountains & hills ————————— */
function buildHills(){
  const peaks = [[-150,-190,34,60],[120,-210,42,70],[-260,-140,28,50],[230,-160,32,58],
                 [-60,-250,50,78],[320,-230,26,44],[-330,-220,34,56]];
  peaks.forEach(([x,z,h,w], i) => {
    for (let k = 0; k < h; k += 2){
      const s = w - k * (w/h);
      vox(x, k, z, k > h*0.75 ? 0xd6dbe6 : k > h*0.55 ? pick([0x4d5b74,0x576781]) : pick([0x36455a,0x415268]), 'solid', s, 2, s);
    }
  });
  for (let i = 0; i < 26; i++){
    const a = rnd()*Math.PI*2, d = 55 + rnd()*30;
    const x = Math.cos(a)*d, z = Math.sin(a)*d;
    if (Math.abs(x) < 22 && z > -20) continue;
    const h = 3 + ri(5);
    for (let k = 0; k < h; k++) vox(Math.round(x), k, Math.round(z), pick([C.mossD, C.leafD, C.moss]), 'solid', h*2 - k*2, 1, h*2 - k*2);
  }
}

/* — clouds (cubes, drifting) ————————— */
const cloudMat = new THREE.MeshStandardMaterial({ color:0xffe9dc, roughness:1, transparent:true, opacity:.9, fog:false });
const clouds = [];
function buildClouds(){
  const g = new THREE.BoxGeometry(1,1,1);
  for (let i = 0; i < 11; i++){
    const grp = new THREE.Group();
    const n = 4 + ri(5);
    for (let j = 0; j < n; j++)
      voxAt(grp, (j-n/2)*7 + rnd()*5, rnd()*3, rnd()*9 - 4.5, 12 + rnd()*16, 3 + rnd()*3, 9 + rnd()*10);
    grp.position.set(rnd()*600 - 300, 62 + rnd()*34, rnd()*600 - 300);
    scene.add(grp); clouds.push(grp);
  }
  function voxAt(g, x, y, z, sx, sy, sz){
    const m = new THREE.Mesh(g, cloudMat);
    m.position.set(x, y, z); m.scale.set(sx, sy, sz); g.add(m);
  }
}

/* ── flush all cubes into instanced meshes ── */
buildGround(); buildPlatform(); buildPagoda(); buildTorii(0, 34);
[[-30,8],[-36,-14],[26,-22],[-17,30],[16,33],[44,26]].forEach(([x,z],i) => buildSakura(x, z, i === 0 || i === 3 ? 1.15 : 1));
[[-24,22],[46,4],[-9,-27],[10,-30],[-42,2]].forEach(p => buildPine(p[0], p[1], 1));
buildLantern(21, 27); buildLantern(-12, 27);
buildPond(); buildHills(); buildClouds();

const glowMats = [], unit = new THREE.BoxGeometry(1,1,1), dummy = new THREE.Object3D();
for (const [key, a] of store){
  const [hexS, tag] = key.split('|'), color = +hexS;
  let mat;
  if (tag === 'roof')       mat = new THREE.MeshStandardMaterial({ color, roughness:.55, metalness:.18 });
  else if (tag === 'gold')  mat = new THREE.MeshStandardMaterial({ color, roughness:.28, metalness:.85 });
  else if (tag === 'water') mat = new THREE.MeshStandardMaterial({ color, roughness:.1, metalness:.4, transparent:true, opacity:.74, depthWrite:false });
  else if (tag === 'glow')  mat = new THREE.MeshStandardMaterial({ color, emissive:new THREE.Color(0xffb257), emissiveIntensity:0, roughness:.6 });
  else                      mat = new THREE.MeshStandardMaterial({ color, roughness:.93, metalness:.02 });
  const n = a.length / 6;
  const im = new THREE.InstancedMesh(unit, mat, n);
  for (let i = 0; i < n; i++){
    dummy.position.set(a[i*6], a[i*6+1], a[i*6+2]);
    dummy.scale.set(a[i*6+3], a[i*6+4], a[i*6+5]);
    dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix);
  }
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = tag !== 'water' && tag !== 'glow';
  im.receiveShadow = tag !== 'glow';
  if (tag === 'water') im.renderOrder = 2;
  if (tag === 'glow') glowMats.push(mat);
  scene.add(im);
}

/* ══════════════════════════════════════════════════════════
   4 · living things — petals, koi, fireflies, water shimmer
   ══════════════════════════════════════════════════════════ */
const PETALS = 160;
const petalMesh = new THREE.InstancedMesh(
  new THREE.BoxGeometry(.42, .05, .3),
  new THREE.MeshStandardMaterial({ roughness:.85, metalness:0 }), PETALS);
petalMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
petalMesh.castShadow = false; scene.add(petalMesh);
const petals = [], pCols = [new THREE.Color(C.p1), new THREE.Color(C.p2), new THREE.Color(C.p3), new THREE.Color(0xfff2f5)];
const trees = [[-30,8],[-36,-14],[26,-22],[-17,30],[16,33],[44,26]];
function respawn(p, first){
  const t = trees[ri(trees.length)];
  p.x = t[0] + (rnd()-0.5)*16; p.z = t[1] + (rnd()-0.5)*16;
  p.y = first ? rnd()*46 : 40 + rnd()*14;
  p.vy = 1.4 + rnd()*1.6; p.ph = rnd()*Math.PI*2; p.sw = .5 + rnd()*1.1;
  p.rx = rnd()*Math.PI; p.rz = rnd()*Math.PI; p.sx = (rnd()-.5)*3; p.sz = (rnd()-.5)*3;
}
for (let i = 0; i < PETALS; i++){ const p = {}; respawn(p, true); petals.push(p); petalMesh.setColorAt(i, pCols[ri(4)]); }
petalMesh.instanceColor.needsUpdate = true;

const koiMat = new THREE.MeshStandardMaterial({ roughness:.6 });
const koi = [];
for (let i = 0; i < 4; i++){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.5,.4,.55), new THREE.MeshStandardMaterial({ color:i%2 ? C.koiO : C.koi, roughness:.5 }));
  const tail = new THREE.Mesh(new THREE.BoxGeometry(.5,.25,.15), body.material); tail.position.x = -.95;
  g.add(body, tail); g.position.y = -.55; scene.add(g);
  koi.push({ g, r:3 + rnd()*5, a:rnd()*Math.PI*2, sp:.22 + rnd()*.3, cx:POND.x + (rnd()-.5)*6, cz:POND.z + (rnd()-.5)*6 });
}

const fireflyMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(.2,.2,.2),
  new THREE.MeshBasicMaterial({ color:0xffe08a, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false }), 26);
fireflyMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(fireflyMesh);
const flies = []; for (let i = 0; i < 26; i++) flies.push({ x:(rnd()-.5)*90, y:1.5+rnd()*7, z:(rnd()-.5)*90, ph:rnd()*7 });

const surf = [];
for (let x = 4; x < 48; x += 2) for (let z = 2; z < 36; z += 2) if (blob(x, z)) surf.push([x, z]);
const rippleMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1,.08,1),
  new THREE.MeshStandardMaterial({ color:0xbfe6f2, transparent:true, opacity:.45, depthWrite:false, roughness:.2 }), 6);
rippleMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); rippleMesh.renderOrder = 3; scene.add(rippleMesh);
const ripples = Array.from({length:6}, () => ({ t: 99, x:POND.x, z:POND.z }));

/* ══════════════════════════════════════════════════════════
   5 · light presets
   ══════════════════════════════════════════════════════════ */
const PRE = {
  day:   { az:  .55, el: .72, sun:0xfff2dd, si:3.2, hemiS:0xa9cbe8, hemiG:0x6f7d55, hi:.95,
           fill:.34, zen:0x5f95cf, hor:0xdfeaf2, grd:0x9aa39a, sunC:0xffffff, fog:0xcfe0ea, fd:.0022,
           exp:1.0, glow:0, fly:0, cloud:.95 },
  dusk:  { az: 2.55, el: .10, sun:0xff9f57, si:2.75, hemiS:0x4d5f8f, hemiG:0x4a3d2c, hi:.7,
           fill:.26, zen:0x2a3a6d, hor:0xf2a35c, grd:0x3a2f2b, sunC:0xffb06a, fog:0xa97f63, fd:.0038,
           exp:1.15, glow:.9, fly:.85, cloud:.88 },
  night: { az: 3.6, el: .28, sun:0x9fb6d8, si:.42, hemiS:0x27354f, hemiG:0x191d24, hi:.4,
           fill:.12, zen:0x080f22, hor:0x223055, grd:0x0b0d14, sunC:0x8fa8d0, fog:0x141b2b, fd:.005,
           exp:1.22, glow:1.6, fly:1, cloud:.4 },
};
const cur = JSON.parse(JSON.stringify(PRE.dusk));
const curC = { sun:new THREE.Color(cur.sun), hemiS:new THREE.Color(cur.hemiS), hemiG:new THREE.Color(cur.hemiG),
  zen:new THREE.Color(cur.zen), hor:new THREE.Color(cur.hor), grd:new THREE.Color(cur.grd),
  sunC:new THREE.Color(cur.sunC), fog:new THREE.Color(cur.fog) };
let tgt = PRE.dusk;
const tgtC = { sun:new THREE.Color(tgt.sun), hemiS:new THREE.Color(tgt.hemiS), hemiG:new THREE.Color(tgt.hemiG),
  zen:new THREE.Color(tgt.zen), hor:new THREE.Color(tgt.hor), grd:new THREE.Color(tgt.grd),
  sunC:new THREE.Color(tgt.sunC), fog:new THREE.Color(tgt.fog) };

function setPreset(k){
  tgt = PRE[k];
  tgtC.sun.set(tgt.sun); tgtC.hemiS.set(tgt.hemiS); tgtC.hemiG.set(tgt.hemiG);
  tgtC.zen.set(tgt.zen); tgtC.hor.set(tgt.hor); tgtC.grd.set(tgt.grd);
  tgtC.sunC.set(tgt.sunC); tgtC.fog.set(tgt.fog);
  document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === k));
}

/* ══════════════════════════════════════════════════════════
   6 · camera + input
   ══════════════════════════════════════════════════════════ */
let az = 2.4, el = .28, rad = 172, radT = 96, auto = true, wind = .34, idle = 0;
let dragging = false, px = 0, py = 0;
const dom = renderer.domElement;
dom.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; idle = 0; dom.setPointerCapture(e.pointerId); });
dom.addEventListener('pointermove', e => {
  if (!dragging) return;
  az -= (e.clientX - px) * .0055; el = clamp(el + (e.clientY - py) * .0038, .02, 1.12);
  px = e.clientX; py = e.clientY; idle = 0;
});
addEventListener('pointerup', () => dragging = false);
dom.addEventListener('wheel', e => { e.preventDefault(); radT = clamp(radT * (1 + e.deltaY * .0009), 44, 185); idle = 0; }, { passive:false });
addEventListener('keydown', e => { if (e.key === '1') setPreset('day'); if (e.key === '2') setPreset('dusk'); if (e.key === '3') setPreset('night'); });
document.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => setPreset(b.dataset.t)));
document.getElementById('wind').addEventListener('input', e => wind = e.target.value / 100);
document.getElementById('spin').addEventListener('click', e => { auto = !auto; e.currentTarget.classList.toggle('on', auto); });

/* title letters */
const vt = document.getElementById('vert');
vt.innerHTML = [...vt.textContent].map((ch,i) => `<span style="animation-delay:${.15 + i*.13}s">${ch}</span>`).join('');

/* ══════════════════════════════════════════════════════════
   7 · loop
   ══════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
let intro = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  idle += dt;

  /* ease light state */
  const k = 1 - Math.exp(-dt * 1.8);
  for (const p of ['si','hi','fill','fd','exp','glow','fly','cloud']) cur[p] = lerp(cur[p], tgt[p], k);
  cur.az = lerp(cur.az, tgt.az, k); cur.el = lerp(cur.el, tgt.el, k);
  curC.sun.lerp(tgtC.sun, k); curC.hemiS.lerp(tgtC.hemiS, k); curC.hemiG.lerp(tgtC.hemiG, k);
  curC.zen.lerp(tgtC.zen, k); curC.hor.lerp(tgtC.hor, k); curC.grd.lerp(tgtC.grd, k);
  curC.sunC.lerp(tgtC.sunC, k); curC.fog.lerp(tgtC.fog, k);

  const sd = new THREE.Vector3(Math.cos(cur.el) * Math.cos(cur.az), Math.sin(cur.el), Math.cos(cur.el) * Math.sin(cur.az));
  sun.position.copy(sd).multiplyScalar(150); sun.target.position.set(0, 12, 0);
  sun.color.copy(curC.sun); sun.intensity = cur.si;
  hemi.color.copy(curC.hemiS); hemi.groundColor.copy(curC.hemiG); hemi.intensity = cur.hi;
  fill.intensity = cur.fill;
  skyU.uZenith.value.copy(curC.zen); skyU.uHorizon.value.copy(curC.hor);
  skyU.uGround.value.copy(curC.grd); skyU.uSunCol.value.copy(curC.sunC);
  skyU.uSunDir.value.copy(sd); skyU.uSunPow.value = cur.el < .25 ? 320 : 1400;
  scene.fog.color.copy(curC.fog); scene.fog.density = cur.fd;
  renderer.toneMappingExposure = cur.exp;
  glowMats.forEach(m => m.emissiveIntensity = cur.glow * (1.5 + Math.sin(t*7.3)*.12 + Math.sin(t*2.1)*.08));
  lanternLights.forEach(l => l.intensity = cur.glow * 26 * (1 + Math.sin(t*5.7 + l.position.x)*.06));
  cloudMat.opacity = cur.cloud;
  fireflyMesh.material.opacity = cur.fly * .9;

  /* camera */
  if (auto && !dragging && idle > 2.2) az += dt * .062;
  rad = lerp(rad, intro < 1 ? 172 : radT, 1 - Math.exp(-dt * 1.6));
  intro = Math.min(1, intro + dt * .35);
  const e2 = el + Math.sin(t * .13) * .022;
  camera.position.set(
    target.x + rad * Math.cos(e2) * Math.cos(az),
    target.y + rad * Math.sin(e2) + 6,
    target.z + rad * Math.cos(e2) * Math.sin(az));
  target.y = lerp(target.y, 20, k);
  camera.lookAt(target);

  /* clouds drift */
  clouds.forEach((c, i) => { c.position.x += dt * (1.2 + i * .18); if (c.position.x > 320) c.position.x = -320; });

  /* petals */
  const wx = wind * 9, wz = Math.sin(t * .21) * wind * 4;
  for (let i = 0; i < PETALS; i++){
    const p = petals[i];
    p.y -= p.vy * dt * (1 + wind * .9);
    p.x += (wx + Math.sin(t * p.sw + p.ph) * 1.3) * dt;
    p.z += (wz + Math.cos(t * p.sw * .8 + p.ph) * 1.1) * dt;
    p.rx += p.sx * dt; p.rz += p.sz * dt;
    if (p.y < .1 || Math.abs(p.x) > 95 || Math.abs(p.z) > 95) respawn(p, false);
    dummy.position.set(p.x, p.y, p.z);
    dummy.rotation.set(p.rx, t * .4 + p.ph, p.rz);
    dummy.scale.setScalar(1);
    dummy.updateMatrix(); petalMesh.setMatrixAt(i, dummy.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate = true;

  /* koi */
  koi.forEach(f => {
    f.a += dt * f.sp;
    f.g.position.set(f.cx + Math.cos(f.a) * f.r, -.55 + Math.sin(t * 1.4 + f.a) * .08, f.cz + Math.sin(f.a) * f.r);
    f.g.rotation.y = -f.a + Math.PI / 2;
  });

  /* fireflies */
  flies.forEach((f, i) => {
    dummy.position.set(f.x + Math.sin(t * .7 + f.ph) * 2.2, f.y + Math.sin(t * 1.3 + f.ph) * 1.1, f.z + Math.cos(t * .55 + f.ph) * 2.2);
    dummy.scale.setScalar(.7 + Math.sin(t * 4 + f.ph) * .35);
    dummy.rotation.set(t + f.ph, t, 0); dummy.updateMatrix();
    fireflyMesh.setMatrixAt(i, dummy.matrix);
  });
  fireflyMesh.instanceMatrix.needsUpdate = true;

  /* water shimmer + ripples */
  surf.forEach(([x, z], i) => {
    if (i % 3) return;
    const b = .5 + .5 * Math.sin(t * 1.6 + x * .4 + z * .3);
    dummy.position.set(x, -.18, z);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.set(1.7 + b * .3, .05, 1.7 + b * .3);
    dummy.updateMatrix();
  });

  if (rnd() < dt * .8){ const r = ripples[ri(ripples.length)]; r.t = 0; r.x = POND.x + (rnd()-.5)*14; r.z = POND.z + (rnd()-.5)*14; }
  ripples.forEach((r, i) => {
    r.t += dt;
    const s = r.t < 3 ? r.t * 3.2 : 0;
    dummy.position.set(r.x, -.16, r.z);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.set(Math.max(s, .001), 1, Math.max(s, .001));
    dummy.updateMatrix(); rippleMesh.setMatrixAt(i, dummy.matrix);
  });
  rippleMesh.instanceMatrix.needsUpdate = true;

  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
requestAnimationFrame(() => document.getElementById('veil').classList.add('off'));
</script>
</body>
