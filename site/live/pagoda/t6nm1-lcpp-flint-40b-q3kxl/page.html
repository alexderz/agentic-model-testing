<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxel Japanese Pagoda</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #87ceeb;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 45, 100);

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      200
    );
    camera.position.set(0, 24, 36);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x8b7d6b, 0.55);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff1dd, 2.4);
    sun.position.set(12, 24, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -18;
    sun.shadow.camera.right = 18;
    sun.shadow.camera.top = 24;
    sun.shadow.camera.bottom = -12;
    sun.shadow.camera.far = 60;
    sun.shadow.bias = -0.0004;
    scene.add(sun);
    scene.add(sun.target);

    function addBox(w, h, d, color, x, y, z, rot = [0, 0, 0], cast = true) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({
        color,
        roughness: 0.92,
        metalness: 0.02
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.rotation.set(...rot);
      mesh.castShadow = cast;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function addTier(baseY, size, height, overhang, eaveH, towerColor, eaveColor) {
      addBox(size, height, size, towerColor, 0, baseY + height / 2, 0);

      addBox(
        size,
        eaveH,
        overhang,
        eaveColor,
        0,
        baseY + height + eaveH / 2,
        -size / 2 - overhang / 2,
        [0.8, 0, 0]
      );

      addBox(
        size,
        eaveH,
        overhang,
        eaveColor,
        0,
        baseY + height + eaveH / 2,
        size / 2 + overhang / 2,
        [-0.8, 0, 0]
      );
    }

    function makeCherryTree(x, z, s = 1) {
      addBox(0.7 * s, 2.2 * s, 0.7 * s, 0x6b4a2b, x, 1.2 + 1.1 * s, z);

      const pink = new THREE.MeshStandardMaterial({ color: 0xf2a0b5, roughness: 0.9 });
      const pink2 = new THREE.MeshStandardMaterial({ color: 0xe77ea0, roughness: 0.9 });

      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2;
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(1.2 * s, 1.2 * s, 1.2 * s),
          pink
        );
        mesh.position.set(
          x + Math.cos(a) * 0.9 * s,
          1.2 + 3.2 * s,
          z + Math.sin(a) * 0.9 * s
        );
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
      }

      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * Math.PI * 2 + 0.3;
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(1.2 * s, 1.2 * s, 1.2 * s),
          pink2
        );
        mesh.position.set(
          x + Math.cos(a) * 1.2 * s,
          1.2 + 4.4 * s,
          z + Math.sin(a) * 1.2 * s
        );
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
      }
    }

    // Stone platform
    addBox(22, 1.2, 20, 0x8d8a80, 0, 0.6, 0, [0, 0, 0], false);

    // Small pond
    addBox(6, 0.6, 6, 0x3f8fd0, 0, 1.5, 5, [0, 0, 0], false);

    // Five-story pagoda
    let tierBase = 1.2;
    let lastTop = 0;
    const tiers = [
      { size: 6, height: 3.2, overhang: 2.0, eaveH: 1.4, tower: 0xd8cbb8, eave: 0x8e3b3b },
      { size: 5.2, height: 3.0, overhang: 1.8, eaveH: 1.3, tower: 0xc9b8a3, eave: 0x7a2e2e },
      { size: 4.4, height: 2.8, overhang: 1.6, eaveH: 1.2, tower: 0xb9a88f, eave: 0x6b2828 },
      { size: 3.8, height: 2.6, overhang: 1.4, eaveH: 1.1, tower: 0xaa9778, eave: 0x5f2424 },
      { size: 3.0, height: 2.4, overhang: 1.2, eaveH: 1.0, tower: 0x9b8775, eave: 0x552020 }
    ];

    for (const t of tiers) {
      addTier(tierBase, t.size, t.height, t.overhang, t.eaveH, t.tower, t.eave);
      lastTop = tierBase + t.height + t.eaveH;
      tierBase = lastTop;
    }

    // Spire
    addBox(1.0, 1.4, 1.0, 0x444444, 0, lastTop + 0.7, 0);
    addBox(0.8, 1.4, 0.8, 0x555555, 0, lastTop + 2.1, 0);
    addBox(0.6, 1.4, 0.6, 0x666666, 0, lastTop + 3.5, 0);
    addBox(0.4, 1.0, 0.4, 0x777777, 0, lastTop + 4.5, 0);

    // Red torii gate
    addBox(0.7, 2.4, 0.7, 0xc23b3b, -1.1, 2.4, -6);
    addBox(0.7, 2.4, 0.7, 0xc23b3b, 1.1, 2.4, -6);
    addBox(2.2, 0.5, 0.5, 0xc23b3b, 0, 3.0, -6);
    addBox(1.8, 0.4, 0.4, 0xc23b3b, 0, 3.6, -6);

    // Cherry blossom trees
    makeCherryTree(-6, -3, 1.2);
    makeCherryTree(6, -3, 0.9);

    // Blossom petals
    const petals = [];
    const petalMat = new THREE.MeshStandardMaterial({ color: 0xf2a0b5, roughness: 0.8 });
    for (let i = 0; i < 12; i++) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.15, 0.15), petalMat);
      mesh.position.set((Math.random() - 0.5) * 14, 10 + Math.random() * 5, (Math.random() - 0.5) * 14);
      mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
      scene.add(mesh);
      petals.push({
        mesh,
        speed: 0.03 + Math.random() * 0.05,
        rotSpeed: 0.01 + Math.random() * 0.02
      });
    }

    // Camera orbit
    let rot = 0;
    const target = new THREE.Vector3(0, 8, 0);

    function animate() {
      requestAnimationFrame(animate);

      rot += 0.002;

      const radius = 30;
      const phi = 1.05;
      const theta = rot;

      const x = 0 + radius * Math.sin(phi) * Math.cos(theta);
      const z = 0 + radius * Math.sin(phi) * Math.sin(theta);
      const y = 8 + radius * Math.cos(phi);

      camera.position.set(x, y, z);
      camera.lookAt(target);

      for (let i = 0; i < petals.length; i++) {
        const p = petals[i];
        p.mesh.position.y -= p.speed;
        p.mesh.rotation.x += p.rotSpeed;
        p.mesh.rotation.y += p.rotSpeed * 0.5;

        if (p.mesh.position.y < 0.5) {
          p.mesh.position.set(
            (Math.random() - 0.5) * 14,
            10 + Math.random() * 5,
            (Math.random() - 0.5) * 14
          );
          p.mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        }
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
