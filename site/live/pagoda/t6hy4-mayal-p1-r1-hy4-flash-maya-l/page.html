<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voxel Japanese Pagoda Scene</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #bfe3ff;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfe3ff);
  scene.fog = new THREE.Fog(0xbfe3ff, 48, 105);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const camera = new THREE.PerspectiveCamera(
    48,
    window.innerWidth / window.innerHeight,
    0.1,
    200
  );
  camera.position.set(30, 22, 30);
  camera.lookAt(0, 10.5, 0);

  const clock = new THREE.Clock();

  // ---------- Lighting ----------
  const hemi = new THREE.HemisphereLight(0xeaf6ff, 0x6d8a55, 1.35);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xfff2d0, 2.2);
  sun.position.set(22, 36, 16);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -42;
  sun.shadow.camera.right = 42;
  sun.shadow.camera.top = 42;
  sun.shadow.camera.bottom = -42;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 100;
  sun.shadow.bias = -0.0003;
  sun.shadow.normalBias = 0.02;
  sun.target.position.set(0, 8, 0);
  scene.add(sun.target);
  scene.add(sun);
  sun.shadow.camera.updateProjectionMatrix();

  const fill = new THREE.DirectionalLight(0xa7c8ff, 0.45);
  fill.position.set(-20, 16, -25);
  scene.add(fill);

  // ---------- Shared cube and helpers ----------
  const cube = new THREE.BoxGeometry(1, 1, 1);

  function makeMat(color, extra = {}) {
    return new THREE.MeshStandardMaterial({
      color,
      roughness: 0.9,
      metalness: 0,
      flatShading: true,
      ...extra
    });
  }

  const mats = {
    grass: makeMat(0x83b95c),
    grassLight: makeMat(0x96c96a),
    grassDark: makeMat(0x6da64b),

    stone: makeMat(0x9a9a8f),
    stoneLight: makeMat(0xb5b5a8),
    stoneDark: makeMat(0x6e706b),

    plaster: makeMat(0xe8d9b5),
    wood: makeMat(0x7a4a2f),
    woodDark: makeMat(0x4d3021),
    window: makeMat(0x242a35, { roughness: 0.45 }),

    roof: makeMat(0x354052),
    roofEdge: makeMat(0x1d2532),
    roofAccent: makeMat(0x536178),

    gold: makeMat(0xf0c84e, { metalness: 0.45, roughness: 0.3 }),
    goldDim: makeMat(0xb98b2f, { metalness: 0.35, roughness: 0.4 }),

    red: makeMat(0xc9362f),
    redDark: makeMat(0x8f1f1d),
    black: makeMat(0x1d1d1f),

    bark: makeMat(0x6a4637),
    barkDark: makeMat(0x4e332a),

    water: makeMat(0x4aa3c7, {
      roughness: 0.18,
      metalness: 0.05,
      transparent: true,
      opacity: 0.82,
      depthWrite: false
    }),
    lily: makeMat(0x4f8a43),

    pink: makeMat(0xf2a6c2),
    pinkLight: makeMat(0xffc6da),
    pinkDark: makeMat(0xd97c9f),
    pinkWhite: makeMat(0xffe1ec)
  };

  function addBox(parent, x, y, z, sx, sy, sz, material, cast = true, receive = true) {
    const mesh = new THREE.Mesh(cube, material);
    mesh.position.set(x, y, z);
    mesh.scale.set(sx, sy, sz);
    mesh.castShadow = cast;
    mesh.receiveShadow = receive;
    parent.add(mesh);
    return mesh;
  }

  let seed = 92731;
  function rand() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  // ---------- Ground and stone platform ----------
  addBox(scene, 0, -0.5, 0, 70, 1, 56, mats.grass, false, true);

  for (let i = 0; i < 85; i++) {
    const x = (rand() - 0.5) * 66;
    const z = (rand() - 0.5) * 52;
    if (Math.abs(x) < 15 && Math.abs(z) < 14) continue;
    addBox(
      scene,
      x,
      0.04,
      z,
      1.2,
      0.08,
      1.2,
      rand() > 0.5 ? mats.grassLight : mats.grassDark,
      false,
      true
    );
  }

  addBox(scene, 0, 0.22, 0, 28, 0.85, 26, mats.stoneDark, true, true);
  addBox(scene, 0, 0.78, 0, 24, 0.65, 22, mats.stone, true, true);

  for (let x = -10; x <= 10; x += 2) {
    for (let z = -10; z <= 10; z += 2) {
      if (rand() < 0.12) continue;
      addBox(
        scene,
        x,
        1.14,
        z,
        1.86,
        0.12,
        1.86,
        rand() < 0.5 ? mats.stone : mats.stoneLight,
        false,
        true
      );
    }
  }

  // Stepping-stone path toward the torii gate
  for (let z = 13; z <= 23; z += 2) {
    for (let x = -2; x <= 2; x += 2) {
      if (Math.abs(x) > 0 && rand() < 0.14) continue;
      addBox(
        scene,
        x,
        0.08,
        z,
        1.7,
        0.16,
        1.7,
        rand() < 0.5 ? mats.stone : mats.stoneLight,
        false,
        true
      );
    }
  }

  // ---------- Pond ----------
  function buildPond(cx, cz) {
    const rx = 5;
    const rz = 4;

    for (let ix = -rx - 1; ix <= rx + 1; ix++) {
      for (let iz = -rz - 1; iz <= rz + 1; iz++) {
        const wobble = (rand() - 0.5) * 0.2;
        const d = (ix * ix) / (rx * rx) + (iz * iz) / (rz * rz) + wobble;

        if (d < 0.98) {
          addBox(scene, cx + ix, 0.07, cz + iz, 1, 0.14, 1, mats.water, false, false);
        } else if (d < 1.35) {
          addBox(
            scene,
            cx + ix,
            0.15,
            cz + iz,
            1.03,
            0.32,
            1.03,
            rand() < 0.5 ? mats.stone : mats.stoneDark,
            true,
            true
          );
        }
      }
    }

    for (let i = 0; i < 7; i++) {
      const lx = cx + Math.round((rand() - 0.5) * 2 * (rx - 1));
      const lz = cz + Math.round((rand() - 0.5) * 2 * (rz - 1));
      const d = (lx - cx) ** 2 / (rx * rx) + (lz - cz) ** 2 / (rz * rz);
      if (d < 0.7) {
        addBox(scene, lx, 0.19, lz, 0.75, 0.08, 0.75, mats.lily, false, true);
      }
    }
  }

  buildPond(18, 2);

  // ---------- Torii gate ----------
  function buildTorii(cx, cz) {
    for (const px of [cx - 3.5, cx + 3.5]) {
      addBox(scene, px, 0.35, cz, 1.5, 0.7, 1.5, mats.stoneDark, true, true);
      addBox(scene, px, 4.2, cz, 0.85, 7.7, 0.85, mats.red, true, true);
    }

    addBox(scene, cx, 6.25, cz, 9.8, 0.55, 0.72, mats.redDark, true, true);
    addBox(scene, cx, 8.05, cz, 11, 0.8, 0.92, mats.red, true, true);

    // Slightly raised ends give the torii beam an upturned silhouette.
    addBox(scene, cx - 5.15, 8.4, cz, 1.8, 0.36, 0.94, mats.red, true, true);
    addBox(scene, cx + 5.15, 8.4, cz, 1.8, 0.36, 0.94, mats.red, true, true);

    addBox(scene, cx, 8.53, cz, 11.3, 0.16, 1.02, mats.redDark, true, true);
    addBox(scene, cx, 7.18, cz, 1.15, 1.25, 0.22, mats.black, true, true);
  }

  buildTorii(0, 20);

  // ---------- Five-story pagoda ----------
  function buildRoof(roofY, bodyW) {
    const rw = bodyW + 4.0;
    const rd = rw;

    // Wooden underside and stacked tile tiers
    addBox(scene, 0, roofY - 0.08, 0, rw - 0.8, 0.28, rd - 0.8, mats.woodDark, true, true);
    addBox(scene, 0, roofY + 0.22, 0, rw, 0.38, rd, mats.roof, true, true);
    addBox(scene, 0, roofY + 0.54, 0, rw - 1.25, 0.28, rd - 1.25, mats.roofAccent, true, true);
    addBox(scene, 0, roofY + 0.82, 0, bodyW + 0.7, 0.26, bodyW + 0.7, mats.roof, true, true);

    // Dark perimeter trim
    addBox(scene, 0, roofY + 0.22, rd / 2, rw + 0.25, 0.36, 0.38, mats.roofEdge, true, true);
    addBox(scene, 0, roofY + 0.22, -rd / 2, rw + 0.25, 0.36, 0.38, mats.roofEdge, true, true);
    addBox(scene, rw / 2, roofY + 0.22, 0, 0.38, 0.36, rd + 0.25, mats.roofEdge, true, true);
    addBox(scene, -rw / 2, roofY + 0.22, 0, 0.38, 0.36, rd + 0.25, mats.roofEdge, true, true);

    // Voxel stair-step upturned corners
    for (const sx of [-1, 1]) {
      for (const sz of [-1, 1]) {
        for (let j = 0; j < 3; j++) {
          const outward = j * 0.28;
          const px = sx * (rw / 2 - 0.45 + outward);
          const pz = sz * (rd / 2 - 0.45 + outward);
          const s = 1.35 - j * 0.18;
          addBox(
            scene,
            px,
            roofY + 0.38 + j * 0.28,
            pz,
            s,
            0.28,
            s,
            j === 2 ? mats.roofAccent : mats.roofEdge,
            true,
            true
          );
        }
      }
    }
  }

  function buildSpire(baseY) {
    addBox(scene, 0, baseY + 0.05, 0, 2, 0.45, 2, mats.roofEdge, true, true);
    addBox(scene, 0, baseY + 0.4, 0, 1.4, 0.35, 1.4, mats.goldDim, true, true);
    addBox(scene, 0, baseY + 2.2, 0, 0.36, 4.2, 0.36, mats.gold, true, true);

    for (let i = 0; i < 4; i++) {
      const s = 1.35 - i * 0.18;
      addBox(scene, 0, baseY + 0.9 + i * 0.9, 0, s, 0.12, s, mats.gold, true, true);
    }

    addBox(scene, 0, baseY + 4.55, 0, 0.7, 0.7, 0.7, mats.gold, true, true);
    addBox(scene, 0, baseY + 5.1, 0, 0.4, 0.45, 0.4, mats.gold, true, true);
  }

  function buildPagoda() {
    addBox(scene, 0, 1.35, 0, 14.5, 0.5, 14.5, mats.stoneDark, true, true);
    addBox(scene, 0, 1.7, 0, 12.7, 0.35, 12.7, mats.stone, true, true);

    const storyGap = 3.85;
    const bodyH = 2.2;

    for (let i = 0; i < 5; i++) {
      const bottom = 2.05 + i * storyGap;
      const w = 9.0 - i * 1.1;
      const d = w;
      const mid = bottom + bodyH / 2;

      // Main plaster wall and wooden bands
      addBox(scene, 0, mid, 0, w, bodyH, d, mats.plaster, true, true);
      addBox(scene, 0, bottom + 0.12, 0, w + 0.6, 0.34, d + 0.6, mats.woodDark, true, true);
      addBox(scene, 0, bottom + bodyH - 0.05, 0, w + 0.65, 0.34, d + 0.65, mats.wood, true, true);

      // Corner pillars and bracket blocks
      for (const sx of [-1, 1]) {
        for (const sz of [-1, 1]) {
          addBox(
            scene,
            sx * w / 2,
            mid,
            sz * d / 2,
            0.55,
            bodyH,
            0.55,
            mats.wood,
            true,
            true
          );
          addBox(
            scene,
            sx * (w / 2 + 0.35),
            bottom + bodyH - 0.3,
            sz * (d / 2 + 0.35),
            0.6,
            0.85,
            0.6,
            mats.woodDark,
            true,
            true
          );
        }
      }

      // Dark lattice-like window panels
      const offsets = w > 5.2 ? [-w * 0.23, w * 0.23] : [0];
      const panelW = Math.min(0.95, w * 0.16);
      const panelH = 0.92;

      for (const off of offsets) {
        addBox(scene, off, mid + 0.1, d / 2 + 0.04, panelW, panelH, 0.08, mats.window, false, true);
        addBox(scene, off, mid + 0.1, -d / 2 - 0.04, panelW, panelH, 0.08, mats.window, false, true);
        addBox(scene, w / 2 + 0.04, mid + 0.1, off, 0.08, panelH, panelW, mats.window, false, true);
        addBox(scene, -w / 2 - 0.04, mid + 0.1, off, 0.08, panelH, panelW, mats.window, false, true);
      }

      if (i === 0) {
        addBox(scene, 0, bottom + 0.85, d / 2 + 0.07, 1.45, 1.65, 0.1, mats.woodDark, true, true);
        addBox(scene, 0, bottom + 0.85, d / 2 + 0.13, 0.12, 1.45, 0.04, mats.goldDim, false, true);
      }

      buildRoof(bottom + bodyH + 0.12, w);
    }

    buildSpire(20.65);
  }

  buildPagoda();

  // ---------- Cherry blossom trees ----------
  const treeAnchors = [];

  function buildCherryTree(x, z, s = 1) {
    addBox(scene, x, 0.25 * s, z, 1.5 * s, 0.5 * s, 1.5 * s, mats.barkDark, true, true);
    addBox(scene, x, 1.85 * s, z, 0.9 * s, 3.1 * s, 0.9 * s, mats.bark, true, true);
    addBox(scene, x + 0.25 * s, 3.3 * s, z - 0.1 * s, 0.7 * s, 1.0 * s, 0.7 * s, mats.bark, true, true);

    addBox(scene, x + 1.05 * s, 3.55 * s, z, 2.0 * s, 0.45 * s, 0.55 * s, mats.bark, true, true);
    addBox(scene, x - 1.05 * s, 3.75 * s, z, 2.0 * s, 0.45 * s, 0.55 * s, mats.bark, true, true);
    addBox(scene, x, 3.5 * s, z + 1.05 * s, 0.55 * s, 0.45 * s, 2.0 * s, mats.bark, true, true);
    addBox(scene, x, 3.8 * s, z - 1.05 * s, 0.55 * s, 0.45 * s, 2.0 * s, mats.bark, true, true);

    const centers = [
      [0, 5.1, 0, 2.5],
      [-2.0, 4.6, 0.4, 2.0],
      [2.1, 4.8, -0.2, 2.1],
      [0.2, 4.8, 2.1, 2.0],
      [-0.3, 5.0, -2.0, 2.0],
      [0, 6.4, 0, 1.8]
    ];

    const desired = Math.floor(58 * s);
    let placed = 0;
    let tries = 0;

    while (placed < desired && tries < desired * 6) {
      tries++;

      const c = centers[Math.floor(rand() * centers.length)];
      const rx = (rand() * 2 - 1) * c[3];
      const ry = (rand() * 2 - 1) * 1.55;
      const rz = (rand() * 2 - 1) * c[3];

      if ((rx / c[3]) ** 2 + (ry / 1.7) ** 2 + (rz / c[3]) ** 2 > 1) continue;

      const size = (0.7 + rand() * 0.8) * s;
      const pick = rand();
      const blossomMat =
        pick < 0.12 ? mats.pinkWhite :
        pick < 0.55 ? mats.pink :
        pick < 0.8 ? mats.pinkLight :
        mats.pinkDark;

      addBox(
        scene,
        x + (c[0] + rx) * s,
        (c[1] + ry) * s + 0.2,
        z + (c[2] + rz) * s,
        size,
        size * 0.78,
        size,
        blossomMat,
        true,
        true
      );

      placed++;
    }

    return { x, z, s, y: 5.7 * s };
  }

  treeAnchors.push(buildCherryTree(-17, 10, 1.0));
  treeAnchors.push(buildCherryTree(-16, -10, 1.15));
  treeAnchors.push(buildCherryTree(15, -9, 1.05));
  treeAnchors.push(buildCherryTree(20, 11, 0.95));

  // ---------- Drifting blossom petals ----------
  const petalGeo = new THREE.BoxGeometry(0.26, 0.06, 0.16);
  const petalMats = [mats.pink, mats.pinkLight, mats.pinkWhite, mats.pinkDark];
  const petals = [];

  function resetPetal(petal, initial = false) {
    const anchor = treeAnchors[Math.floor(Math.random() * treeAnchors.length)];
    petal.position.set(
      anchor.x + (Math.random() - 0.5) * 8 * anchor.s,
      initial
        ? 0.8 + Math.random() * 11
        : 5.5 * anchor.s + Math.random() * 3.5 * anchor.s,
      anchor.z + (Math.random() - 0.5) * 8 * anchor.s
    );

    petal.scale.setScalar(0.7 + Math.random() * 0.7);
    petal.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);

    petal.userData.speed = 0.25 + Math.random() * 0.45;
    petal.userData.sway = 0.35 + Math.random() * 0.9;
    petal.userData.phase = Math.random() * Math.PI * 2;
    petal.userData.spin = (Math.random() - 0.5) * 2.2;
  }

  for (let i = 0; i < 55; i++) {
    const petal = new THREE.Mesh(petalGeo, petalMats[i % petalMats.length]);
    petal.castShadow = true;
    petal.receiveShadow = false;
    scene.add(petal);
    resetPetal(petal, true);
    petals.push(petal);
  }

  // ---------- Animation ----------
  function animate() {
    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    // Slow orbit around the whole scene
    const angle = 0.65 + t * 0.075;
    const radius = 45;
    camera.position.set(
      Math.cos(angle) * radius,
      22 + Math.sin(t * 0.22) * 1.2,
      Math.sin(angle) * radius
    );
    camera.lookAt(0, 10.5, 0);

    for (const petal of petals) {
      const d = petal.userData;

      petal.position.y -= d.speed * dt;
      petal.position.x += Math.sin(t * 0.9 + d.phase) * d.sway * dt;
      petal.position.z += Math.cos(t * 0.7 + d.phase * 1.3) * d.sway * 0.6 * dt;

      petal.rotation.x += dt * (0.8 + d.spin);
      petal.rotation.z += dt * d.spin;

      const floor =
        Math.abs(petal.position.x) < 14 && Math.abs(petal.position.z) < 13
          ? 1.25
          : 0.18;

      if (
        petal.position.y < floor ||
        Math.abs(petal.position.x) > 36 ||
        Math.abs(petal.position.z) > 30
      ) {
        resetPetal(petal, false);
      }
    }

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
