<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五重塔 · A Pagoda Built From Cubes</title>
<style>
  :root{
    --jp:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Songti SC","MS PMincho",serif;
    --sans:ui-sans-serif,"Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif;
    --red:#d8442c;
    --ink:#f4efe6;
    --dim:rgba(244,239,230,.55);
    --line:rgba(244,239,230,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#141a26;color:var(--ink);font-family:var(--sans);overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  canvas.dragging{cursor:grabbing}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(115% 85% at 50% 42%,rgba(0,0,0,0) 42%,rgba(6,8,14,.55) 100%),
      linear-gradient(to bottom,rgba(6,8,14,.42),rgba(6,8,14,0) 22%,rgba(6,8,14,0) 58%,rgba(6,8,14,.55));
    mix-blend-mode:multiply}
  #grain{position:fixed;inset:0;pointer-events:none;opacity:.05;
    background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.7) 0 1px,transparent 1px 3px);}

  .ui{position:fixed;inset:0;pointer-events:none;user-select:none}
  .reveal{opacity:0;transform:translateY(14px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
  body.ready .reveal{opacity:1;transform:none}
  body.ready .d1{transition-delay:.15s} body.ready .d2{transition-delay:.3s}
  body.ready .d3{transition-delay:.45s} body.ready .d4{transition-delay:.6s} body.ready .d5{transition-delay:.75s}

  /* top-left vertical title */
  .tl{position:absolute;top:clamp(18px,3.4vw,40px);left:clamp(18px,3.4vw,44px);display:flex;gap:14px}
  .tategaki{writing-mode:vertical-rl;font-family:var(--jp);font-size:clamp(28px,4.2vw,46px);
    letter-spacing:.22em;line-height:1;text-shadow:0 2px 22px rgba(0,0,0,.6)}
  .tl .rule{width:1px;background:linear-gradient(to bottom,var(--red) 0 34%,var(--line) 34% 100%)}
  .tl .side{writing-mode:vertical-rl;font-size:10px;letter-spacing:.42em;text-transform:uppercase;
    color:var(--dim);padding-top:2px;text-shadow:0 1px 12px rgba(0,0,0,.7)}

  /* top-right readout */
  .tr{position:absolute;top:clamp(18px,3.4vw,40px);right:clamp(18px,3.4vw,44px);text-align:right}
  .season{font-family:var(--jp);font-size:clamp(30px,4.4vw,52px);line-height:1;color:#fff;
    text-shadow:0 2px 26px rgba(0,0,0,.65)}
  .clock{font-variant-numeric:tabular-nums;font-size:clamp(26px,3.4vw,40px);letter-spacing:.02em;
    margin-top:8px;text-shadow:0 2px 20px rgba(0,0,0,.6)}
  .phase{font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--dim);margin-top:8px}
  .phase b{color:var(--red);font-weight:600}

  /* bottom-left stats */
  .bl{position:absolute;left:clamp(18px,3.4vw,44px);bottom:clamp(18px,3vw,36px);display:flex;gap:clamp(16px,2.4vw,30px)}
  .stat{border-top:1px solid var(--line);padding-top:9px;min-width:74px}
  .stat b{display:block;font-size:clamp(15px,1.5vw,19px);letter-spacing:.04em;font-variant-numeric:tabular-nums}
  .stat span{display:block;font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);margin-top:5px}
  .stat.pulse b{color:#ffd9a0}

  /* bottom-right controls */
  .br{position:absolute;right:clamp(18px,3.4vw,44px);bottom:clamp(18px,3vw,36px);display:flex;
    flex-direction:column;align-items:flex-end;gap:12px;pointer-events:auto}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  button{position:relative;appearance:none;background:rgba(10,13,20,.42);color:var(--ink);
    border:1px solid var(--line);padding:9px 14px 8px;font:inherit;font-size:10px;letter-spacing:.26em;
    text-transform:uppercase;cursor:pointer;overflow:hidden;backdrop-filter:blur(7px);
    transition:border-color .25s,color .25s,transform .25s}
  button::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--red);
    transform:translateX(-101%);transition:transform .34s cubic-bezier(.2,.7,.2,1)}
  button:hover{border-color:rgba(244,239,230,.42);transform:translateY(-2px)}
  button:hover::after{transform:none}
  button.on{color:#fff}
  button.on::after{transform:none}
  button .jp{font-family:var(--jp);letter-spacing:.1em;font-size:12px;margin-right:8px;color:var(--dim)}
  button.on .jp{color:var(--red)}

  .hint{position:absolute;left:50%;bottom:clamp(18px,3vw,36px);transform:translateX(-50%);
    font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);
    transition:opacity .7s ease;text-shadow:0 1px 10px rgba(0,0,0,.7)}
  .hint.gone{opacity:0}

  #veil{position:fixed;inset:0;background:#10151e;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:20px;z-index:5;transition:opacity 1.1s ease .2s}
  #veil.gone{opacity:0;pointer-events:none}
  #veil .glyph{font-family:var(--jp);font-size:54px;letter-spacing:.3em;animation:breathe 2.4s ease-in-out infinite}
  #veil .txt{font-size:10px;letter-spacing:.44em;text-transform:uppercase;color:var(--dim)}
  @keyframes breathe{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

  @media(max-width:760px){
    .bl,.hint{display:none}
    .br{left:clamp(14px,4vw,24px);right:clamp(14px,4vw,24px);align-items:center}
    .row{justify-content:center}
    button{padding:8px 10px;letter-spacing:.18em}
  }
</style>

<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>
<div id="grain"></div>

<div class="ui">
  <div class="tl reveal d1">

    <div class="rule"></div>
    <div class="side">go­jū no tō · voxel study</div>

  <div class="tr reveal d2">
    <div class="season" id="season">春</div>

  <div class="bl reveal d4">

</div>

<div id="veil"><div class="glyph">塔</div><div class="txt">placing cubes…</div></div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';

/* ══════════════════════════════════════════════════════════════
   0 · renderer / scene / camera
   ══════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.16;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe9b583, 58, 150);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.6, 800);

/* ══════════════════════════════════════════════════════════════
   1 · voxel world — literally a Map of cubes
   ══════════════════════════════════════════════════════════════ */
const R_ISLE = 31;
const V = new Map();                       // "x,y,z" -> {c:hex, g:'solid'|'water'}
const K = (x,y,z) => x + ',' + y + ',' + z;
const has = (x,y,z) => V.has(K(x,y,z));
function put(x,y,z,c,g='solid'){
  x=Math.round(x); y=Math.round(y); z=Math.round(z);
  if (y < -9) return;
  V.set(K(x,y,z), {c, g});
}
function box(x0,y0,z0,x1,y1,z1,c,g){
  for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)
  for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)
  for(let z=Math.min(z0,z1);z<=Math.max(z0,z1);z++) put(x,y,z,c,g);
}
function shell(x0,y0,z0,x1,y1,z1,c,g){
  for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) for(let z=z0;z<=z1;z++)
    if(x===x0||x===x1||y===y0||y===y1||z===z0||z===z1) put(x,y,z,c,g);
}
function ringCells(x0,y0,z0,x1,y1,z1){
  const out=[];
  for(let x=x0;x<=x1;x++) for(let z=z0;z<=z1;z++)
    if(x===x0||x===x1||z===z0||z===z1) out.push([x,y0,z]);
  return out;
}
function hash(x,y,z){
  let h = (x|0)*374761393 + (y|0)*668265263 + (z|0)*1274133937;
  h = (h ^ (h>>13)) * 1274126177;
  return ((h ^ (h>>16)) >>> 0) / 4294967295;
}
const pick=(arr,x,y,z)=>arr[Math.floor(hash(x,y,z)*arr.length)%arr.length];

/* ── palette ──────────────────────────────────────────────── */
const GRASS  = [0x6f9a4a,0x679145,0x79a753,0x628c41];
const GRASS_HI=[0x84b25c,0x8dbb66];
const STONE  = [0x9b978e,0x8f8b83,0xa6a29a,0x86827a];
const STONE_D= [0x6e6a63,0x77736c];
const GRAVEL = [0xbdb29e,0xb1a592,0xc8bdab];
const SAND   = [0xc6b18a,0xbda881];
const MUD    = [0x4c4338,0x554b40];
const EARTH  = [0x6a5a49,0x5d5043,0x746250];
const ROCK   = [0x7b776f,0x87837b,0x6d6962];
const VERM   = [0xc33d29,0xb43625,0xcf4431];
const VERM_D = [0x8f2a1e,0xa33125];
const PLAST  = [0xe9ddc7,0xdfd3bd];
const PLAST_B= [0xf3ead8];
const TIMBER = [0x3d2f28,0x463630];
const ROOF   = [0x394554,0x323d4c,0x2d3745];
const ROOF_E = 0x252e39;
const GOLD   = [0xe4b44a,0xd2a139];
const GOLD_E = 0xffd873;
const TRUNK  = [0x513d2d,0x473527,0x5d4735];
const PINE   = [0x2f563a,0x365f41,0x294b33];
const PINK   = [0xf3bed7,0xecabd0,0xf9d7e6,0xe396bd,0xfce7ef];
const WATER_C= 0x39819f;
const GLASS  = 0xffb556;

/* ══════════════════════════════════════════════════════════════
   2 · terrain — island plateau, hills, pond
   ══════════════════════════════════════════════════════════════ */
const POND = {cx:-18, cz:11, rx:6.6, rz:5.6};
const ISLAND = new Set();
const HEIGHT = new Map();

function hillAt(x,z,cx,cz,r,a){
  const d = Math.hypot(x-cx, z-cz)/r;
  return d>=1 ? 0 : a*Math.pow(1-d*d, 1.6);
}
function pondField(x,z){
  const e = ((x-POND.cx)/POND.rx)**2 + ((z-POND.cz)/POND.rz)**2;
  const wob = (hash(x+31,0,z+7)-0.5)*0.38;
  return (1+wob) - e;
}
function terrainH(x,z){
  let h = 0;
  h += hillAt(x,z, 19,-21, 10, 6);
  h += hillAt(x,z,-23,-16,  9, 4.5);
  h += hillAt(x,z, 26, 13,  8, 3.2);
  h += hillAt(x,z,-27, 20,  7, 3.6);
  const edge = Math.min(1, Math.max(0,(Math.hypot(x,z)-12)/9));
  h += (hash(x,0,z)-0.5)*1.8*edge;
  return Math.max(0, Math.round(h));
}

for(let x=-R_ISLE; x<=R_ISLE; x++){
  for(let z=-R_ISLE; z<=R_ISLE; z++){
    const d = Math.hypot(x,z) + (hash(x+7,0,z+3)-0.5)*2.6;
    if (d > R_ISLE) continue;
    ISLAND.add(x+','+z);
    const pf = pondField(x,z);
    if (pf > 0){ HEIGHT.set(K(x,0,z), null); continue; }          // pond bowl
    const island = ((x+POND.cx)**2 + (z-POND.cz)**2) < 9.4;        // little islet
    const h = island ? 1 : terrainH(x,z);
    HEIGHT.set(K(x,0,z), h);
  }
}
const H = (x,z) => { const v = HEIGHT.get(K(x,0,z)); return v === undefined ? 0 : v; };
const onIsland = (x,z) => ISLAND.has(x+','+z);

for (const key of ISLAND){
  const [x,z] = key.split(',').map(Number);
  const dEdge = R_ISLE - Math.hypot(x,z);
  const h = HEIGHT.get(K(x,0,z));

  if (h === null){                                   // pond column
    put(x,-3,z, pick(MUD,x,-3,z));                   // soft bottom
    if (hash(x,1,z) > .93) put(x,-3,z, pick(ROCK,x,-3,z));
    put(x,-2,z, pondField(x,z) > 0.55 ? 0x463c33 : pick(STONE_D,x,-2,z));  // wall foot
    continue;
  }
  const top = h-1;
  const isPath = Math.abs(x) <= 4 && z >= 9 && z <= 21 && dEdge > 2;
  for (let y=top; y>=-7; y--){
    let c;
    if (y === top)      c = h>=4 ? pick(GRASS,x,y,z) : pick(hash(x,9,z)>.82?GRASS_HI:GRASS, x,y,z);
    else if (y > top-3) c = pick(EARTH,x,y,z);
    else                c = pick(ROCK,x,y,z);
    if (y === top && isPath && hash(x,5,z) > .28) c = pick(GRAVEL,x,y,z);
    if (y === top && pondField(x,z) > -0.55 && hash(x,11,z) > .45) c = pick(SAND,x,y,z);   // shore
    put(x,y,z,c);
  }
  // water
  if (pondField(x,z) > 0){
    put(x,-2,z, WATER_C, 'water');
    if (pondField(x,z) > 1.2 && hash(x,17,z) > .88) put(x,-2,z, 0x2c6f8d, 'water');
  }
}

/* ══════════════════════════════════════════════════════════════
   3 · stone platform + stair
   ══════════════════════════════════════════════════════════════ */
const stone = (x,y,z) => pick(hash(x,y,z)>0.5 ? STONE : STONE_D, x,y,z);
[[22,19,0],[20,17,1],[18,15,2]].forEach(([w,d,ty])=>{
  const hx=w>>1, hz=d>>1;
  for(let x=-hx;x<=hx;x++) for(let z=-hz;z<=hz;z++){
    for(let y=0;y<=ty;y++) put(x,y,z, stone(x,y,z));
    if (Math.abs(x)===hx || Math.abs(z)===hz) put(x,ty,z, pick(STONE,x,ty,z));  // kerb
  }
});
// straight stair on +z face
for(let x=-4;x<=4;x++){
  for(let y=0;y<=2;y++) for(let z=9;z<=12;z++) if (z <= 11-y) put(x,y,z, stone(x,y,z));
  put(x,2,9, pick(PLAST,x,2,9));
  put(x,1,10, pick(PLAST,x,1,10));
}
// stair cheek walls
for(const s of [-1,1]) for(let k=0;k<4;k++) for(let y=0;y<=3-k;y++){
  const x = s*5, z = 12-k;
  put(x,y,z, stone(x+k,y,z));
  put(x,3-k+1,z, pick(PLAST_B,x,3-k+1,z));
}

/* ══════════════════════════════════════════════════════════════
   4 · the five-story pagoda
   ══════════════════════════════════════════════════════════════ */
const PC = 0, PZ = 0;
const STORIES = [
  {bw:4, h:6, R:7},
  {bw:3, h:5, R:6},
  {bw:3, h:5, R:5},
  {bw:3, h:4, R:4},
  {bw:2, h:4, R:4}
];

function addRoof(cx, cz, baseY, R){
  // outer eave — one voxel thick, curling up toward the four horns
  const eave = [];
  for(let dx=-R; dx<=R; dx++) for(let dz=-R; dz<=R; dz++){
    if (Math.max(Math.abs(dx),Math.abs(dz)) !== R) continue;
    const t = Math.min(Math.abs(dx),Math.abs(dz))/R;
    eave.push([dx,dz, t>0.72 ? 2 : t>0.40 ? 1 : 0]);
  }
  for(const [dx,dz] of eave) for(let k=0;k<=2;k++) put(cx+dx, baseY-1, cz+dz, ROOF_E);  // fascia
  for(const [dx,dz,lift] of eave)
    for(let k=0;k<=lift;k++) put(cx+dx, baseY+k, cz+dz, k===lift ? ROOF_E : pick(ROOF,cx+dx,baseY+k,cz+dz));
  for(const [dx,dz,lift] of eave){                                                     // gold horns
    if (Math.abs(dx)===R && Math.abs(dz)===R) put(cx+dx, baseY+lift+1, cz+dz, GOLD_E);
    if (lift===1 && Math.abs(dx)===R) put(cx+dx, baseY+2, cz+dz, GOLD[0]);
    if (lift===1 && Math.abs(dz)===R) put(cx+dx, baseY+2, cz+dz, GOLD[0]);
  }
  // stepped tile body
  const steps = Math.floor((R-1)/2);
  for(let i=1;i<=steps;i++){
    const r = R - i*2; if (r < 0) break;
    for(let dx=-r; dx<=r; dx++) for(let dz=-r; dz<=r; dz++)
      put(cx+dx, baseY+i, cz+dz, i%2 ? pick(ROOF,cx+dx,baseY+i,cz+dz) : ROOF_E);
  }
  // ridge pole on the two longest faces
  put(cx+R, baseY, cz, GOLD[1]); put(cx-R, baseY, cz, GOLD[1]);
  put(cx, baseY, cz+R, GOLD[1]); put(cx, baseY, cz-R, GOLD[1]);
}

function addStory(cfg, base, idx, isTop){
  const {bw,h} = cfg;
  // railed gallery standing on the eave of the storey below
  if (idx > 0){
    const r = bw + 2, y = base - 1;
    for (const [x,yy,z] of ringCells(PC-r,y,PZ-r,PC+r,y,PZ+r)){
      let k = y, guard = 0;
      while (!has(x,k,z) && guard++ < 4){ put(x,k,z, TIMBER[0]); k--; }
    }
    for (const [x,,z] of ringCells(PC-r,base,PZ-r,PC+r,base,PZ+r))
      if ((Math.abs(x-PC)+Math.abs(z-PZ)) % 2 === 0) put(x,base,z, VERM_D[1]);
    for (const [x,,z] of ringCells(PC-r,base+1,PZ-r,PC+r,base+1,PZ+r)) put(x,base+1,z, VERM[1]);
  }
  const top = base + h - 1;
  for(let y=base; y<=top; y++){
    for (const [x,,z] of ringCells(PC-bw,y,PZ-bw,PC+bw,y,PZ+bw)){
      const lx = Math.abs(x-PC), lz = Math.abs(z-PZ);
      const m = Math.max(lx,lz), n = Math.min(lx,lz);
      let c;
      if (n === m)          c = VERM[0];              // corner posts
      else if (n === 0)     c = VERM[1];              // mid posts
      else if (y === top)   c = TIMBER[0];            // architrave
      else if (y === base)  c = VERM_D[0];            // sill
      else if ((n % 2) === (m % 2)) c = pick(PLAST,x,y,z);
      else                  c = hash(x,y,z) > .5 ? TIMBER[1] : PLAST_B[0];
      put(x,y,z,c);
    }
  }
  // plaster infill (hollow box)
  if (bw >= 2) shell(PC-bw+1, base+1, PZ-bw+1, PC+bw-1, top-1, PZ+bw-1, pick(PLAST,1,1,1));
  else box(PC, base+1, PZ, PC, top-1, PZ, pick(PLAST_B,3,1,3));

  // windows
  for(let i=-bw+1; i<=bw-1; i++){
    if (i === 0) continue;
    for(const [sx,sz] of [[0,1],[0,-1],[1,0],[-1,0]]){
      const j = hash(PC+i+sx*31, top, PZ+i+sz*31);
      if (j < .4) continue;
      const wx = PC + i + sx, wz = PZ + i*0 + sz;
      put(wx, top-2, PZ+sz*(bw+ (sz?1:0)) , TIMBER[0]);
      put(PC+sx*(bw+(sx?1:0)), top-2, PZ+i, TIMBER[0]);
      if (sz) put(PC+i, top-3, PZ+sz*(bw+(sz?1:0)), TIMBER[0]); else put(PC+sx*(bw+(sx?1:0)), top-3, PZ+i, TIMBER[0]);
    }
  }
  // entrance on the ground floor
  if (idx === 0){
    for(let y=base; y<=base+4; y++) for(let x=-1; x<=1; x++) put(x, y, PZ+bw+1, x===-1||x===1||y===base+4 ? VERM[0] : TIMBER[0]);
    for(let y=base; y<=base+4; y++) box(-bw,bw,-bw,bw,bw,bw, pick(PLAST,2,2,2)); // keep interior sealed
    for(let y=base; y<=base+4; y++) for(let x=-1;x<=1;x++) put(x, y, PZ+bw, TIMBER[1]);
  }
  // bracket course beneath the eaves
  const ry = base + h;
  for (const [x,,z] of ringCells(PC-bw-1, ry-1, PZ-bw-1, PC+bw+1, ry-1, PZ+bw+1)){
    const lx = Math.abs(x-PC), lz = Math.abs(z-PZ);
    if ((lx+lz) % 2 === 0) put(x, ry-1, z, VERM_D[1]);
  }
  addRoof(PC, PZ, ry, cfg.R);
  return ry + 2;
}

function cherry(x, z, h, rad, seed){
  const base = H(x,z);
  for(let i=0;i<h;i++){
    const lean = Math.round(Math.sin(i*0.62 + seed)*Math.min(2, Math.floor(i/2.6)));
    const c = i > h-2 ? 0 : lean;
    for(let dx=-1; dx<=0; dx++) for(let dz=-1; dz<=0; dz++)
      put(x+c+dx, base+i, z+c+dz, pick(TRUNK, x+c+dx, base+i, z+c+dz));
  }
  const tops = [[x+c,base+h-1,z+c]];
  for(let b=0;b<3;b++){
    const a = seed*2.2 + b*2.1;
    const ex = x + Math.round(Math.cos(a)*(rad*0.55));
    const ez = z + Math.round(Math.sin(a)*(rad*0.55));
    let yy = base+h-3;
    for(let i=0;i<4;i++){ put(x+Math.round((ex-x)*i/4), yy, z+Math.round((ez-z)*i/4), TRUNK[1]); yy++; }
    tops.push([ex, yy, ez]);
  }
  const blob = (bx,by,bz,r,strength)=>{
    for(let dx=-r-1; dx<=r+1; dx++) for(let dy=-r; dy<=r+1; dy++) for(let dz=-r-1; dz<=r+1; dz++){
      const d = Math.sqrt(dx*dx + (dy*1.25)**2 + dz*dz);
      if (d > r + (hash(bx+dx,by+dy,bz+dz)-0.5)*1.8) continue;
      if (dy < 0 && hash(bx+dx,by+dy,bz+dz) > .62) continue;
      const f = Math.max(0, 1 - d/(r+1)) * strength;
      const idx = Math.floor(hash(bx-dx*7,by+dy*13,bz+dz*3) * 6 * (1 + f));
      put(bx+dx, by+dy, bz+dz, PINK[Math.min(PINK.length-1, idx)]);
    }
  };
  blob(tops[0][0], tops[0][1]+1, tops[0][2], rad, 1.0);
  tops.slice(1).forEach(([bx,by,bz]) => blob(bx, by, bz, Math.max(2,Math.round(rad*0.66)), 0.72));
}
function pine(x, z, h){
  const base = H(x,z);
  for(let i=0;i<h;i++) put(x, base+i, z, TRUNK[2]);
  for(let k=0;k<3;k++){
    const yy = base + h - 1 + k*2;
    const r  = 4 - k;
    for(let dx=-r; dx<=r; dx++) for(let dz=-r; dz<=r; dz++){
      if (Math.abs(dx)+Math.abs(dz) > r+1) continue;
      if (hash(x+dx, yy, z+dz) > .82) continue;
      put(x+dx, yy, z+dz, pick(PINE, x+dx, yy, z+dz));
      if (Math.abs(dx)+Math.abs(dz) === r+1) put(x+dx, yy, z+dz, 0x3f6c4b);
    }
  }
  put(x, base+h+5, z, PINE[1]);
}
function lantern(x, z, scale=1){
  const b = H(x,z);
  box(x-1,b,z-1, x+1,b,z+1, pick(STONE,x,b,z));
  put(x,b+1,z, pick(STONE_D,x,b+1,z));
  for(let i=0;i<3*scale;i++) put(x, b+2+i, z, pick(STONE,x,b+2+i,z));
  const f = b+2+3*scale;
  box(x-1,f,z-1, x+1,f,z+1, pick(STONE,x,f,z));
  for(let y=f+1; y<=f+2; y++){
    for(let dx=-1; dx<=1; dx++) for(let dz=-1; dz<=1; dz++){
      if (Math.abs(dx)+Math.abs(dz) === 2) put(x+dx, y, z+dz, GLASS);
      else put(x+dx, y, z+dz, pick(STONE_D,x+dx,y,z+dz));
    }
  }
  box(x-1,f+3,z-1, x+1,f+3,z+1, pick(STONE,x,f+3,z));
  put(x-2,f+3,z-2, pick(STONE_D,x-2,f+3,z-2)); put(x+2,f+3,z-2, pick(STONE_D,x+2,f+3,z-2));
  put(x-2,f+3,z+2, pick(STONE_D,x-2,f+3,z+2)); put(x+2,f+3,z+2, pick(STONE_D,x+2,f+3,z+2));
  put(x,f+4,z, pick(STONE,x,f+4,z)); put(x,f+5,z, GLASS);
  return {x, y:f+1.6, z};
}
function rock(x,z,r){
  const b = H(x,z);
  for(let dx=-r; dx<=r; dx++) for(let dy=-1; dy<=r-1; dy++) for(let dz=-r; dz<=r; dz++){
    const d = Math.sqrt(dx*dx + (dy*1.3)**2 + dz*dz);
    if (d > r + (hash(x+dx,dy,z+dz)-0.5)) continue;
    put(x+dx, Math.max(b-1, b+dy), z+dz, pick(dy>r-2 ? STONE : ROCK, x+dx, b+dy, z+dz));
  }
}
function torii(cx, cz, half = 4, h = 9){
  const b = H(cx,cz);
  for (const s of [-1, 1]){
    const px = cx + s*half;
    box(px-1,b,cz-1, px+1,b,cz+1, pick(STONE_D,px,b,cz));       // kusabumi stone
    for(let y=b+1; y<=b+h; y++){
      const w = y <= b+1 ? 1 : 0;
      for(let dx=-1; dx<=1; dx++) for(let dz=-1; dz<=1; dz++)
        if (Math.abs(dx)+w >= 1 && Math.abs(dz)+w >= 1 && !(Math.abs(dx)===1&&Math.abs(dz)===1&&w===0&&hash(dx,y,dz)>.4))
          put(px+dx, y, cz+dz, pick(hash(px,y,cz)>.7?VERM:VERM_D, px+dx, y, cz+dz));
    }
  }
  const top = b+h+1;
  for(let dx=-half-2.6; dx<=half+2.6; dx++){
    const ax = Math.abs(dx), a = Math.round(ax);
    const lift = ax > half+2 ? 2 : ax > half+1.2 ? 1 : 0;
    for(let dz=0; dz<=1; dz++){
      put(cx+a, top+1+lift, cz+dz, ROOF_E);
      put(cx-a, top+1+lift, cz+dz, ROOF_E);
      put(cx+a, top+lift,   cz+dz, pick(ROOF,cx+a,top+lift,cz+dz));
      put(cx-a, top+lift,   cz+dz, pick(ROOF,cx-a,top+lift,cz+dz));
    }
  }
  for(let dx=-half-1; dx<=half+1; dx++) for(let dz=0; dz<=1; dz++){
    put(cx+Math.round(dx), top-2, cz+dz, VERM[1]);
    put(cx+Math.round(dx), top-1, cz+dz, VERM[0]);
  }
  put(cx, top, cz, VERM_D[0]); put(cx, top, cz+1, VERM_D[0]);
  put(cx, top-3, cz, VERM_D[1]); put(cx, top-3, cz+1, VERM_D[1]);
}

const UNIT = new THREE.BoxGeometry(1,1,1);

for (const [key,v] of V){
  const [x,y,z] = key.split(',').map(Number);
  const gk = v.g + '|' + v.c;
  if (!groups.has(gk)) groups.set(gk, []);
  groups.get(gk).push([x,y,z]);
}
const matCache = new Map();
function stdMat(c, o={}){
  const k = c + JSON.stringify(o);
  if (!matCache.has(k)) matCache.set(k, new THREE.MeshStandardMaterial({color:c, roughness:0.94, metalness:0.02, flatShading:true, ...o}));
  return matCache.get(k);
}
const dummy = new THREE.Object3D();
const waterInstances = [];
let drawCalls = 0;

for (const [gk, list] of groups){
  const [g, hex] = gk.split('|'); const c = +hex;
  let mat;
  if (g === 'water'){
    mat = new THREE.MeshStandardMaterial({color:c, transparent:true, opacity:0.82, roughness:0.12,
      metalness:0.0, depthWrite:false, flatShading:true});
  } else {
    const isGold = (c === GOLD_E || c === GOLD[0] || c === GOLD[1] || c === 0xfff0c0);
    const isGlass = c === GLASS;
    mat = stdMat(c, isGlass
      ? {emissive:GLASS, emissiveIntensity:2.6, roughness:0.5}
      : isGold ? {emissive:0x2a1e05, emissiveIntensity:1.0, metalness:0.45, roughness:0.45} : {});
  }
  const im = new THREE.InstancedMesh(g==='water' ? WAT : UNIT, mat, list.length);
  list.forEach((p,i)=>{
    dummy.position.set(p[0], g==='water' ? p[1]+0.45 : p[1]+0.5, p[2]);
    dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);
    if (g === 'water') waterInstances.push({im, i, x:p[0], z:p[2]});
  });
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = g !== 'water';
  im.receiveShadow = true;
  im.frustumCulled = false;
  if (g === 'water') im.renderOrder = 3;
  scene.add(im); drawCalls++;
}

  paintSky(mixCol(skyMat ? cTop.getHex() : tgt.top, tgt.top),
           mixCol(cHor.getHex(), tgt.hor), mixCol(cBot.getHex(), tgt.bot));
  const lamp = lerp(lampLights[0].intensity, tgt.lamp, k);
  lampLights.forEach((L,i)=>{ L.intensity = lamp * (0.82 + 0.18*Math.sin(clock*4 + i*1.7)); });
  starMat.opacity = lerp(starMat.opacity, tgt.stars, k);
  petMat.emissiveIntensity = lerp(petMat.emissiveIntensity, tgt.petE, k);
  if (composer) composer._bloom.strength = lerp(composer._bloom.strength, tgt.name==='Yoi' ? 0.55 : 0.34, k);
}

/* ══════════════════════════════════════════════════════════════
   11 · camera + interaction
   ══════════════════════════════════════════════════════════════ */
const orbit = {theta:-0.52, phi:1.22, r:148, thetaT:-0.52, phiT:0.98, rT:82};
const target = new THREE.Vector3(0, 21, 0);
let autoOrbit = true, petalsOn = true, dragging = false, lastX = 0, lastY = 0, idle = 0;
const easeIO = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
let intro = 0;

canvas.addEventListener('pointerdown', e=>{
  dragging = true; idle = 0; canvas.classList.add('dragging');
  lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId);
  document.querySelector('.hint').classList.add('gone');
});
canvas.addEventListener('pointermove', e=>{
  if (!dragging) return;
  orbit.thetaT -= (e.clientX - lastX) * 0.0055;
  orbit.phiT = Math.min(1.36, Math.max(0.22, orbit.phiT - (e.clientY - lastY) * 0.0045));
  lastX = e.clientX; lastY = e.clientY; idle = 0;
});
addEventListener('pointerup', ()=>{ dragging = false; canvas.classList.remove('dragging'); });
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  orbit.rT = Math.min(132, Math.max(46, orbit.rT * (1 + Math.sign(e.deltaY)*0.08)));
  idle = 0;
}, {passive:false});

const btns = document.querySelectorAll('#timeBtns button');
const seasonEl = document.getElementById('season'), clockEl = document.getElementById('clock'),
      phaseEl = document.getElementById('phase'), timeLabel = phaseEl.querySelector('b');
btns.forEach(b=>b.addEventListener('click', ()=>{
  btns.forEach(x=>x.classList.remove('on')); b.classList.add('on');
  tgt = PRESETS[+b.dataset.t];
  seasonEl.textContent = tgt.season;
  clockEl.textContent = tgt.time;
  clockEl.style.color = tgt.clock;
  timeLabel.textContent = tgt.name;
  phaseEl.lastChild.textContent = ' · ' + tgt.sub;
  idle = 0;
}));
document.getElementById('orbBtn').addEventListener('click', e=>{
  autoOrbit = !autoOrbit; e.currentTarget.classList.toggle('on', autoOrbit);
});
document.getElementById('petBtn').addEventListener('click', e=>{
  petalsOn = !petalsOn; petals.visible = petalsOn; e.currentTarget.classList.toggle('on', petalsOn);
});

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
});

/* ══════════════════════════════════════════════════════════════
   12 · loop
   ══════════════════════════════════════════════════════════════ */
const total = V.size;
document.getElementById('s-pet').textContent = PETALS;
let shown = 0, fpsAcc = 0, fpsN = 0, fpsT = 0;
const voxEl = document.getElementById('s-vox'), fpsEl = document.getElementById('s-fps');
setTimeout(()=>{ document.getElementById('veil').classList.add('gone'); document.body.classList.add('ready'); }, 120);
setTimeout(()=>{ document.querySelector('.hint').classList.remove('gone'); }, 1600);
setTimeout(()=>{ document.querySelector('.hint').classList.add('gone'); }, 9000);

const clock = 0.0;
let t = 0, prev = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - prev)/1000); prev = now; t += dt;
  const et = Math.min(1, t/3.4);
  orbit.rT = lerp(148, 82, easeIO(et));
  orbit.phiT = lerp(1.30, 0.95 + Math.sin(t*0.06)*0.055, easeIO(et));
  idle += dt;
  if (!dragging && autoOrbit) orbit.thetaT += dt * 0.055 * Math.min(1, idle/2.5);

  orbit.theta += (orbit.thetaT - orbit.theta) * (1 - Math.exp(-dt*4.5));
  orbit.phi   += (orbit.phiT   - orbit.phi)   * (1 - Math.exp(-dt*3.2));
  orbit.r     += (orbit.rT     - orbit.r)     * (1 - Math.exp(-dt*2.2));

  camera.position.set(
    target.x + orbit.r * Math.sin(orbit.phi) * Math.sin(orbit.theta),
    target.y + orbit.r * Math.cos(orbit.phi),
    target.z + orbit.r * Math.sin(orbit.phi) * Math.cos(orbit.theta));
  camera.lookAt(target);
  sky.position.copy(camera.position);

  /* water ripple */
  for (const w of waterInstances){
    dummy.position.set(w.x, -1.55 + Math.sin(t*1.5 + w.x*0.55 + w.z*0.42)*0.055, w.z);
    dummy.updateMatrix();
    w.im.setMatrixAt(w.i, dummy.matrix);
  }
  if (waterInstances.length) waterInstances[0].im.instanceMatrix.needsUpdate = true;
  for (let i=0;i<waterInstances.length;) waterInstances[i++].im.instanceMatrix.needsUpdate = true;

  /* fish */
  FISH.forEach((f,i)=>{
    f.a += dt*f.sp;
    const cx = POND.cx + Math.cos(f.a)*f.r*1.2, cz = POND.cz + Math.sin(f.a)*f.r;
    f.meshes.forEach((m,k)=>{
      const aa = f.a - k*0.22, wob = Math.sin(t*4 + f.wob + k*0.8)*0.16;
      m.position.set(cx + Math.cos(aa+1.57)*k*0.5 + wob, -0.55, cz + Math.sin(aa+1.57)*k*0.5);
      m.rotation.y = -aa + Math.PI/2 + wob*0.5;
    });
  });
  lilyMeshes.forEach((m,i)=>{ m.position.y = -0.16 + Math.sin(t*1.5 + i)*0.02; m.rotation.z = Math.sin(t*0.7+i)*0.03; });

  /* petals */
  if (petalsOn){
    for (let i=0;i<PETALS;i++){
      const p = P[i];
      p.y -= p.fall*dt;
      p.rx += p.rxv*dt; p.rz += p.rzv*dt;
      const px = p.x + Math.sin(t*p.freq + p.ph)*p.amp + Math.sin(t*0.15)*2.2;
      const pz = p.z + Math.cos(t*p.freq*0.8 + p.ph)*p.amp*0.7 + Math.cos(t*0.12)*1.6;
      if (p.y < 0.15 || Math.hypot(px,pz) > 33) respawn(p,false);
      dummy.position.set(px, p.y, pz);
      dummy.rotation.set(p.rx, t*0.3 + p.ph, p.rz);
      dummy.scale.setScalar(1);
      dummy.updateMatrix();
      petals.setMatrixAt(i, dummy.matrix);
    }
    petals.instanceMatrix.needsUpdate = true;
  }

  applyPreset(dt);
  if (composer) composer.render(); else renderer.render(scene, camera);

  /* readouts */
  if (shown < total){ shown = Math.min(total, shown + Math.max(40, Math.ceil(total/50))); voxEl.textContent = shown.toLocaleString(); }
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5){ fpsEl.textContent = Math.round(fpsN/fpsAcc); fpsAcc = 0; fpsN = 0; }
  requestAnimationFrame(frame);
}
paintSky(cur.top, cur.hor, cur.bot);
requestAnimationFrame(frame);
</script>
</body>
