<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>voxel pagoda</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#bcd8e8}
canvas{display:block}
</style>
<script type="importmap">
{
"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
}
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

let seed = 20260215;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0, seed / 4294967296);
const R = (a, b) => a + rnd() * (b - a);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbcd8e8);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 220);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.04;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xcfe4ee, 0x8a7a5f, 1.05);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff1d6, 2.1);
sun.position.set(14, 18, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -17, right: 17, top: 17, bottom: -17, near: 4, far: 46 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

function box(w, h, d, color, x = 0, y = 0, z = 0, o = {}) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({
      color,
      roughness: o.r ?? 0.85,
      metalness: 0,
      transparent: !!o.t,
      opacity: o.t ?? 1,
      side: o.ds ? THREE.DoubleSide : THREE.FrontSide
    })
  );
  m.position.set(x, y, z);
  m.castShadow = o.cast !== false;
  m.receiveShadow = o.recv !== false;
  return m;
}

// ---- ground ----
const ground = new THREE.Group();
ground.add(box(37.6, 0.22, 37.6, 0xc9c1b0, 0, 0.11, 0, { cast: false }));
ground.add(box(33.6, 0.55, 33.6, 0x7ea35e, 0, 0.42, 0));
scene.add(ground);

// ---- pond ----
const pond = new THREE.Group();
const water = box(8.5, 0.34, 8.5, 0x57a5d6, 0, 0.5, 0, { t: true, ds: true });
pond.add(box(9.7, 0.5, 9.7, 0x8f887c, 0, 0.32, 0, { cast: false }), water);
pond.position.set(0, 0, 8.4);
scene.add(pond);

// ---- torii ----
const torii = new THREE.Group();
const red = 0xc8341e, stonec = 0x8f887c;
for (const s of [1, -1]) {
  torii.add(box(2.0, 0.7, 2.0, stonec, s * 2.35, 0.35, 0, { cast: false }));
  torii.add(box(1.15, 5.7, 1.15, red, s * 2.35, 3.5, 0));
}
torii.add(box(5.9, 0.52, 0.62, red, 0, 4.95, 0.04));
torii.add(box(1.0, 1.02, 0.55, stonec, 0, 4.32, 0.08));
torii.add(box(6.9, 0.55, 1.22, red, 0, 5.75, 0));
torii.add(box(7.55, 0.34, 1.5, 0x453f38, 0, 6.25, 0));
torii.position.set(0, 0, 11.6);
torii.rotation.y = 0.05;
scene.add(torii);

// ---- cherry trees ----
function tree(px, pz, sc) {
  const g = new THREE.Group();
  const trk = 0x7a5a44;
  g.add(box(0.95, 2.5, 0.95, trk, 0, 1.25, 0));
  g.add(box(0.7, 0.72, 1.75, trk, 0.95, 2.35, 0.15));
  g.add(box(1.75, 0.72, 0.7, trk, -0.9, 2.9, 0.35));
  const c = [
    [0, 3.45, 0, 2.5], [1.55, 4.15, 0.5, 1.95], [-1.5, 4.0, -0.45, 2.0],
    [0.35, 4.95, 1.2, 1.8], [-0.5, 5.5, -0.95, 1.75], [0.95, 3.35, -1.25, 1.75],
    [-1.2, 2.95, 1.05, 1.55]
  ];
  for (const [x, y, z, s] of c) {
    const col = new THREE.Color(0xf2b6c4).offsetHSL(R(-0.01, 0.02), R(-0.05, 0.07), R(-0.05, 0.06));
    g.add(box(s, 0.95, s, col, x, y, z));
  }
  g.position.set(px, 0, pz);
  g.scale.setScalar(sc);
  g.rotation.y = rnd() * Math.PI * 2;
  return g;
}
for (const [x, z, s] of [[-7.6, -4.6, 1.18], [7.1, 5.4, 1.0], [-7.4, 6.2, 0.92], [5.6, -6.6, 0.8]])
  scene.add(tree(x, z, s));

// ---- pagoda ----
const pagoda = new THREE.Group();
const bodyW = [5.9, 7.05, 8.2, 9.35, 10.5];
const bodyCol = [0xb23f2a, 0xf1e7d0, 0xb23f2a, 0xf1e7d0, 0xb23f2a];

function makeRoof(w) {
  const g = new THREE.Group();
  g.add(box(w, 0.36, w, 0x37322c, 0, 0.18, 0, { cast: false }));
  const ew = w - 1.2;
  g.add(box(ew, 0.5, 0.42, 0x413a33, ew / 2, 0.42, 0));
  g.add(box(ew, 0.5, 0.42, 0x413a33, -ew / 2, 0.42, 0));
  g.add(box(0.42, 0.5, ew, 0x413a33, 0, 0.42, ew / 2));
  g.add(box(0.42, 0.5, ew, 0x413a33, 0, 0.42, -ew / 2));
  for (const sx of [1, -1])
    for (const sz of [1, -1])
      g.add(box(0.85, 0.62, 0.85, 0x4b443d, sx * (w / 2 - 0.18), 0.56, sz * (w / 2 - 0.18)));
  return g;
}

let y = 0;
for (let i = 0; i < 5; i++) {
  const w = bodyW[i];
  pagoda.add(box(w, 2.35, w, bodyCol[i], 0, y + 1.175, 0));
  if (i === 0)
    pagoda.add(box(2.4, 1.95, 0.4, 0x5a4632, 0, y + 0.98, w / 2 + 0.08, { cast: false }));
  const rf = makeRoof(w + 1.75);
  rf.position.y = y + 2.35;
  pagoda.add(rf);
  y += 2.73;
}

// spire
const spire = new THREE.Group();
const sq = [1.7, 1.42, 1.18, 0.98, 0.8, 0.64];
const sh = [0.34, 0.34, 0.32, 0.3, 0.28, 0.26];
let sy = 0;
for (let k = 0; k < 6; k++) {
  spire.add(box(sq[k], sh[k], sq[k], 0xc2a44c, 0, sy + sh[k] / 2, 0));
  sy += sh[k];
}
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(0.62, 18, 12),
  new THREE.MeshStandardMaterial({ color: 0xd9b356, roughness: 0.4 })
);
ball.castShadow = true;
ball.position.y = sy + 0.55;
spire.add(ball);
spire.position.y = y;
pagoda.add(spire);

// platform + stairs
pagoda.add(box(13.5, 0.72, 13.5, 0xa79e91, 0, 0.36, 0, { cast: false }));
pagoda.add(box(15.6, 0.83, 15.6, 0x9c9387, 0, 1.12, 0, { cast: false }));
for (let k = 0; k < 3; k++)
  pagoda.add(box(2.4 + k * 0.25, 0.27, 1.6, 0x9c9387, 0, 0.72 - k * 0.27, 7.75 + k * 1.55));
pagoda.position.y = 1.55;
scene.add(pagoda);

// ---- stone lantern ----
const lan = new THREE.Group();
lan.add(box(1.15, 0.32, 1.15, stonec, 0, 0.16, 0, { cast: false }));
lan.add(box(0.72, 1.6, 0.72, 0x6f675c, 0, 1.12, 0));
lan.add(box(1.08, 0.8, 1.08, 0xe9e1d0, 0, 2.15, 0));
lan.add(box(1.5, 0.42, 1.5, 0x3a342e, 0, 2.78, 0));
lan.position.set(3.55, 0, 10.4);
lan.rotation.y = 0.7;
scene.add(lan);

// ---- petals ----
const petGeo = new THREE.BoxGeometry(0.3, 0.05, 0.3);
const petals = [];
for (let i = 0; i < 92; i++) {
  const m = new THREE.Mesh(petGeo, new THREE.MeshStandardMaterial({
    color: 0xf7c9d6, roughness: 0.7, side: THREE.DoubleSide
  }));
  m.castShadow = true;
  m.position.set(R(-16, 16), R(6, 20), R(-16, 16));
  scene.add(m);
  const d = { m, x0: m.position.x, z0: m.position.z, y: m.position.y,
    sp: R(0.7, 1.25), ph: rnd() * 6.283, rx: R(0.4, 1.1), ry: R(0.5, 1.5) };
  d.x = d.x0; d.z = d.z0;
  petals.push(d);
}

// ---- animate ----
const clock = new THREE.Clock();
const target = new THREE.Vector3(0, 3.3, 0.6);
const RADIUS = 25.5;

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  for (const p of petals) {
    p.y -= 1.05 * p.sp * dt;
    if (p.y < -0.2) { p.y += 14; p.x0 = R(-16, 16); p.z0 = R(-16, 16); p.x = p.x0; p.z = p.z0; }
    p.m.position.set(
      p.x0 + Math.sin(t * p.sp + p.ph) * 1.1,
      p.y,
      p.z0 + Math.cos(t * 0.8 * p.sp + p.ph * 1.3) * 0.8
    );
    p.m.rotation.set(t * p.rx, t * p.ry, 0);
  }

  water.position.y = 0.5 + 0.05 * Math.sin(t * 2.1);
  water.rotation.y = t * 0.35;

  const th = t * 0.24;
  camera.position.set(
    Math.sin(th) * RADIUS,
    10.6 + Math.sin(t * 0.7) * 0.15,
    Math.cos(th) * RADIUS
  );
  camera.lookAt(target);

  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
