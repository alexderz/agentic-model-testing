<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel Japanese Pagoda</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #8fb3d1; }
  #c { display: block; width: 100%; height: 100%; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';

/* ================= palette ================= */
const C = {
  grassA: 0x6d9a4a, grassB: 0x78a455,
  stoneDark: 0x71767f, stone: 0x8d929b, stoneLight: 0x9ba0aa, stonePale: 0xa7adb7,
  wall: 0xf3ecd9,
  red: 0x9c2b22, redDark: 0x7e211a,
  roof: 0x2c313d,
  woodDark: 0x453026, wood: 0x6e4a33,
  torii: 0xc23a2b, kasagi: 0x30353f, shimaki: 0x23262e, plaque: 0xefe6cf,
  gold: 0xd9a63c, bronze: 0x6b5834,
  trunk: 0x59403a,
  pinkA: 0xf87fb0, pinkB: 0xfba6d0, pinkC: 0xe85d9a, pinkD: 0xfdc0de,
  water: 0x4477a8, waterDeep: 0x2e5170,
  lily: 0x59904a,
  petal: 0xf86fa8,
  path: 0x9b9da0,
  cloud: 0xf4f9ff,
};

/* ================= renderer / scene ================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb3d1);
scene.fog = new THREE.Fog(0x8fb3d1, 150, 360);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 700);
const LOOK = new THREE.Vector3(0, 20, 0);

/* ================= lights ================= */
const hemi = new THREE.HemisphereLight(0xe8e2d4, 0x515b3c, 1.7);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff1d8, 2.2);
sun.position.set(60, 90, 40);
sun.target.position.set(0, 10, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -75;
sun.shadow.camera.right = 75;
sun.shadow.camera.top = 85;
sun.shadow.camera.bottom = -55;
sun.shadow.camera.near = 20;
sun.shadow.camera.far = 280;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.06;
scene.add(sun);
scene.add(sun.target);

const fill = new THREE.DirectionalLight(0xbcd3e8, 0.4);
fill.position.set(-50, 35, -60);
scene.add(fill);

/* ================= voxel batcher ================= */
const boxList = new Map(); // color -> [ [x,y,z,sx,sy,sz,rx,ry,rz], ... ]
function V(x, y, z, sx, sy, sz, color, rx = 0, ry = 0, rz = 0) {
  let arr = boxList.get(color);
  if (!arr) { arr = []; boxList.set(color, arr); }
  arr.push([x, y, z, sx, sy, sz, rx, ry, rz]);
}
function buildVoxels() {
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const M = new THREE.Matrix4(), P = new THREE.Vector3(), Q = new THREE.Quaternion(),
        S = new THREE.Vector3(), E = new THREE.Euler();
  for (const [color, list] of boxList) {
    const mat = new THREE.MeshLambertMaterial({ color });
    const im = new THREE.InstancedMesh(geo, mat, list.length);
    for (let i = 0; i < list.length; i++) {
      const b = list[i];
      P.set(b[0], b[1], b[2]);
      S.set(b[3], b[4], b[5]);
      E.set(b[6], b[7], b[8]);
      Q.setFromEuler(E);
      M.compose(P, Q, S);
      im.setMatrixAt(i, M);
    }
    im.instanceMatrix.needsUpdate = true;
    const isCloud = (color === C.cloud);
    im.castShadow = !isCloud;
    im.receiveShadow = true;
    im.frustumCulled = false;
    scene.add(im);
  }
  boxList.clear();
}
const rand = (a, b) => a + Math.random() * (b - a);

/* ================= ground ================= */
V(0, -0.5, 0, 240, 1, 240, C.grassA);
for (let i = 0; i < 90; i++) {
  const x = rand(-46, 46), z = rand(-46, 46);
  if (Math.hypot(x, z) < 17 || Math.abs(x) < 4.5) continue;
  if (Math.hypot(x + 15, z - 14) < 8.5) continue;
  const s = rand(1.5, 4.5);
  V(x, 0.03, z, s, 0.06, s, Math.random() < 0.5 ? C.grassB : C.grassA);
}

/* ================= stone platform + steps ================= */
V(0, 0.5, 0, 30, 1, 30, C.stoneDark);
V(0, 1.5, 0, 24, 1, 24, C.stone);
V(0, 2.5, 0, 18, 1, 18, C.stoneLight);

/* ================= five-story pagoda ================= */
// square ring of unit cubes, outer face at +-H, base level y (1 unit tall).
// lift: null = none; 'wide' = corner + 1 adjacent cell each side gets +1; 'corner' = only the corner cell gets +1
function eaveRing(H, y, color, lift) {
  const c = Math.round(H - 0.5);
  const cells = [];
  for (let x = -c; x <= c; x++) { cells.push([x, c], [x, -c]); }
  for (let z = -c + 1; z <= c - 1; z++) { cells.push([c, z], [-c, z]); }
  for (const [px, pz] of cells) {
    V(px, y, pz, 1, 1, 1, color);
    let inLift = false;
    if (lift === 'wide') inLift = Math.abs(px) >= c - 2 && Math.abs(pz) >= c - 2;
    else if (lift === 'corner') inLift = Math.abs(px) === c && Math.abs(pz) === c;
    if (inLift) V(px, y + 1, pz, 1, 1, 1, color);
  }
}

const stories = [ { w: 15, h: 7 }, { w: 13, h: 6 }, { w: 11, h: 6 }, { w: 9, h: 5 }, { w: 7, h: 5 } ];
let py = 3;
for (let i = 0; i < 5; i++) {
  const { w, h } = stories[i];
  const hw = w / 2;

  // floor slab (on previous eave / platform)
  V(0, py + 0.5, 0, i === 0 ? w : w + 1, 1, i === 0 ? w : w + 1, i === 0 ? C.stone : C.redDark);
  // walls (recessed 2 from silhouette so corner columns stand proud, no coplanar faces)
  V(0, py + 1 + (h - 2) / 2, 0, w - 4, h - 2, w - 4, C.wall);
  // corner columns
  for (const sx of [-1, 1]) for (const sz of [-1, 1])
    V(sx * (hw - 0.5), py + 1 + (h - 1) / 2, sz * (hw - 0.5), 1, h - 1, 1, C.red);
  // dark beam under the eave (recessed with the walls)
  V(0, py + h - 0.5, 0, w - 4, 1, w - 4, C.redDark);

  // doors / windows on each face
  const faces = [ { fx: 0, fz: 1 }, { fx: 0, fz: -1 }, { fx: 1, fz: 0 }, { fx: -1, fz: 0 } ];
  for (const f of faces) {
    const off = (hw - 2) + 0.18;
    const px = f.fx * off, pz = f.fz * off;
    const sxr = f.fx !== 0 ? 0.3 : 1.8;
    const szr = f.fz !== 0 ? 0.3 : 1.8;
    if (i === 0 && f.fz === 1) {
      V(0, py + 2.7, off, 2.6, 3.4, 0.3, C.woodDark);          // main door
      V(0, py + 4.9, hw - 2 + 0.12, 2.6, 0.7, 0.2, C.gold);    // plaque above door
      V(0, py + 2.7, off + 0.16, 0.3, 3.4, 0.12, C.gold);      // door frame sliver
    } else if (i === 4) {
      V(px, py + h / 2, pz, sxr, 1.1, szr, C.woodDark);         // top-story slits
    } else {
      V(px, py + h / 2 - 0.4, pz, sxr, 1.8, szr, C.woodDark);   // window
    }
  }

  // stacked eaves with upturned corners
  const rb = py + h;
  eaveRing(hw + 2, rb, C.roof, 'wide');
  eaveRing(hw + 1, rb + 1, C.roof, 'corner');
  eaveRing(hw,     rb + 2, C.roof, null);

  py = rb + 3;
}

/* ================= spire (sorin) ================= */
V(0, py + 0.3, 0, 6, 0.6, 6, C.bronze);
V(0, py + 0.9, 0, 4.5, 0.6, 4.5, C.bronze);
V(0, py + 1.5, 0, 3, 0.6, 3, C.bronze);
V(0, py + 4.4, 0, 1, 5.2, 1, C.bronze);
V(0, py + 7.5, 0, 1.3, 1.3, 1.3, C.gold);
V(0, py + 8.6, 0, 0.35, 1.2, 0.35, C.bronze);
V(0, py + 9.4, 0, 0.5, 0.5, 0.5, C.gold);

/* ================= torii gate ================= */
(function torii() {
  const z0 = 26;
  V(-4.5, 0.25, z0, 2.2, 0.5, 2.2, C.stone);
  V( 4.5, 0.25, z0, 2.2, 0.5, 2.2, C.stone);
  V(-4.5, 4.0, z0, 1.2, 7, 1.2, C.torii, 0, 0, 0.05);
  V( 4.5, 4.0, z0, 1.2, 7, 1.2, C.torii, 0, 0, -0.05);
  V(0, 5.6, z0, 10.6, 0.8, 1.0, C.torii);          // nuki
  V(0, 6.6, z0, 1.7, 1.2, 0.5, C.plaque);          // hanging sign
  V(0, 6.6, z0 + 0.26, 1.1, 0.6, 0.1, C.torii);    // red mark on sign front
  V(0, 7.4, z0, 10.6, 0.6, 1.0, C.torii);          // tie under kasagi
  V(0, 8.0, z0, 11.6, 0.8, 1.3, C.kasagi);         // top beam
  V(-6.3, 8.3, z0, 0.9, 0.8, 1.3, C.kasagi);       // upturned tips
  V( 6.3, 8.3, z0, 0.9, 0.8, 1.3, C.kasagi);
  V(0, 8.55, z0, 12.4, 0.3, 1.5, C.shimaki);       // cap
  V(-6.5, 8.8, z0, 1.0, 0.3, 1.4, C.shimaki);
  V( 6.5, 8.8, z0, 1.0, 0.3, 1.4, C.shimaki);
})();

/* ================= stone path ================= */
for (let z = 11; z < 24; z += 2) V(0, 0.04, z, 4, 0.08, 1.6, C.path);

/* ================= pond + bridge + lily pads ================= */
(function pond() {
  const px = -15, pz = 14;
  V(px, -0.5, pz, 10, 0.9, 10, C.waterDeep);   // basin (top at -0.05, below water line)
  V(px, -0.03, pz, 9.6, 0.08, 9.6, C.water);   // water surface (top at +0.01)
  for (let x = -4.5; x <= 4.5; x += 1.5) {
    V(px + x, 0.25, pz + 5.25, 1.3, 0.5, 1.0, C.stone);
    V(px + x, 0.25, pz - 5.25, 1.3, 0.5, 1.0, C.stone);
  }
  for (let z = -3.75; z <= 3.75; z += 1.5) {
    V(px + 5.25, 0.25, pz + z, 1.0, 0.5, 1.3, C.stone);
    V(px - 5.25, 0.25, pz + z, 1.0, 0.5, 1.3, C.stone);
  }
  V(px + 2, 0.05, pz - 2, 1.2, 0.06, 1.2, C.lily);
  V(px - 2.5, 0.05, pz + 1.5, 1.0, 0.06, 1.0, C.lily);
  V(px - 2.2, 0.1, pz + 1.8, 0.3, 0.08, 0.3, C.pinkD);
  // little red footbridge across the pond
  V(px, 0.9, pz + 5.9, 3.2, 0.3, 1.2, C.wood);
  V(px, 1.3, pz + 5.9, 3.2, 0.5, 0.25, C.torii);
  V(px, 1.3, pz + 6.55, 3.2, 0.5, 0.25, C.torii);
  for (const dx of [-1.5, 1.5]) for (const dz of [5.9, 6.55])
    V(px + dx, 1.125, pz + dz, 0.3, 0.75, 0.3, C.torii);
})();

/* ================= stone lanterns ================= */
function lantern(x, z) {
  V(x, 0.3, z, 1.6, 0.6, 1.6, C.stone);
  V(x, 1.2, z, 0.7, 1.2, 0.7, C.stoneLight);
  V(x, 2.2, z, 1.3, 1.0, 1.3, C.stone);
  const glow = new THREE.Mesh(
    new THREE.BoxGeometry(0.7, 0.7, 0.06),
    new THREE.MeshLambertMaterial({ color: 0xffd9a0, emissive: 0xff9d4d, emissiveIntensity: 0.9 })
  );
  glow.position.set(x, 2.2, z + 0.66);
  scene.add(glow);
  V(x, 2.95, z, 1.9, 0.35, 1.9, C.stoneDark);
  V(x, 3.25, z, 0.5, 0.3, 0.5, C.stoneLight);
}
lantern(6.5, 13.5);
lantern(-6.5, 13.5);

/* ================= rocks ================= */
[ [10, -10, 1.6], [13, -8, 1.1], [-9, -12, 1.4], [20, 4, 1.2], [-24, 10, 1.3], [9, 21, 1.0] ]
  .forEach(([x, z, s]) => V(x, s / 2 - 0.15, z, s, s, s * 0.8, C.stone));

/* ================= cherry blossom trees ================= */
function tree(x, z, scale) {
  let ty = 0, w = 1.6 * scale;
  for (let i = 0; i < 5; i++) {
    const h = (1.1 - 0.1 * i) * scale;
    V(x + Math.sin(i * 1.7) * 0.3 * scale, ty + h / 2, z + Math.cos(i * 1.3) * 0.2 * scale,
      w, h, w, C.trunk);
    ty += h - 0.15;
    w *= 0.85;
  }
  V(x + 1.6 * scale, ty - 1.2, z + 0.5 * scale, 2.2 * scale, 0.5 * scale, 0.5 * scale, C.trunk);
  const R = 4.6 * scale;
  const cy = ty + 3.2 * scale;
  const sq = R / (2.6 * scale); // vertical squash factor (>1)
  const shades = [C.pinkA, C.pinkB, C.pinkC, C.pinkD];
  for (let ix = -R; ix <= R; ix += 1)
    for (let iy = -R; iy <= R; iy += 1)
      for (let iz = -R; iz <= R; iz += 1) {
        const d = Math.sqrt(ix * ix + iy * iy * sq + iz * iz) / R;
        if (d > 0.95 || (d > 0.8 && Math.random() < 0.5)) continue;
        const col = shades[(Math.abs((ix * 7 + iz * 13 + iy * 3) | 0) % shades.length)];
        V(x + ix, cy + iy, z + iz, 1, 1, 1, col);
      }
  for (let k = 0; k < 10; k++) {
    const a = Math.random() * Math.PI * 2, r = Math.random() * 3 * scale;
    V(x + Math.cos(a) * r, cy - R * 0.4 - Math.random() * 3, z + Math.sin(a) * r,
      0.35, 0.05, 0.28, C.petal);
  }
}
tree(-24, -6, 1.0);
tree(22, -14, 1.0);
tree(20, 16, 0.85);

/* ================= clouds ================= */
function cloud(x, y, z, s) {
  const blobs = [ [0,0,0,4], [3,0.5,1,2.6], [-3,0.3,-1,2.4], [1.5,1,-1.5,2.2], [-1.8,1,1.5,2.0] ];
  for (const [bx, by, bz, bs] of blobs)
    V(x + bx * s, y + by * s, z + bz * s, bs * s, 1.1 * s, bs * s * 0.8, C.cloud);
}
cloud(-40, 42, -30, 2.2);
cloud(35, 48, -45, 2.6);
cloud(55, 40, 25, 2.0);
cloud(-55, 45, 30, 1.8);

/* ================= bake static voxels ================= */
buildVoxels();

/* ================= drifting petals (dynamic) ================= */
const PETALS = 70;
const petalGeo = new THREE.BoxGeometry(0.42, 0.045, 0.3);
const petalMat = new THREE.MeshLambertMaterial({ color: C.petal });
const petals = new THREE.InstancedMesh(petalGeo, petalMat, PETALS);
petals.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
petals.frustumCulled = false;
scene.add(petals);

const treeSpots = [ [-24, -6, 4.6], [22, -14, 4.6], [20, 16, 3.9] ];
const petalState = [];
const PM = new THREE.Matrix4(), PP = new THREE.Vector3(), PQ = new THREE.Quaternion(),
      PS = new THREE.Vector3(1, 1, 1), PE = new THREE.Euler();
function respawn(p, top) {
  if (top && Math.random() < 0.85) {
    const t = treeSpots[(Math.random() * treeSpots.length) | 0];
    p.x = t[0] + rand(-t[2], t[2]);
    p.z = t[1] + rand(-t[2], t[2]);
    p.y = rand(8, 20);
  } else {
    p.x = rand(-32, 32);
    p.z = rand(-32, 32);
    p.y = rand(14, 26);
  }
  p.vy = rand(0.55, 1.35);
  p.sway = rand(0.6, 1.8);
  p.phase = rand(0, Math.PI * 2);
  p.drift = rand(-0.4, 0.6);
  p.rot = rand(0, Math.PI * 2);
  p.rotV = rand(-1.6, 1.6);
  p.tilt = rand(-0.7, 0.7);
}
for (let i = 0; i < PETALS; i++) {
  const p = {};
  respawn(p, true);
  p.y = rand(0.5, 24);
  petalState.push(p);
}
function updatePetals(dt, t) {
  for (let i = 0; i < PETALS; i++) {
    const p = petalState[i];
    p.y -= p.vy * dt;
    p.x += (Math.sin(t * p.sway + p.phase) * 0.9 + p.drift) * dt;
    p.z += Math.cos(t * p.sway * 0.8 + p.phase) * 0.7 * dt;
    p.rot += p.rotV * dt;
    if (p.y < 0.12) respawn(p, true);
    PP.set(p.x, p.y, p.z);
    PE.set(p.tilt * Math.sin(t * 0.9 + p.phase), p.rot, 0);
    PQ.setFromEuler(PE);
    PM.compose(PP, PQ, PS);
    petals.setMatrixAt(i, PM);
  }
  petals.instanceMatrix.needsUpdate = true;
}

/* ================= camera orbit + resize ================= */
function positionCamera(t) {
  const a = 0.9 + t * 0.12;
  const R = 92;
  camera.position.set(Math.cos(a) * R, 24 + Math.sin(t * 0.05) * 2.5, Math.sin(a) * R);
  camera.lookAt(LOOK);
}
function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

/* ================= main loop ================= */
const t0 = performance.now() / 1000;
let prevTime = t0;
function animate() {
  const now = performance.now() / 1000;
  const dt = Math.min(now - prevTime, 0.1);
  prevTime = now;
  const t = now - t0;
  positionCamera(t);
  updatePetals(dt, t);
  renderer.render(scene, camera);
}
resize();
positionCamera(0);
renderer.render(scene, camera);
renderer.setAnimationLoop(animate);
</script>
</body>
</html>
